    this.shell = shell;                                           // so commands can reach the shell
    this.fs = shell.fs;                                           // the file system
    this.process = process;                                       // this command's process entry
    this.job = job;                                               // the job it belongs to
    this.args = [];                                               // the words, e.g. ["ls", "-l"]
    this.sink = null;                                             // where ordinary output goes
    this.errSink = null;                                          // where error messages go
    this.source = { kind: "keyboard" };                           // where input comes from
  }

  /* ---------- printing ---------- */

  write(text) {                                                   // print ordinary output
    if (text === undefined || text === "") return;                // nothing to print
    this.sink.write(text);                                        // the screen, a file or a pipe
  }

  writeColor(text, cls) {                                         // print in a colour
    this.sink.writeHtml('<span class="' + cls + '">' + esc(text) + "</span>", text);
  }

  writeHtml(html, plain) {                                        // print ready-made HTML (used by man)
    this.sink.writeHtml(html, plain === undefined ? "" : plain);  // files get the plain version
  }

  error(text) {                                                   // print an error message
    if (text === undefined || text === "") return;                // nothing to print
    this.errSink.write(text);                                     // the screen in red, or a file
  }

  /* ---------- reading ---------- */

  // Read one line of input. Returns null when the input has finished,
  // which happens at the end of a file, at the end of a pipe, or on Ctrl-D.
  async readLine() {                                              // no arguments
    if (this.source.kind === "text") {                            // input is coming from a file
      const text = this.source.text;                              // the whole file
      if (this.source.pos >= text.length) return null;            // nothing left: end of file
      const newline = text.indexOf("\n", this.source.pos);        // find the end of the next line
      const line = newline === -1                                 // no newline left?
        ? text.slice(this.source.pos)                             // take the rest
        : text.slice(this.source.pos, newline);                   // take up to the newline
      this.source.pos = newline === -1 ? text.length : newline + 1;  // remember how far we read
      return line;                                                // hand the line back
    }
    if (this.source.kind === "pipe") {                            // input comes from another command
      return await this.source.pipe.readLine();                   // ask the pipe for a line
    }
    return await this.shell.readFromKeyboard(this);               // otherwise wait for typing
  }

  /* ---------- signals: Ctrl-C and Ctrl-Z ---------- */

  // A command calls this during long work. It stops the command when Ctrl-C was
  // pressed, and waits here while the job is paused by Ctrl-Z.
  async checkSignals() {                                          // no arguments
    if (this.process.killedBy)                                    // did a signal arrive?
      throw new SignalError(this.process.killedBy);               // stop this command at once
    while (this.job && this.job.state === "stopped") {            // paused by Ctrl-Z?
      await new Promise(go => this.job.resumeWaiters.push(go));   // sleep until fg or bg wakes us
      if (this.process.killedBy)                                  // a signal may have arrived meanwhile
        throw new SignalError(this.process.killedBy);             // stop now
    }
  }

  // Sleep for a while, but wake up early if Ctrl-C is pressed.
  async sleep(ms) {                                               // milliseconds to wait
    const step = 200;                                             // check for signals five times a second
    let left = ms;                                                // how much time is left
    while (left > 0) {                                            // until the time is used up
      await this.checkSignals();                                  // react to Ctrl-C / Ctrl-Z
      await wait(Math.min(step, left));                           // wait a short moment
      left -= step;                                               // count it off
      this.process.cpuTime += 0.001;                              // pretend we used a little processor
    }
    await this.checkSignals();                                    // one last check before returning
  }
}

/* =====================================================================
   SECTION 7 : THE COMMANDS
   Each command is one entry in the COMMANDS list below. Every entry has:
     run  : the function that does the work (returns the exit number)
     help : one line shown by `help`
   An exit number of 0 means success. Anything else means something failed,
   which is exactly how Linux works.
   ===================================================================== */

const COMMANDS = {};                                              // every command lives in here

// A small helper so each command can be written in one neat block.
function defineCommand(name, help, run) {                         // name, one-line help, the function
  COMMANDS[name] = { name: name, help: help, run: run };          // store it in the list
}

// Split the words into options (starting with "-") and ordinary arguments.
function splitArgs(args) {                                        // args = ["-l", "-a", "file.txt"]
  const flags = new Set();                                        // the letters used, e.g. l and a
  const rest = [];                                                // the real arguments
  const unknown = [];                                             // options we do not understand
  for (let i = 1; i < args.length; i++) {                         // skip args[0], the command name
    const arg = args[i];                                          // the current word
    if (arg === "--") { rest.push(...args.slice(i + 1)); break; } // "--" means "no more options"
    if (arg.length > 1 && arg[0] === "-" && arg[1] !== "-") {     // a short option like -la
      for (const letter of arg.slice(1)) flags.add(letter);       // -la counts as -l and -a
    } else if (arg.startsWith("--")) {                            // a long option like --help
      flags.add(arg);                                             // keep the whole thing
    } else {                                                      // an ordinary argument
      rest.push(arg);                                             // keep it in order
    }
  }
  return { flags: flags, rest: rest, unknown: unknown };          // hand all three back
}

/* ---------------------------------------------------------------------
   pwd : print the folder you are in
   --------------------------------------------------------------------- */
defineCommand("pwd", "print the full path of the current folder", async ctx => {
  ctx.write(ctx.fs.cwd + "\n");                                   // simply print where we are
  return 0;                                                       // success
});

/* ---------------------------------------------------------------------
   ls : list the files in a folder
   Supports -l (details), -a (hidden files), -A, -1, -h (human sizes),
   -R (go into sub-folders) and -r (reverse order).
   --------------------------------------------------------------------- */
defineCommand("ls", "list the files in a folder", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const long = flags.has("l");                                    // -l : one file per line, with details
  const all = flags.has("a");                                     // -a : include "." and ".."
  const almostAll = flags.has("A");                               // -A : hidden files but not "." and ".."
  const human = flags.has("h");                                   // -h : sizes like 1.2K
  const recursive = flags.has("R");                               // -R : also list sub-folders
  const reverse = flags.has("r");                                 // -r : reverse the order
  // Real ls prints columns only when it is writing to a terminal. As soon as the
  // output goes into a pipe or a file it prints one name per line, which is why
  // "ls | wc -l" counts files correctly.
  const toTerminal = ctx.sink instanceof ScreenSink;              // is the output a screen?
  const onePerLine = flags.has("1") || long || !toTerminal;       // -1 : one name per line
  const targets = rest.length ? rest : ["."];                     // no argument means "this folder"
  let status = 0;                                                 // the exit number we will return

  // Make a size look friendly: 2048 becomes "2.0K".
  function niceSize(bytes) {                                      // the number of bytes
    if (!human) return String(bytes);                             // without -h, print the plain number
    const units = ["", "K", "M", "G"];                            // the suffixes we use
    let value = bytes, unit = 0;                                  // start with bytes
    while (value >= 1024 && unit < units.length - 1) {            // while it is big enough
      value /= 1024; unit++;                                      // move to the next unit
    }
    return unit === 0 ? String(value)                             // bytes have no decimal point
      : (value < 10 ? value.toFixed(1) : Math.round(value)) + units[unit];
  }

  // Colour a name the way Ubuntu's ls does: folders blue, programs green.
  function colored(name, node) {                                  // the name and the file object
    if (node.type === "dir") return { text: name, cls: "c-blue bold" };      // folders are blue
    if (node.mode & 0o111) return { text: name, cls: "c-green bold" };       // programs are green
    if (/\.(tar|gz|zip|deb)$/.test(name)) return { text: name, cls: "c-red bold" }; // archives are red
    return { text: name, cls: null };                             // everything else is plain
  }

  // Print the contents of one folder.
  function listFolder(path, showHeader) {                         // folder path, print its name first?
    const names = ctx.fs.list(path, all || almostAll);            // the names inside
    if (names === null) return;                                   // not a folder (handled by the caller)
    let shown = names.slice();                                    // a copy we can change
    if (all) shown = [".", ".."].concat(shown);                   // -a adds the two special entries
    if (reverse) shown.reverse();                                 // -r turns the order around

    if (showHeader) ctx.write(path + ":\n");                      // with -R, print the folder name

    if (long) {                                                   // ----- the detailed listing -----
      let total = 0;                                              // the "total" number at the top
      const rows = [];                                            // the finished lines
      for (const name of shown) {                                 // for every name
        const node = name === "." ? ctx.fs.get(path)              // "." is this folder
                   : name === ".." ? ctx.fs.get(path + "/..")     // ".." is the folder above
                   : ctx.fs.get(path + "/" + name);               // anything else is inside
        if (!node) continue;                                      // skip anything missing
        const size = ctx.fs.size(node);                           // how big it is
        total += Math.max(4, Math.ceil(size / 1024)) ;            // Linux counts disk blocks here
        rows.push({ node: node, name: name, size: size });        // remember the row
      }
      ctx.write("total " + total + "\n");                         // Linux prints this line first
      const widest = rows.reduce((w, r) => Math.max(w, niceSize(r.size).length), 1); // align sizes
      for (const row of rows) {                                   // print every row
        const c = colored(row.name, row.node);                    // its colour
        ctx.write(ctx.fs.modeString(row.node) + " " +             // -rw-r--r--
          (row.node.type === "dir" ? "2" : "1") + " " +           // link count (2 for folders)
          USER + " " + USER + " " +                               // owner and group
          padLeft(niceSize(row.size), widest) + " " +             // the size, right aligned
          lsDate(row.node.mtime) + " ");                          // the date
        if (c.cls) ctx.writeColor(c.text, c.cls);                 // the name, in colour
        else ctx.write(c.text);                                   // or plain
        ctx.write("\n");                                          // end the line
      }
    } else if (onePerLine) {                                      // ----- one name per line -----
      for (const name of shown) {                                 // for every name
        const node = ctx.fs.get(path + "/" + name) || { type: "dir", mode: 0o755 };
        const c = colored(name, node);                            // work out its colour
        if (c.cls) ctx.writeColor(c.text + "\n", c.cls);          // print it in colour
        else ctx.write(c.text + "\n");                            // or plain
      }
    } else {                                                      // ----- names in columns -----
      if (shown.length === 0) return;                             // an empty folder prints nothing
      const widest = Math.max(...shown.map(n => n.length)) + 2;   // column width
      const perLine = Math.max(1, Math.floor(80 / widest));       // how many fit on one line
      for (let i = 0; i < shown.length; i++) {                    // for every name
        const name = shown[i];                                    // the name
        const node = ctx.fs.get(path + "/" + name) || { type: "dir", mode: 0o755 };
        const c = colored(name, node);                            // its colour
        const padded = padRight(name, (i + 1) % perLine === 0 ? name.length : widest);
        if (c.cls) ctx.writeColor(padded, c.cls);                 // print it in colour
        else ctx.write(padded);                                   // or plain
        if ((i + 1) % perLine === 0 || i === shown.length - 1) ctx.write("\n"); // end the line
      }
    }

    if (recursive) {                                              // -R : do the same inside each folder
      for (const name of names) {                                 // for every name in this folder
        const child = ctx.fs.get(path + "/" + name);              // look it up
        if (child && child.type === "dir") {                      // only folders
          ctx.write("\n");                                        // blank line between folders
          listFolder((path === "/" ? "" : path) + "/" + name, true); // list it too
        }
      }
    }
  }

  for (let i = 0; i < targets.length; i++) {                      // every path the user gave
    const target = targets[i];                                    // the current one
    const node = ctx.fs.get(target);                              // look it up
    if (!node) {                                                  // it does not exist
      ctx.error("ls: cannot access '" + target + "': No such file or directory\n");
      status = 2;                                                 // GNU ls uses 2 for this
      continue;                                                   // try the next one
    }
    if (node.type === "file") {                                   // a single file, not a folder
      if (long) {                                                 // -l prints its details
        ctx.write(ctx.fs.modeString(node) + " 1 " + USER + " " + USER + " " +
          niceSize(ctx.fs.size(node)) + " " + lsDate(node.mtime) + " " + target + "\n");
      } else ctx.write(target + "\n");                            // otherwise just the name
      continue;                                                   // next path
    }
    if (targets.length > 1 || recursive) {                        // several folders: print headers
      if (i > 0) ctx.write("\n");                                 // blank line between them
      ctx.write(ctx.fs.resolve(target) + ":\n");                  // the folder name
    }
    listFolder(ctx.fs.resolve(target), false);                    // print the folder itself
  }
  return status;                                                  // 0 if everything was found
});

/* ---------------------------------------------------------------------
   mkdir : create a folder
   --------------------------------------------------------------------- */
defineCommand("mkdir", "create a new folder", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const parents = flags.has("p");                                 // -p : create missing folders above too
  if (rest.length === 0) {                                        // nothing to create
    ctx.error("mkdir: missing operand\nTry 'mkdir --help' for more information.\n");
    return 1;                                                     // failure
  }
  let status = 0;                                                 // what we will return
  for (const path of rest) {                                      // for every folder asked for
    if (parents) {                                                // with -p nothing is an error
      ctx.fs.mkdirp(path);                                        // create the whole chain
      continue;                                                   // next one
    }
    const result = ctx.fs.mkdir(path);                            // try to create just this one
    if (result === "exists") {                                    // the name is already taken
      ctx.error("mkdir: cannot create directory '" + path + "': File exists\n");
      status = 1;                                                 // remember the failure
    } else if (result === "no-parent") {                          // the folder above is missing
      ctx.error("mkdir: cannot create directory '" + path + "': No such file or directory\n");
      status = 1;                                                 // remember the failure
    }
  }
  return status;                                                  // 0 if every folder was created
});

/* ---------------------------------------------------------------------
   rmdir : remove an empty folder
   --------------------------------------------------------------------- */
defineCommand("rmdir", "remove an empty folder", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the folders to remove
  if (rest.length === 0) { ctx.error("rmdir: missing operand\n"); return 1; } // nothing given
  let status = 0;                                                 // what we will return
  for (const path of rest) {                                      // for every folder
    const node = ctx.fs.get(path);                                // look it up
    if (!node) {                                                  // it is not there
      ctx.error("rmdir: failed to remove '" + path + "': No such file or directory\n");
      status = 1; continue;                                       // try the next one
    }
    if (node.type !== "dir") {                                    // it is a file, not a folder
      ctx.error("rmdir: failed to remove '" + path + "': Not a directory\n");
      status = 1; continue;                                       // try the next one
    }
    if (Object.keys(node.children).length > 0) {                  // the folder still has things in it
      ctx.error("rmdir: failed to remove '" + path + "': Directory not empty\n");
      status = 1; continue;                                       // try the next one
    }
    ctx.fs.remove(path);                                          // remove the empty folder
  }
  return status;                                                  // 0 if all were removed
});

/* ---------------------------------------------------------------------
   rm : delete files (and folders with -r)
   --------------------------------------------------------------------- */
defineCommand("rm", "delete files or folders", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const recursive = flags.has("r") || flags.has("R");             // -r : also delete folders
  const force = flags.has("f");                                   // -f : never complain
  if (rest.length === 0) {                                        // nothing to delete
    if (force) return 0;                                          // -f makes that silently fine
    ctx.error("rm: missing operand\n");                           // otherwise complain
    return 1;                                                     // failure
  }
  let status = 0;                                                 // what we will return
  for (const path of rest) {                                      // for every name given
    const node = ctx.fs.get(path);                                // look it up
    if (!node) {                                                  // it is not there
      if (!force) {                                               // -f stays quiet about this
        ctx.error("rm: cannot remove '" + path + "': No such file or directory\n");
        status = 1;                                               // remember the failure
      }
      continue;                                                   // next name
    }
    if (node.type === "dir" && !recursive) {                      // folders need -r
      ctx.error("rm: cannot remove '" + path + "': Is a directory\n");
      status = 1; continue;                                       // next name
    }
    if (ctx.fs.resolve(path) === "/") {                           // refuse to delete everything
      ctx.error("rm: it is dangerous to operate recursively on '/'\n");
      status = 1; continue;                                       // next name
    }
    ctx.fs.remove(path);                                          // delete it
  }
  return status;                                                  // 0 if everything was deleted
});

/* ---------------------------------------------------------------------
   cp : copy files
   --------------------------------------------------------------------- */
defineCommand("cp", "copy a file or folder", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const recursive = flags.has("r") || flags.has("R");             // -r : copy folders too
  if (rest.length < 2) {                                          // we need a source and a target
    ctx.error("cp: missing destination file operand after '" + (rest[0] || "") + "'\n");
    return 1;                                                     // failure
  }
  const target = rest[rest.length - 1];                           // the last name is the destination
  const sources = rest.slice(0, -1);                              // everything before it is a source
  const intoFolder = ctx.fs.isDir(target);                        // are we copying into a folder?
  if (sources.length > 1 && !intoFolder) {                        // many sources need a folder
    ctx.error("cp: target '" + target + "' is not a directory\n");
    return 1;                                                     // failure
  }
  let status = 0;                                                 // what we will return
  for (const source of sources) {                                 // for every file to copy
    const node = ctx.fs.get(source);                              // look it up
    if (!node) {                                                  // it is not there
      ctx.error("cp: cannot stat '" + source + "': No such file or directory\n");
      status = 1; continue;                                       // next file
    }
    if (node.type === "dir" && !recursive) {                      // folders need -r
      ctx.error("cp: -r not specified; omitting directory '" + source + "'\n");
      status = 1; continue;                                       // next file
    }
    const base = source.split("/").filter(Boolean).pop();         // the file name on its own
    const dest = intoFolder ? target + "/" + base : target;       // where the copy goes
    if (!ctx.fs.copy(source, dest)) {                             // do the copy
      ctx.error("cp: cannot create '" + dest + "': No such file or directory\n");
      status = 1;                                                 // remember the failure
    }
  }
  return status;                                                  // 0 if every copy worked
});

/* ---------------------------------------------------------------------
   mv : move or rename
   --------------------------------------------------------------------- */
defineCommand("mv", "move a file, or give it a new name", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the names given
  if (rest.length < 2) {                                          // we need two names
    ctx.error("mv: missing destination file operand after '" + (rest[0] || "") + "'\n");
    return 1;                                                     // failure
  }
  const target = rest[rest.length - 1];                           // the last name is the destination
  const sources = rest.slice(0, -1);                              // everything else is a source
  const intoFolder = ctx.fs.isDir(target);                        // moving into a folder?
  if (sources.length > 1 && !intoFolder) {                        // many sources need a folder
    ctx.error("mv: target '" + target + "' is not a directory\n");
    return 1;                                                     // failure
  }
  let status = 0;                                                 // what we will return
  for (const source of sources) {                                 // for every file to move
    if (!ctx.fs.exists(source)) {                                 // it is not there
      ctx.error("mv: cannot stat '" + source + "': No such file or directory\n");
      status = 1; continue;                                       // next file
    }
    const base = source.split("/").filter(Boolean).pop();         // the file name on its own
    const dest = intoFolder ? target + "/" + base : target;       // where it is going
    if (ctx.fs.resolve(source) === ctx.fs.resolve(dest)) continue;// moving onto itself: do nothing
    if (!ctx.fs.copy(source, dest)) {                             // copy it to the new place
      ctx.error("mv: cannot move '" + source + "' to '" + dest + "'\n");
      status = 1; continue;                                       // next file
    }
    ctx.fs.remove(source);                                        // then delete the original
  }
  return status;                                                  // 0 if every move worked
});

/* ---------------------------------------------------------------------
   touch : create an empty file, or update its time
   --------------------------------------------------------------------- */
defineCommand("touch", "create an empty file", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the file names
  if (rest.length === 0) { ctx.error("touch: missing file operand\n"); return 1; } // nothing given
  let status = 0;                                                 // what we will return
  for (const path of rest) {                                      // for every name
    const node = ctx.fs.get(path);                                // is it already there?
    if (node) node.mtime = Date.now();                            // yes: just update the time
    else if (!ctx.fs.writeFile(path, "")) {                       // no: create it empty
      ctx.error("touch: cannot touch '" + path + "': No such file or directory\n");
      status = 1;                                                 // the folder above is missing
    }
  }
  return status;                                                  // 0 if all files exist now
});

/* ---------------------------------------------------------------------
   cat : show a file, or copy what you type
   With no file name it reads the keyboard until you press Ctrl-D, which is
   how `cat >> notes.txt` works.
   --------------------------------------------------------------------- */
defineCommand("cat", "show the contents of a file", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const numbered = flags.has("n");                                // -n : put line numbers in front
  let lineNumber = 1;                                             // the next line number to print
  let status = 0;                                                 // what we will return

  if (rest.length === 0) {                                        // no file: read what is typed
    for (;;) {                                                    // keep going until the input ends
      await ctx.checkSignals();                                   // notice Ctrl-C and Ctrl-Z
      const line = await ctx.readLine();                          // read one line
      if (line === null) break;                                   // Ctrl-D (or end of pipe): stop
      ctx.write(numbered ? padLeft(lineNumber++, 6) + "\t" + line + "\n" : line + "\n");
    }
    return 0;                                                     // success
  }

  for (const path of rest) {                                      // for every file named
    await ctx.checkSignals();                                     // stay responsive to Ctrl-C
    const node = ctx.fs.get(path);                                // look the file up
    if (!node) {                                                  // it is not there
      ctx.error("cat: " + path + ": No such file or directory\n");
      status = 1; continue;                                       // next file
    }
    if (node.type === "dir") {                                    // it is a folder
      ctx.error("cat: " + path + ": Is a directory\n");
      status = 1; continue;                                       // next file
    }
    if (!numbered) { ctx.write(node.content); continue; }         // the simple case: print it all
    for (const line of node.content.replace(/\n$/, "").split("\n")) // -n : one line at a time
      ctx.write(padLeft(lineNumber++, 6) + "\t" + line + "\n");   // number, tab, then the line
  }
  return status;                                                  // 0 if every file was shown
});

/* ---------------------------------------------------------------------
   echo : print the words you give it
   --------------------------------------------------------------------- */
defineCommand("echo", "print a line of text", async ctx => {
  let args = ctx.args.slice(1);                                   // everything after the word "echo"
  let newline = true;                                             // normally we end with a new line
  let escapes = false;                                            // -e turns \n into a real new line
  while (args.length && (args[0] === "-n" || args[0] === "-e")) { // read the options at the front
    if (args[0] === "-n") newline = false;                        // -n : do not end with a new line
    if (args[0] === "-e") escapes = true;                         // -e : understand \n, \t and so on
    args = args.slice(1);                                         // drop the option and look again
  }
  let text = args.join(" ");                                      // join the words with single spaces
  if (escapes) text = text.replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\\\/g, "\\");
  ctx.write(text + (newline ? "\n" : ""));                        // print it
  return 0;                                                       // success
});

/* ---------------------------------------------------------------------
   head and tail : the first or last lines of a file
   --------------------------------------------------------------------- */
async function headOrTail(ctx, isHead) {                          // shared by both commands
  const args = ctx.args.slice(1);                                 // everything after the name
  let count = 10;                                                 // Linux shows 10 lines by default
  const files = [];                                               // the files asked for
  for (let i = 0; i < args.length; i++) {                         // read the words one by one
    if (args[i] === "-n" && args[i + 1]) count = parseInt(args[++i], 10); // "-n 5"
    else if (/^-\d+$/.test(args[i])) count = parseInt(args[i].slice(1), 10); // "-5"
    else files.push(args[i]);                                     // anything else is a file name
  }
  const name = isHead ? "head" : "tail";                          // for error messages
  let status = 0;                                                 // what we will return

  async function show(text, label) {                              // print part of one piece of text
    const lines = text.replace(/\n$/, "").split("\n");            // split it into lines
    const part = isHead ? lines.slice(0, count) : lines.slice(-count); // the first or the last ones
    if (label) ctx.write("==> " + label + " <==\n");              // a header when there are many files
    if (text !== "") ctx.write(part.join("\n") + "\n");           // print the chosen lines
  }

  if (files.length === 0) {                                       // no file: read the pipe or keyboard
    const lines = [];                                             // collect the lines here
    for (;;) {                                                    // until the input ends
      const line = await ctx.readLine();                          // read one line
      if (line === null) break;                                   // input finished
      lines.push(line);                                           // keep it
      // head only needs the first few lines. Stopping here closes the pipe, which
      // is what makes "yes | head -3" finish instead of running forever.
      if (isHead && lines.length >= count) break;                 // we have enough
    }
    await show(lines.join("\n") + (lines.length ? "\n" : ""), null); // print the chosen part
    return 0;                                                     // success
  }

  for (let i = 0; i < files.length; i++) {                        // for every file named
    const content = ctx.fs.readFile(files[i]);                    // read it
    if (content === null) {                                       // not there, or a folder
      ctx.error(name + ": cannot open '" + files[i] + "' for reading: No such file or directory\n");
      status = 1; continue;                                       // next file
    }
    if (i > 0) ctx.write("\n");                                   // blank line between files
    await show(content, files.length > 1 ? files[i] : null);       // print the chosen part
  }
  return status;                                                  // 0 if every file was read
}
defineCommand("head", "show the first lines of a file", ctx => headOrTail(ctx, true));
defineCommand("tail", "show the last lines of a file", ctx => headOrTail(ctx, false));

/* ---------------------------------------------------------------------
   wc : count lines, words and characters
   --------------------------------------------------------------------- */
defineCommand("wc", "count the lines, words and characters", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const wantLines = flags.has("l");                               // -l : lines only
  const wantWords = flags.has("w");                               // -w : words only
  const wantChars = flags.has("c") || flags.has("m");             // -c : characters only
  const showAll = !wantLines && !wantWords && !wantChars;         // no option: show all three
  let status = 0;                                                 // what we will return

  function counts(text) {                                         // count one piece of text
    const lines = text === "" ? 0 : (text.match(/\n/g) || []).length + (text.endsWith("\n") ? 0 : 1);
    const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length; // split on any spaces
    return { lines: lines, words: words, chars: text.length };    // all three numbers
  }

  function printRow(c, label) {                                   // print one line of output
    let row = "";                                                 // build it up
    if (showAll || wantLines) row += padLeft(c.lines, 8);         // the line count
    if (showAll || wantWords) row += padLeft(c.words, 8);         // the word count
    if (showAll || wantChars) row += padLeft(c.chars, 8);         // the character count
    ctx.write(row + (label ? " " + label : "") + "\n");           // add the file name if we have one
  }

  if (rest.length === 0) {                                        // no file: read the pipe or keyboard
    let text = "";                                                // collect everything here
    for (;;) {                                                    // until the input ends
      const line = await ctx.readLine();                          // read one line
      if (line === null) break;                                   // input finished
      text += line + "\n";                                        // keep it
    }
    printRow(counts(text), null);                                 // print the counts
    return 0;                                                     // success
  }

  const totals = { lines: 0, words: 0, chars: 0 };                // running totals for many files
  for (const path of rest) {                                      // for every file named
    const content = ctx.fs.readFile(path);                        // read it
    if (content === null) {                                       // not there, or a folder
      ctx.error("wc: " + path + ": No such file or directory\n");
      status = 1; continue;                                       // next file
    }
    const c = counts(content);                                    // count it
    totals.lines += c.lines; totals.words += c.words; totals.chars += c.chars; // add to the totals
    printRow(c, path);                                            // print this file's row
  }
  if (rest.length > 1) printRow(totals, "total");                 // a "total" row at the end
  return status;                                                  // 0 if every file was read
});

/* ---------------------------------------------------------------------
   grep : find the lines that contain some text
   --------------------------------------------------------------------- */
defineCommand("grep", "search for text inside files", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const ignoreCase = flags.has("i");                              // -i : ignore capital letters
  const showNumbers = flags.has("n");                             // -n : show line numbers
  const countOnly = flags.has("c");                               // -c : only count the matches
  const invert = flags.has("v");                                  // -v : show the lines that do NOT match
  if (rest.length === 0) {                                        // we need something to search for
    ctx.error("Usage: grep [OPTION]... PATTERN [FILE]...\n");
    return 2;                                                     // grep uses 2 for a usage error
  }
  const pattern = rest[0];                                        // the text to look for
  const files = rest.slice(1);                                    // the files to look in
  let found = false;                                              // did we match anything at all?
  let status = 0;                                                 // what we will return
  let test;                                                       // the matching test
  try {                                                           // the pattern may be a bad regexp
    test = new RegExp(pattern, ignoreCase ? "i" : "");            // build the test
  } catch (e) {                                                   // it was not valid
    ctx.error("grep: Invalid regular expression\n");
    return 2;                                                     // usage error
  }

  function searchText(text, label) {                              // search one piece of text
    const lines = text.replace(/\n$/, "").split("\n");            // split into lines
    let matches = 0;                                              // how many matched here
    lines.forEach((line, index) => {                              // check every line
      const hit = test.test(line);                                // does it contain the pattern?
      if (hit === invert) return;                                 // -v turns the answer around
      matches++;                                                  // count it
      found = true;                                               // we found at least one
      if (countOnly) return;                                      // -c prints only the number
      let prefix = "";                                            // what goes before the line
      if (label) prefix += label + ":";                           // the file name, when there are many
      if (showNumbers) prefix += (index + 1) + ":";               // the line number, with -n
      if (prefix) ctx.writeColor(prefix, "c-cyan");               // the prefix is purple-blue in Ubuntu
      // Show the matching part in red, exactly as grep does in colour mode.
      if (!invert) {                                              // only when the line really matched
        let rest = line, out = "";                                // what is left, and what we built
        const finder = new RegExp(pattern, ignoreCase ? "gi" : "g"); // a global version of the test
        let last = 0, m;                                          // where we are, and each match
        while ((m = finder.exec(line)) !== null) {                 // for every match in the line
          out += esc(line.slice(last, m.index));                  // the text before the match
          out += '<span class="c-red bold">' + esc(m[0]) + "</span>"; // the match itself, in red
          last = m.index + m[0].length;                           // continue after it
          if (m[0] === "") finder.lastIndex++;                    // never loop forever on an empty match
        }
        out += esc(line.slice(last));                             // the text after the last match
        ctx.writeHtml(out + "\n", line + "\n");                   // colour for the screen, plain for files
      } else {                                                    // with -v nothing is highlighted
        ctx.write(line + "\n");                                   // print the whole line
      }
    });
    if (countOnly) ctx.write((label ? label + ":" : "") + matches + "\n"); // -c prints the count
  }

  if (files.length === 0) {                                       // no file: search what is piped in
    let text = "";                                                // collect the input here
    for (;;) {                                                    // until it ends
      const line = await ctx.readLine();                          // read one line
      if (line === null) break;                                   // input finished
      text += line + "\n";                                        // keep it
    }
    searchText(text, null);                                       // search it
  } else {                                                        // search the named files
    for (const path of files) {                                   // one file at a time
      const content = ctx.fs.readFile(path);                      // read it
      if (content === null) {                                     // not there, or a folder
        ctx.error("grep: " + path + ": No such file or directory\n");
        status = 2; continue;                                     // next file
      }
      searchText(content, files.length > 1 ? path : null);        // search it
    }
  }
  return status !== 0 ? status : (found ? 0 : 1);                 // grep returns 1 when nothing matched
});

/* ---------------------------------------------------------------------
   sort and uniq : put lines in order, and remove repeats
   --------------------------------------------------------------------- */
defineCommand("sort", "put lines in order", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const numeric = flags.has("n");                                 // -n : treat the lines as numbers
  const reverse = flags.has("r");                                 // -r : largest first
  const unique = flags.has("u");                                  // -u : drop repeated lines
  let text = "";                                                  // all the input text

  if (rest.length === 0) {                                        // no file: read the pipe or keyboard
    for (;;) {                                                    // until the input ends
      const line = await ctx.readLine();                          // read a line
      if (line === null) break;                                   // input finished
      text += line + "\n";                                        // keep it
    }
  } else {                                                        // read every file given
    for (const path of rest) {                                    // one at a time
      const content = ctx.fs.readFile(path);                      // read it
      if (content === null) {                                     // not there
        ctx.error("sort: cannot read: " + path + ": No such file or directory\n");
        return 2;                                                 // sort uses 2 for this
      }
      text += content;                                            // add it to the pile
    }
  }

  let lines = text === "" ? [] : text.replace(/\n$/, "").split("\n"); // split into lines
  lines.sort((a, b) => numeric                                    // choose how to compare them
    ? (parseFloat(a) || 0) - (parseFloat(b) || 0)                 // -n compares the numbers
    : a.localeCompare(b));                                        // otherwise compare the text
  if (reverse) lines.reverse();                                   // -r turns the order around
  if (unique) lines = lines.filter((l, i) => i === 0 || l !== lines[i - 1]); // -u drops repeats
  if (lines.length) ctx.write(lines.join("\n") + "\n");           // print them
  return 0;                                                       // success
});

defineCommand("uniq", "remove repeated lines that follow each other", async ctx => {
  const { flags, rest } = splitArgs(ctx.args);                    // read the options
  const showCount = flags.has("c");                               // -c : how many times each appeared
  let text = "";                                                  // all the input text
  if (rest.length === 0) {                                        // no file: read the pipe or keyboard
    for (;;) {                                                    // until the input ends
      const line = await ctx.readLine();                          // read a line
      if (line === null) break;                                   // input finished
      text += line + "\n";                                        // keep it
    }
  } else {                                                        // read the file given
    const content = ctx.fs.readFile(rest[0]);                     // read it
    if (content === null) {                                       // not there
      ctx.error("uniq: " + rest[0] + ": No such file or directory\n");
      return 1;                                                   // failure
    }
    text = content;                                               // use its text
  }
  const lines = text === "" ? [] : text.replace(/\n$/, "").split("\n"); // split into lines
  let previous = null, count = 0;                                 // the line before, and its count
  function flush() {                                              // print the line we were counting
    if (previous === null) return;                                // nothing to print yet
    ctx.write(showCount ? padLeft(count, 7) + " " + previous + "\n" : previous + "\n");
  }
  for (const line of lines) {                                     // walk through the lines
    if (line === previous) { count++; continue; }                 // the same as before: just count it
    flush();                                                      // print the previous one
    previous = line; count = 1;                                   // start counting this one
  }
  flush();                                                        // print the last one
  return 0;                                                       // success
});

/* ---------------------------------------------------------------------
   find : look for files by name
   --------------------------------------------------------------------- */
defineCommand("find", "look for files by name", async ctx => {
  const args = ctx.args.slice(1);                                 // everything after "find"
  const startPaths = [];                                          // where to start looking
  let namePattern = null;                                         // "-name" pattern, if given
  let typeWanted = null;                                          // "-type f" or "-type d"
  for (let i = 0; i < args.length; i++) {                         // read the words one by one
    if (args[i] === "-name" && args[i + 1]) namePattern = args[++i];  // the name to look for
    else if (args[i] === "-type" && args[i + 1]) typeWanted = args[++i]; // f = file, d = folder
    else if (!args[i].startsWith("-")) startPaths.push(args[i]);  // a starting folder
  }
  if (startPaths.length === 0) startPaths.push(".");              // no folder given: start here
  const test = namePattern ? globToRegExp(namePattern) : null;    // build the name test
  let status = 0;                                                 // what we will return

  function walk(path, node) {                                     // look at one file or folder
    const shown = path === "" ? "." : path;                       // "." is printed for the start
    const isDir = node.type === "dir";                            // is it a folder?
    const base = shown.split("/").filter(Boolean).pop() || shown; // the last part of the path
    const nameOk = !test || test.test(base);                      // does the name match?
    const typeOk = !typeWanted || (typeWanted === "d") === isDir; // does the type match?
    if (nameOk && typeOk) {                                       // both match
      if (isDir) ctx.writeColor(shown + "\n", "c-blue bold");     // folders in blue
      else ctx.write(shown + "\n");                               // files in plain text
    }
    if (isDir)                                                    // a folder: look inside it too
      for (const childName of Object.keys(node.children).sort())  // every name inside, in order
        walk(shown === "/" ? "/" + childName : shown + "/" + childName, node.children[childName]);
  }

  for (const start of startPaths) {                               // for every starting place
    const node = ctx.fs.get(start);                               // look it up
    if (!node) {                                                  // not there
      ctx.error("find: '" + start + "': No such file or directory\n");
      status = 1; continue;                                       // next one
    }
    walk(start === "." ? "." : start, node);                      // search from here downwards
  }
  return status;                                                  // 0 if every start folder existed
});

/* ---------------------------------------------------------------------
   tree : draw the folder structure
   --------------------------------------------------------------------- */
defineCommand("tree", "draw the folders as a tree", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the folder to draw
  const start = rest[0] || ".";                                   // "." means this folder
  const node = ctx.fs.get(start);                                 // look it up
  if (!node) {                                                    // not there
    ctx.error(start + "  [error opening dir]\n\n0 directories, 0 files\n");
    return 1;                                                     // failure
  }
  let dirCount = 0, fileCount = 0;                                // what we counted on the way

  function draw(dirNode, prefix) {                                // draw the inside of one folder
    const names = Object.keys(dirNode.children)                   // every name inside
      .filter(n => !n.startsWith("."))                            // tree hides dot files by default
      .sort();                                                    // in alphabetical order
    names.forEach((name, index) => {                              // for every name
      const last = index === names.length - 1;                    // is it the last one?
      const child = dirNode.children[name];                       // the file or folder itself
      ctx.write(prefix + (last ? "└── " : "├── "));               // the little branch drawing
      if (child.type === "dir") {                                 // a folder
        ctx.writeColor(name + "\n", "c-blue bold");               // print it in blue
        dirCount++;                                               // count it
        draw(child, prefix + (last ? "    " : "│   "));           // and draw what is inside
      } else {                                                    // a file
        if (child.mode & 0o111) ctx.writeColor(name + "\n", "c-green bold"); // programs in green
        else ctx.write(name + "\n");                              // ordinary files plain
        fileCount++;                                              // count it
      }
    });
  }

  ctx.writeColor(start + "\n", "c-blue bold");                    // the starting folder
  if (node.type === "dir") draw(node, "");                        // draw everything inside it
  ctx.write("\n" + dirCount + " director" + (dirCount === 1 ? "y" : "ies") +
            ", " + fileCount + " file" + (fileCount === 1 ? "" : "s") + "\n"); // the summary line
  return 0;                                                       // success
});

/* ---------------------------------------------------------------------
   chmod : change what may be done with a file
   --------------------------------------------------------------------- */
defineCommand("chmod", "change the permissions of a file", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the mode and the files
  if (rest.length < 2) {                                          // we need both
    ctx.error("chmod: missing operand\nTry 'chmod --help' for more information.\n");
    return 1;                                                     // failure
  }
  const mode = rest[0];                                           // e.g. "755" or "+x"
  let status = 0;                                                 // what we will return
  for (const path of rest.slice(1)) {                             // for every file named
    const node = ctx.fs.get(path);                                // look it up
    if (!node) {                                                  // not there
      ctx.error("chmod: cannot access '" + path + "': No such file or directory\n");
      status = 1; continue;                                       // next file
    }
    if (/^[0-7]{3,4}$/.test(mode)) {                              // a number like 755
      node.mode = parseInt(mode, 8);                              // read it as base 8, like Linux
    } else if (/^[ugoa]*[+-=][rwx]+$/.test(mode)) {               // a change like +x or u-w
      const add = mode.includes("+");                             // are we adding or removing?
      let bits = 0;                                               // the permissions mentioned
      if (mode.includes("r")) bits |= 0o444;                      // r = read for everyone
      if (mode.includes("w")) bits |= 0o200;                      // w = write for the owner
      if (mode.includes("x")) bits |= 0o111;                      // x = run for everyone
      node.mode = add ? (node.mode | bits) : (node.mode & ~bits); // switch those bits on or off
    } else {                                                      // something we do not understand
      ctx.error("chmod: invalid mode: '" + mode + "'\n");
      return 1;                                                   // failure
    }
  }
  return status;                                                  // 0 if every file was changed
});

/* ---------------------------------------------------------------------
   sleep : do nothing for a while
   This is the easiest way to see job control: start `sleep 30`, press
   Ctrl-Z to pause it, then use jobs, fg and bg.
   --------------------------------------------------------------------- */
defineCommand("sleep", "wait for a number of seconds", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // how long to wait
  if (rest.length === 0) {                                        // nothing given
    ctx.error("sleep: missing operand\nTry 'sleep --help' for more information.\n");
    return 1;                                                     // failure
  }
  const seconds = parseFloat(rest[0]);                            // read the number
  if (isNaN(seconds)) {                                           // it was not a number
    ctx.error("sleep: invalid time interval '" + rest[0] + "'\n");
    return 1;                                                     // failure
  }
  await ctx.sleep(seconds * 1000);                                // wait, watching for Ctrl-C/Ctrl-Z
  return 0;                                                       // success
});

/* ---------------------------------------------------------------------
   ps : show the running programs
   `ps` alone shows this terminal's programs; `ps aux` shows everything.
   --------------------------------------------------------------------- */
defineCommand("ps", "show the running programs", async ctx => {
  const args = ctx.args.slice(1).join(" ");                       // the options, as one piece of text
  const wideFormat = /a/.test(args) && /u/.test(args);            // "aux" or "-aux" means the long form
  const showAll = /a/.test(args) || /e/.test(args);               // "a" or "e" means every process
  const shell = ctx.shell;                                        // the shell, which knows the jobs

  // Build the list of processes to show.
  const rows = [];                                                // every row we will print
  rows.push({                                                     // the shell itself is always there
    pid: shell.pid, name: "-bash", command: "-bash",
    state: "Ss", cpu: 0.0, mem: 0.1, vsz: 22436, rss: 5312, start: shell.startTime, time: 0.12,
  });
  for (const job of shell.jobs.jobs) {                            // every job the shell started
    for (const proc of job.processes) {                           // every process inside that job
      if (proc.state === "Z" && !showAll) continue;               // finished ones only with "a"
      rows.push({                                                 // one row per process
        pid: proc.pid, name: proc.name, command: job.command,
        state: proc.state === "T" ? "T" : (proc.state === "Z" ? "Z" : "S"),
        cpu: proc.state === "R" ? 0.3 : 0.0,                      // running programs use a little CPU
        mem: proc.memory / 80000, vsz: proc.memory * 3, rss: proc.memory,
        start: proc.started, time: proc.cpuTime,
      });
    }
  }
  if (showAll) {                                                  // "ps aux" also shows system programs
    const systemPrograms = [                                      // a believable Ubuntu process list
      [1, "/sbin/init splash", 0.0, 0.3, 167844, 11960, "Ss"],
      [2, "[kthreadd]", 0.0, 0.0, 0, 0, "S"],
      [312, "/lib/systemd/systemd-journald", 0.0, 0.2, 55292, 8704, "Ss"],
      [498, "/lib/systemd/systemd-udevd", 0.0, 0.1, 24948, 6016, "Ss"],
      [721, "/usr/sbin/cron -f", 0.0, 0.0, 8676, 2944, "Ss"],
      [733, "/usr/sbin/sshd -D", 0.0, 0.1, 12172, 7040, "Ss"],
      [905, "/usr/bin/gnome-shell", 1.2, 3.4, 4238932, 271820, "Sl"],
      [1104, "/usr/libexec/gnome-terminal-server", 0.1, 0.8, 612344, 62180, "Sl"],
    ];
    for (const p of systemPrograms)                               // add each one to the list
      rows.push({ pid: p[0], name: p[1].split(" ")[0].split("/").pop(), command: p[1],
                  state: p[6], cpu: p[2], mem: p[3], vsz: p[4], rss: p[5],
                  start: Date.now() - 3600000, time: 0.4 });
  }
  rows.sort((a, b) => a.pid - b.pid);                             // Linux lists them by process number

  // Format the time column as minutes:seconds, like ps does.
  function cpuTime(seconds) {                                     // seconds of processor time
    const whole = Math.floor(seconds);                            // Linux shows whole seconds here
    const hh = String(Math.floor(whole / 3600)).padStart(2, "0"); // hours
    const mm = String(Math.floor(whole / 60) % 60).padStart(2, "0"); // minutes
    const ss = String(whole % 60).padStart(2, "0");               // seconds
    return hh + ":" + mm + ":" + ss;                              // e.g. "00:00:00"
  }
  function startTime(ms) {                                        // when the process began
    const d = new Date(ms);                                       // turn it into a date
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  if (wideFormat) {                                               // ----- the "ps aux" layout -----
    ctx.write(padRight("USER", 9) + padLeft("PID", 5) + " " + padLeft("%CPU", 4) + " " +
              padLeft("%MEM", 4) + " " + padLeft("VSZ", 7) + " " + padLeft("RSS", 6) +
              " TTY      STAT START   TIME COMMAND\n");            // the header line
    for (const r of rows)                                          // then one line per process
      ctx.write(padRight(r.pid < 900 ? "root" : USER, 9) + padLeft(r.pid, 5) + " " +
                padLeft(r.cpu.toFixed(1), 4) + " " + padLeft(r.mem.toFixed(1), 4) + " " +
                padLeft(r.vsz, 7) + " " + padLeft(r.rss, 6) + " " +
                padRight(r.pid < 900 ? "?" : "pts/0", 8) + " " + padRight(r.state, 4) + " " +
                padRight(startTime(r.start), 5) + " " + padLeft(cpuTime(r.time), 6) + " " +
                r.command + "\n");
  } else {                                                         // ----- the short "ps" layout -----
    ctx.write("    PID TTY          TIME CMD\n");                  // the header line
    for (const r of rows)                                          // then one line per process
      ctx.write(padLeft(r.pid, 7) + " " + padRight("pts/0", 8) + " " +
                padLeft(cpuTime(r.time), 8) + " " + r.name + "\n");
  }
  return 0;                                                        // success
});

/* ---------------------------------------------------------------------
   pid : our own helper. Shows process numbers in a simple way.
   --------------------------------------------------------------------- */
defineCommand("pid", "show process ID numbers", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the argument, if any
  const shell = ctx.shell;                                        // the shell knows all the jobs

  if (rest.length === 0) {                                        // no argument: describe the shell
    ctx.write("PID   (this shell)       " + shell.pid + "\n");    // our own number
    ctx.write("PPID  (parent)           " + (shell.pid - 37) + "\n"); // the program that started us
    ctx.write("PGID  (process group)    " + shell.pid + "\n");    // the group we lead
    ctx.write("SID   (session)          " + shell.pid + "\n");    // the session we lead
    const live = shell.jobs.live();                               // any jobs still going?
    if (live.length) {                                            // yes: mention them
      ctx.write("\nJobs started from this shell:\n");             // a small heading
      for (const job of live)                                     // one line per job
        ctx.write("  [" + job.id + "] " + padRight(job.state, 8) + " pgid " +
                  job.pgid + "  " + job.command + "\n");
    }
    return 0;                                                     // success
  }

  const target = rest[0];                                         // what the user asked about
  if (target.startsWith("%")) {                                   // "%1" means job number 1
    const job = shell.jobs.find(parseInt(target.slice(1), 10));   // find that job
    if (!job) { ctx.error("pid: " + target + ": no such job\n"); return 1; } // no such job
    ctx.write("[" + job.id + "] " + job.command + "   (process group " + job.pgid + ")\n");
    for (const proc of job.processes)                             // every process in the job
      ctx.write("    PID " + proc.pid + "  " + padRight(proc.name, 12) +
                (proc.state === "R" ? "running" : proc.state === "T" ? "stopped" : "finished") + "\n");
    return 0;                                                     // success
  }

  const matches = [];                                             // processes with this name
  for (const job of shell.jobs.jobs)                              // look through every job
    for (const proc of job.processes)                             // and every process inside
      if (proc.name === target && proc.state !== "Z") matches.push(proc.pid); // keep the live ones
  if (matches.length === 0) {                                     // nothing matched
    ctx.error("pid: no process named '" + target + "'\n");
    return 1;                                                     // failure
  }
  ctx.write(matches.join(" ") + "\n");                            // print the numbers on one line
  return 0;                                                       // success
});

/* ---------------------------------------------------------------------
   kill : send a signal to a program
   --------------------------------------------------------------------- */
const SIGNALS = {                                                 // the signals we understand
  HUP: 1, INT: 2, QUIT: 3, KILL: 9, USR1: 10, SEGV: 11, USR2: 12,
  PIPE: 13, ALRM: 14, TERM: 15, CHLD: 17, CONT: 18, STOP: 19, TSTP: 20,
};

defineCommand("kill", "send a signal to a program", async ctx => {
  const args = ctx.args.slice(1);                                 // everything after "kill"
  const shell = ctx.shell;                                        // the shell owns the jobs

  if (args.length === 0) {                                        // no arguments at all
    ctx.error("kill: usage: kill [-s sigspec | -n signum | -sigspec] pid | jobspec ... or kill -l\n");
    return 2;                                                     // usage error
  }

  if (args[0] === "-l") {                                         // "kill -l" lists the signals
    const names = Object.keys(SIGNALS).sort((a, b) => SIGNALS[a] - SIGNALS[b]); // in number order
    let line = "";                                                // build four per line
    names.forEach((name, i) => {                                  // for every signal
      line += padRight(padLeft(SIGNALS[name], 2) + ") SIG" + name, 16); // " 2) SIGINT     "
      if ((i + 1) % 4 === 0) { ctx.write(line + "\n"); line = ""; } // four columns then a new line
    });
    if (line) ctx.write(line + "\n");                             // print anything left over
    return 0;                                                     // success
  }

  let signal = "TERM";                                            // Linux sends SIGTERM by default
  let first = 0;                                                  // where the list of targets starts
  if (args[0].startsWith("-")) {                                  // a signal was given
    const given = args[0].slice(1).toUpperCase();                 // "9", "KILL" or "SIGKILL"
    const byNumber = Object.keys(SIGNALS).find(n => String(SIGNALS[n]) === given); // was it a number?
    const name = byNumber || given.replace(/^SIG/, "");           // the plain name
    if (!SIGNALS[name]) {                                         // we do not know it
      ctx.error("kill: " + args[0].slice(1) + ": invalid signal specification\n");
      return 1;                                                   // failure
    }
    signal = name;                                                // remember it
    first = 1;                                                    // the targets start after it
  }
  if (first >= args.length) {                                     // a signal but nothing to send it to
    ctx.error("kill: not enough arguments\n");
    return 2;                                                     // usage error
  }

  let status = 0;                                                 // what we will return
  for (const target of args.slice(first)) {                       // for every target given
    let job = null;                                               // the job we will signal
    if (target.startsWith("%")) {                                 // "%1" means job 1
      job = shell.jobs.find(parseInt(target.slice(1), 10));       // look it up by number
    } else {                                                      // a plain number means a PID
      const pid = parseInt(target, 10);                           // read it
      if (isNaN(pid)) {                                           // it was not a number
        ctx.error("kill: " + target + ": arguments must be process or job IDs\n");
        status = 1; continue;                                     // next target
      }
      job = shell.jobs.byPid(pid);                                // find the job that owns it
      if (!job && pid < 1000) {                                   // a system process
        ctx.error("kill: (" + pid + ") - Operation not permitted\n");
        status = 1; continue;                                     // next target
      }
    }
    if (!job || job.state === "done") {                           // nothing to signal
      ctx.error("kill: " + target + ": no such job\n");
      status = 1; continue;                                       // next target
    }
    shell.sendSignal(job, "SIG" + signal);                        // deliver it to the whole job
  }
  return status;                                                  // 0 if every signal was sent
});

defineCommand("free", "show how much memory is in use", async ctx => {
  const { flags } = splitArgs(ctx.args);                          // read the options
  const human = flags.has("h");                                   // -h : friendly sizes
  function size(kb) {                                             // turn kilobytes into text
    if (!human) return String(kb);                                // without -h print the number
    return (kb / 1048576).toFixed(1) + "Gi";                      // with -h print gigabytes
  }
  ctx.write(padRight("", 15) + padLeft("total", 11) + padLeft("used", 11) +
            padLeft("free", 11) + padLeft("shared", 11) + padLeft("buff/cache", 12) +
            padLeft("available", 12) + "\n");                     // the header line
  ctx.write(padRight("Mem:", 15) + padLeft(size(8057668), 11) + padLeft(size(2143120), 11) +
            padLeft(size(3658420), 11) + padLeft(size(412), 11) + padLeft(size(2256128), 12) +
            padLeft(size(5512904), 12) + "\n");                   // the memory row
  ctx.write(padRight("Swap:", 15) + padLeft(size(2097148), 11) + padLeft(size(0), 11) +
            padLeft(size(2097148), 11) + "\n");                   // the swap row
  return 0;                                                       // success
});

defineCommand("which", "show where a command lives", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the command names asked about
  let status = 0;                                                 // what we will return
  for (const name of rest) {                                      // for every name
    if (SHELL_BUILTINS.includes(name)) {                          // built into the shell itself
      ctx.write(name + ": shell built-in command\n");             // say so
    } else if (COMMANDS[name]) {                                  // one of our programs
      ctx.write("/bin/" + name + "\n");                           // report it in /bin, like Linux
    } else {                                                      // we do not have it
      status = 1;                                                 // which returns 1 when not found
    }
  }
  return status;                                                  // 0 if every name was found
});

defineCommand("yes", "print the same word over and over", async ctx => {

  for (let i = 0; i < 100000; i++) {                              // a very long loop
    await ctx.checkSignals();                                     // Ctrl-C stops it
    ctx.write(word + "\n");                                       // print the word
    if (i % 40 === 39) await wait(0);                             // let the screen catch up

defineCommand("seq", "print a run of numbers", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the numbers given
  if (rest.length === 0) { ctx.error("seq: missing operand\n"); return 1; } // nothing given
  const first = rest.length > 1 ? parseInt(rest[0], 10) : 1;      // where to start
  const last = parseInt(rest[rest.length - 1], 10);               // where to stop
  for (let i = first; i <= last; i++) {                           // count up
    await ctx.checkSignals();                                     // Ctrl-C stops it
    ctx.write(i + "\n");                                          // print each number
  }
  return 0;                                                       // success
});
