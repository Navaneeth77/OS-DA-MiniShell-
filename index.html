<!doctype html>
<!-- ===================================================================== -->
<!-- MiniShell++ : a complete Linux terminal that runs inside the browser.  -->
<!--                                                                        -->
<!-- Everything lives in this ONE file: the virtual file system, the shell, -->
<!-- every command, the process table, the C compiler and the gedit window. -->
<!-- Nothing is taken from the computer it runs on, so the output is the    -->
<!-- same on Windows, macOS, Linux, a phone or a web host.                  -->
<!-- ===================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">                                          <!-- allow all characters -->
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- fit phone screens -->
<title>user@ubuntu: ~</title>                                   <!-- window title, like a real terminal -->
<style>
/* ----------------------------------------------------------------------
   COLOURS AND FONTS
   The exact colours Ubuntu's terminal uses, so the page looks familiar.
   ---------------------------------------------------------------------- */
:root {
  --term-bg: #300A24;          /* Ubuntu terminal background (aubergine) */
  --term-fg: #FFFFFF;          /* normal text colour */
  --bar-bg: #2B2B2B;           /* window title bar */
  --bar-fg: #F6F5F4;           /* title bar text */
  --desk: #1B1B1B;             /* the "desktop" behind the window */
  --green: #26A269;            /* user@host part of the prompt */
  --blue: #2A7BDE;             /* folder part of the prompt */
  --red: #C01C28;              /* error messages */
  --yellow: #A2734C;           /* warnings */
  --cyan: #2AA1B3;             /* links / extra info */
  --grey: #5E5C64;             /* dim text */
  --bright-green: #33DA7A;     /* bright version, used for bold text */
  --bright-blue: #2A7BDE;
  --bright-red: #F66151;
  --bright-cyan: #33C7DE;
  --bright-yellow: #E9AD0C;
  --bright-grey: #D0CFCC;
  --font: "Ubuntu Mono", "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }                                   /* sizes include padding */
[hidden] { display: none !important; }                          /* hidden really means hidden */
html, body { height: 100%; margin: 0; }                         /* fill the whole page */
body {
  background: var(--desk);                                      /* dark desktop colour */
  font-family: var(--font);                                     /* monospace everywhere */
  overflow: hidden;                                             /* the page itself never scrolls */
}

/* ----------------------------------------------------------------------
   THE TERMINAL WINDOW
   ---------------------------------------------------------------------- */
.window {
  position: fixed;                                              /* fills the browser window */
  inset: 0;                                                     /* top/right/bottom/left = 0 */
  display: flex;                                                /* title bar on top, screen below */
  flex-direction: column;
}
.titlebar {
  height: 42px;                                                 /* same height as GNOME's title bar */
  flex: none;                                                   /* never shrink */
  display: grid;                                                /* 3 columns: icon, title, buttons */
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 10px;
  background: var(--bar-bg);
  color: var(--bar-fg);
  user-select: none;                                            /* the title is not selectable text */
  border-bottom: 1px solid #141414;
}
.tb-left { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.tb-title {                                                     /* "user@ubuntu: ~" in the middle */
  font-family: Ubuntu, "Segoe UI", system-ui, sans-serif;
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 60vw;
}
.tb-right { display: flex; justify-content: flex-end; gap: 9px; }
.dot {                                                          /* the three round window buttons */
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255,255,255,.12);
  color: #EEE;
  font-size: 11px;
  line-height: 1;
}
.tb-badge {                                                     /* small "offline / in browser" note */
  font-family: Ubuntu, system-ui, sans-serif;
  font-size: 11px;
  color: #9A9A9A;
  border: 1px solid #454545;
  border-radius: 10px;
  padding: 2px 8px;
}

/* ----------------------------------------------------------------------
   THE SCREEN ITSELF
   ---------------------------------------------------------------------- */
.screen {
  flex: 1;                                                      /* take all remaining height */
  min-height: 0;                                                /* allow it to scroll */
  overflow-y: auto;                                             /* scroll bar when output is long */
  overflow-x: hidden;
  background: var(--term-bg);
  color: var(--term-fg);
  padding: 6px 10px 12px;
  font-size: 16px;
  line-height: 1.32;
  white-space: pre-wrap;                                        /* keep spaces, wrap long lines */
  word-break: break-word;                                       /* never overflow sideways */
  cursor: text;                                                 /* show a text cursor */
  outline: none;
}
.screen::-webkit-scrollbar { width: 10px; }                     /* thin scrollbar (Chrome/Safari) */
.screen::-webkit-scrollbar-thumb { background: #5B3350; border-radius: 5px; }

/* colour classes used by the commands when they print */
.c-green  { color: var(--bright-green); }
.c-blue   { color: #4C9BFF; }
.c-cyan   { color: var(--bright-cyan); }
.c-red    { color: var(--bright-red); }
.c-yellow { color: var(--bright-yellow); }
.c-grey   { color: #9A8E96; }
.c-white  { color: #FFFFFF; }
.bold     { font-weight: 700; }
.under    { text-decoration: underline; }
.rev      { background: #D0CFCC; color: var(--term-bg); }       /* reverse video, used by man */

/* the blinking block cursor */
.cursor { background: var(--term-fg); color: var(--term-bg); }
.screen.unfocused .cursor { background: transparent; outline: 1px solid var(--term-fg); }
.screen.blink-off .cursor { background: transparent; color: inherit; }

/* a hidden text box that actually receives the key presses */
.keycatcher {
  position: absolute; left: -9999px; top: 0;                    /* off screen but focusable */
  width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none;
}

/* ----------------------------------------------------------------------
   THE GEDIT WINDOW (opened by the gedit command)
   ---------------------------------------------------------------------- */
.gedit {
  position: fixed;                                              /* floats above the terminal */
  width: min(720px, calc(100vw - 24px));
  height: min(520px, calc(100vh - 70px));
  background: #FFFFFF;
  color: #2E3436;
  border-radius: 10px 10px 4px 4px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.55);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 50;
}
.gedit.max { left: 0 !important; top: 0 !important; width: 100vw; height: 100vh; border-radius: 0; }
.g-bar {                                                        /* gedit's own title bar */
  height: 44px; flex: none;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 8px;
  background: #EBEBEB;
  border-bottom: 1px solid #CDC7C2;
  font-family: Ubuntu, system-ui, sans-serif;
  user-select: none;
}
.gedit.inactive .g-bar { background: #F6F5F4; color: #929595; } /* greyed out when not in front */
.g-titles { text-align: center; line-height: 1.15; }
.g-name { font-weight: 700; font-size: 14px; }
.g-dir { font-size: 11.5px; color: #6E6E6E; }
.g-btn {                                                        /* Open / Save buttons */
  font: 500 13px Ubuntu, system-ui, sans-serif;
  background: #F6F5F4; border: 1px solid #CDC7C2; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; color: #2E3436;
}
.g-btn:hover { background: #FDFDFD; }
.g-btn.main { background: #3584E4; border-color: #1C6ABF; color: #FFF; }
.g-win { width: 24px; height: 24px; border-radius: 50%; background: #DDDBDA; display: grid;
         place-items: center; cursor: pointer; font-size: 12px; color: #2E3436; }
.g-win:hover { background: #CCC9C7; }
.g-body { flex: 1; min-height: 0; display: flex; overflow: auto; background: #FFF; }
.g-nums {                                                       /* the line-number column */
  flex: none; padding: 6px 8px 6px 12px; text-align: right;
  color: #9A9A9A; background: #FAFAFA; border-right: 1px solid #EEE;
  font: 14px/20px var(--font); white-space: pre; user-select: none;
}
.g-wrap { position: relative; flex: 1; min-width: 0; }          /* holds the code + the colours */
.g-hl, .g-text {                                                /* two layers, exactly on top of each other */
  margin: 0; padding: 6px 10px;
  font: 14px/20px var(--font); tab-size: 4; white-space: pre;
  border: 0; letter-spacing: 0;
}
.g-hl { position: absolute; inset: 0; pointer-events: none; color: #2E3436; min-height: 100%; }
.g-text {                                                       /* invisible text you actually type into */
  position: relative; display: block; width: 100%; min-height: 100%;
  background: transparent; color: transparent; caret-color: #2E3436;
  resize: none; outline: none; overflow: hidden;
}
.g-text::selection { background: rgba(53,132,228,.3); }
.k-key { color: #A52A2A; font-weight: 700; }                    /* if, for, return ... */
.k-type { color: #2E8B57; font-weight: 700; }                   /* int, char, float ... */
.k-str { color: #D1008F; }                                      /* "text in quotes" */
.k-com { color: #0066CC; font-style: italic; }                  /* // comments */
.k-pre { color: #8A2BE2; }                                      /* #include lines */
.k-num { color: #D1008F; }                                      /* numbers */
.g-foot {                                                       /* the status line at the bottom */
  flex: none; display: flex; justify-content: flex-end; gap: 20px;
  padding: 5px 14px; background: #F6F5F4; border-top: 1px solid #CDC7C2;
  font: 12.5px Ubuntu, system-ui, sans-serif; user-select: none;
}
.g-over {                                                       /* dim layer for the pop-up boxes */
  position: absolute; inset: 44px 0 0 0; display: grid; place-items: center;
  background: rgba(255,255,255,.6);
}
.g-over.frozen { background: rgba(40,40,40,.35); backdrop-filter: grayscale(1); }
.g-dialog {
  width: min(400px, 88%); background: #FAFAFA; border-radius: 10px; padding: 18px 18px 12px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 10px 28px rgba(0,0,0,.3);
  font: 13.5px Ubuntu, system-ui, sans-serif; text-align: center;
}
.g-dialog p { color: #5E5C64; margin: 8px 0 14px; line-height: 1.45; }
.g-dialog code { font-family: var(--font); background: #ECECEC; padding: 0 4px; border-radius: 3px; }
.g-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* on small screens make the text a bit smaller so more fits */
@media (max-width: 620px) {
  .screen { font-size: 13px; padding: 4px 7px 10px; }
  .tb-badge { display: none; }
}
</style>
</head>
<body>

<!-- ===================== THE TERMINAL WINDOW ===================== -->
<div class="window">
  <div class="titlebar">
    <div class="tb-left">
      <span class="dot" style="background:#E95420">&gt;_</span>  <!-- little terminal icon -->
      <span class="tb-badge" id="badge">runs fully in your browser</span>
    </div>
    <div class="tb-title" id="title">user@ubuntu: ~</div>        <!-- changes as you cd around -->
    <div class="tb-right">
      <span class="dot">&#8211;</span>                           <!-- minimise (decoration only) -->
      <span class="dot">&#9633;</span>                           <!-- maximise (decoration only) -->
      <span class="dot">&times;</span>                           <!-- close (decoration only) -->
    </div>
  </div>
  <div class="screen" id="screen" tabindex="-1">                 <!-- all the text appears here -->
    <div id="out"></div>                                         <!-- finished output lines -->
    <div id="line"></div>                                        <!-- the line being typed -->
  </div>
</div>

<!-- an invisible text box: it is what the keyboard actually types into -->
<textarea class="keycatcher" id="kb" autocapitalize="off" autocomplete="off" autocorrect="off"
          spellcheck="false" aria-label="Terminal input"></textarea>

<script>
"use strict";                                                    /* catch silly mistakes early */

/* =====================================================================
   SECTION 1 : SMALL HELPERS
   Tiny functions used all over the file.
   ===================================================================== */

const USER = "user";                                             // the login name we pretend to be
const HOST = "ubuntu";                                           // the machine name we pretend to be
const HOME = "/home/" + USER;                                    // the home folder, /home/user
const KERNEL = "5.15.0-91-generic";                              // the Linux version we report
const DISTRO = "Ubuntu 22.04.3 LTS";                             // the distribution we report

// Turn text into something safe to put inside HTML (so < and & do not break the page).
function esc(text) {                                             // takes any text
  return String(text)                                            // make sure it is a string
    .replace(/&/g, "&amp;")                                      // & must be written as &amp;
    .replace(/</g, "&lt;")                                       // < must be written as &lt;
    .replace(/>/g, "&gt;");                                      // > must be written as &gt;
}

// Pad text on the left with spaces until it is `width` characters wide (used by ls -l, ps).
function padLeft(text, width) {                                  // text and the width we want
  text = String(text);                                           // make sure it is a string
  return " ".repeat(Math.max(0, width - text.length)) + text;    // add the missing spaces in front
}

// Pad text on the right with spaces (used for columns that line up on the left).
function padRight(text, width) {                                 // text and the width we want
  text = String(text);                                           // make sure it is a string
  return text + " ".repeat(Math.max(0, width - text.length));    // add the missing spaces after
}

// Pick a random whole number between low and high (used for fake process IDs and memory sizes).
function randomInt(low, high) {                                  // smallest and largest allowed
  return low + Math.floor(Math.random() * (high - low + 1));     // Math.random gives 0.0 .. 0.999
}

// Wait for a number of milliseconds (used by sleep, and to make long commands feel real).
function wait(ms) {                                              // how long to wait
  return new Promise(resolve => setTimeout(resolve, ms));        // a promise that finishes later
}

// Format a date the way `ls -l` does: "Oct 21 14:05".
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function lsDate(ms) {                                            // ms = milliseconds since 1970
  const d = new Date(ms);                                        // turn the number into a date
  const day = padLeft(d.getDate(), 2);                           // day of the month, 2 wide
  const hh = String(d.getHours()).padStart(2, "0");              // hours with a leading zero
  const mm = String(d.getMinutes()).padStart(2, "0");            // minutes with a leading zero
  return MONTHS[d.getMonth()] + " " + day + " " + hh + ":" + mm; // e.g. "Oct 21 14:05"
}

/* =====================================================================
   SECTION 2 : THE VIRTUAL FILE SYSTEM
   A Linux file tree kept in memory. Every file and folder is an object:
     { type:"dir",  name, mode, mtime, children:{...} }
     { type:"file", name, mode, mtime, content:"..." }
   The browser saves the whole tree so your files are still there after
   you close the page.
   ===================================================================== */

// Make a new empty folder object.
function makeDir(mode) {                                          // mode = the permission number
  return { type: "dir", mode: mode === undefined ? 0o755 : mode,  // folders are usually rwxr-xr-x
           mtime: Date.now(), children: {} };                     // children holds what is inside
}

// Make a new file object holding some text.
function makeFile(content, mode) {                                // the text, and the permissions
  return { type: "file", mode: mode === undefined ? 0o644 : mode, // files are usually rw-r--r--
           mtime: Date.now(), content: content || "" };           // content is the text inside
}

class FileSystem {                                                // the whole file tree
  constructor() {                                                 // runs when we create it
    this.root = makeDir();                                        // "/" , the top of the tree
    this.cwd = HOME;                                              // where the shell starts: /home/user
    this.buildDefaultTree();                                      // fill it with the usual Linux folders
  }

  /* ---------- building the starting file system ---------- */
  buildDefaultTree() {                                            // create the folders Linux always has
    const folders = [                                             // the list of folders to create
      "/bin", "/boot", "/dev", "/etc", "/home", HOME, "/lib", "/media", "/mnt",
      "/opt", "/proc", "/root", "/run", "/sbin", "/srv", "/sys", "/tmp",
      "/usr", "/usr/bin", "/usr/lib", "/usr/share", "/usr/share/man", "/var", "/var/log",
      HOME + "/Desktop", HOME + "/Documents", HOME + "/Downloads",
      HOME + "/Music", HOME + "/Pictures", HOME + "/Videos",
    ];
    for (const path of folders) this.mkdirp(path);                // create each one

    // A few text files that really exist on an Ubuntu machine.
    this.writeFile("/etc/hostname", HOST + "\n");                 // the machine name
    this.writeFile("/etc/os-release",                             // which Linux this is
      'PRETTY_NAME="' + DISTRO + '"\nNAME="Ubuntu"\nVERSION_ID="22.04"\nID=ubuntu\n' +
      'HOME_URL="https://www.ubuntu.com/"\n');
    this.writeFile("/etc/passwd",                                 // the list of user accounts
      "root:x:0:0:root:/root:/bin/bash\n" +
      "daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\n" +
      USER + ":x:1000:1000:" + USER + ":" + HOME + ":/bin/bash\n");
    this.writeFile("/etc/group", "root:x:0:\nsudo:x:27:" + USER + "\n" + USER + ":x:1000:\n");

    // Files in the user's home folder, so `ls` shows something on the first run.
    this.writeFile(HOME + "/.bashrc",                             // the shell's start-up file
      "# ~/.bashrc : runs every time you open a terminal\n" +
      "alias ll='ls -alF'\n" +
      "alias la='ls -A'\n" +
      "export PS1='\\u@\\h:\\w\\$ '\n");
    this.writeFile(HOME + "/.profile", "# ~/.profile\n");         // another start-up file
    this.writeFile(HOME + "/welcome.txt",                         // a short note for the user
      "Welcome to MiniShell++\n" +
      "\n" +
      "This is a small Linux terminal that runs completely inside your browser.\n" +
      "Nothing is installed and nothing leaves your computer.\n" +
      "\n" +
      "Try these to begin:\n" +
      "  ls -l          list the files here\n" +
      "  help           show every command\n" +
      "  man ls         read the manual for a command\n" +
      "  demo           a guided tour you can follow\n");
    this.writeFile(HOME + "/Documents/notes.txt",                 // a sample file to practise with
      "Operating Systems - quick notes\n" +
      "1. A process is a running program.\n" +
      "2. fork() makes a copy of a process.\n" +
      "3. exec() turns that copy into a new program.\n" +
      "4. Ctrl-Z pauses a program, fg brings it back.\n");

    // A ready-made C program, so `gcc hello.c` works straight away.
    this.writeFile(HOME + "/hello.c",
      "#include <stdio.h>\n" +
      "\n" +
      "int main() {\n" +
      "    int n;\n" +
      "    printf(\"Enter a number: \");\n" +
      "    scanf(\"%d\", &n);\n" +
      "    printf(\"Square of %d is %d\\n\", n, n * n);\n" +
      "    return 0;\n" +
      "}\n");

    // Pretend programs in /bin so `ls /bin` looks right and `which` can find them.
    const programs = ["bash","cat","chmod","cp","date","echo","grep","gcc","gedit","head","hostname",
                      "kill","ls","mkdir","more","mv","ps","pwd","rm","rmdir","sleep","sort",
                      "tail","touch","uname","uniq","wc","whoami","man","clear","sh","tree","find","cut"];
    for (const name of programs)                                  // for every program name
      this.writeFile("/bin/" + name, "", 0o755);                  // create it with "executable" permissions
  }

  /* ---------- turning text paths into real places in the tree ---------- */

  // Turn any path the user typed into a full, tidy path starting with "/".
  resolve(path) {                                                 // e.g. "../Documents" or "~/a.txt"
    if (path === undefined || path === "") path = ".";            // nothing means "here"
    if (path === "~") path = HOME;                                // "~" means the home folder
    else if (path.startsWith("~/")) path = HOME + path.slice(1);  // "~/x" means "/home/user/x"
    const startsAtRoot = path.startsWith("/");                    // does it start from the top?
    const base = startsAtRoot ? [] : this.cwd.split("/").filter(Boolean); // start from / or from here
    const parts = path.split("/");                                // split on every slash
    for (const part of parts) {                                   // look at each piece
      if (part === "" || part === ".") continue;                  // "" and "." change nothing
      if (part === "..") { base.pop(); continue; }                // ".." goes up one folder
      base.push(part);                                            // anything else goes down one folder
    }
    return "/" + base.join("/");                                  // glue it back together
  }

  // Find the object (file or folder) at a path. Returns null if it is not there.
  get(path) {                                                     // path can be relative or absolute
    const full = this.resolve(path);                              // tidy it up first
    if (full === "/") return this.root;                           // "/" is the root folder itself
    let node = this.root;                                         // start at the top
    for (const part of full.split("/").filter(Boolean)) {         // walk down one name at a time
      if (node.type !== "dir") return null;                       // can't go inside a file
      node = node.children[part];                                 // step into the next name
      if (!node) return null;                                     // not found
    }
    return node;                                                  // we arrived
  }

  // Find the folder that *contains* a path, plus the final name.
  parentOf(path) {                                                // e.g. "/home/user/a.txt"
    const full = this.resolve(path);                              // tidy it up
    const cut = full.lastIndexOf("/");                            // position of the last slash
    const dirPath = cut === 0 ? "/" : full.slice(0, cut);         // "/home/user"
    const name = full.slice(cut + 1);                             // "a.txt"
    return { dir: this.get(dirPath), dirPath: dirPath, name: name, full: full };
  }

  exists(path) { return this.get(path) !== null; }                // true if something is there
  isDir(path) { const n = this.get(path); return !!n && n.type === "dir"; }   // true if it is a folder
  isFile(path) { const n = this.get(path); return !!n && n.type === "file"; } // true if it is a file

  /* ---------- creating, reading, writing, deleting ---------- */

  // Create a folder, making any missing parent folders too (like `mkdir -p`).
  mkdirp(path) {                                                  // the folder to create
    const full = this.resolve(path);                              // tidy the path
    let node = this.root;                                         // start at the top
    for (const part of full.split("/").filter(Boolean)) {         // for each name in the path
      if (!node.children[part]) node.children[part] = makeDir();  // create it if missing
      node = node.children[part];                                 // step into it
      if (node.type !== "dir") return false;                      // a file was in the way
    }
    return true;                                                  // all good
  }

  // Create one folder. Fails if the parent is missing or the name is taken.
  mkdir(path) {                                                   // the folder to create
    const p = this.parentOf(path);                                // where it should go
    if (!p.dir || p.dir.type !== "dir") return "no-parent";       // the folder above does not exist
    if (p.dir.children[p.name]) return "exists";                  // something with that name is there
    p.dir.children[p.name] = makeDir();                           // create the empty folder
    p.dir.mtime = Date.now();                                     // the parent just changed
    return "ok";                                                  // success
  }

  readFile(path) {                                                // get the text inside a file
    const node = this.get(path);                                  // find the file
    return node && node.type === "file" ? node.content : null;    // return its text, or null
  }

  // Write text to a file, creating it if needed.
  writeFile(path, content, mode) {                                // path, the text, optional permissions
    const p = this.parentOf(path);                                // find the containing folder
    if (!p.dir || p.dir.type !== "dir") return false;             // give up if the folder is missing
    const old = p.dir.children[p.name];                           // is there already a file here?
    if (old && old.type === "dir") return false;                  // cannot overwrite a folder
    if (old && old.type === "file") {                             // the file already exists
      old.content = content;                                      // replace its text
      old.mtime = Date.now();                                     // remember when it changed
      if (mode !== undefined) old.mode = mode;                    // change permissions if asked
    } else {                                                      // the file is new
      p.dir.children[p.name] = makeFile(content, mode);           // create it
      p.dir.mtime = Date.now();                                   // the folder changed too
    }
    return true;                                                  // success
  }

  appendFile(path, content) {                                     // add text to the end of a file
    const existing = this.readFile(path);                         // what is in there now
    return this.writeFile(path, (existing === null ? "" : existing) + content); // old text + new text
  }

  remove(path) {                                                  // delete a file or folder
    const p = this.parentOf(path);                                // find its folder
    if (!p.dir || !p.dir.children[p.name]) return false;          // nothing to delete
    delete p.dir.children[p.name];                                // remove it from the folder
    p.dir.mtime = Date.now();                                     // the folder changed
    return true;                                                  // success
  }

  // Copy a file or a whole folder to a new place.
  copy(fromPath, toPath) {                                        // source and destination
    const node = this.get(fromPath);                              // find the thing to copy
    if (!node) return false;                                      // nothing there
    const clone = JSON.parse(JSON.stringify(node));               // a deep copy of it
    clone.mtime = Date.now();                                     // the copy is new
    const p = this.parentOf(toPath);                              // where it is going
    if (!p.dir || p.dir.type !== "dir") return false;             // target folder missing
    p.dir.children[p.name] = clone;                               // put the copy there
    p.dir.mtime = Date.now();                                     // that folder changed
    return true;                                                  // success
  }

  // Sorted list of the names inside a folder (hidden files only if `all` is true).
  list(path, all) {                                               // folder path, show hidden?
    const node = this.get(path);                                  // find the folder
    if (!node || node.type !== "dir") return null;                // not a folder
    let names = Object.keys(node.children);                       // every name inside
    if (!all) names = names.filter(n => !n.startsWith("."));      // hide names starting with "."
    return names.sort((a, b) =>                                   // sort the way GNU ls does:
      a.replace(/^\./, "").toLowerCase()                          // ignore a leading dot
       .localeCompare(b.replace(/^\./, "").toLowerCase()));       // and ignore upper/lower case
  }

  /* ---------- turning a mode number into "drwxr-xr-x" ---------- */
  modeString(node) {                                              // node = a file or folder
    const bits = node.mode;                                       // the permission number, e.g. 0o644
    let out = node.type === "dir" ? "d" : "-";                    // "d" for folder, "-" for file
    const flags = ["r", "w", "x"];                                // read, write, execute
    for (let group = 2; group >= 0; group--) {                    // owner, then group, then others
      for (let bit = 2; bit >= 0; bit--) {                        // r, then w, then x
        const on = (bits >> (group * 3 + bit)) & 1;               // is this permission switched on?
        out += on ? flags[2 - bit] : "-";                         // the letter, or "-" when off
      }
    }
    return out;                                                   // e.g. "-rw-r--r--"
  }

  size(node) {                                                    // how big something is, in bytes
    if (node.type === "dir") return 4096;                         // folders always say 4096 on Linux
    return new TextEncoder().encode(node.content).length;         // real byte length of the text
  }

  /* ---------- saving to the browser so files survive a reload ---------- */
  save() {                                                        // write the tree into the browser
    try {                                                         // storage can be switched off
      localStorage.setItem("minishell-fs", JSON.stringify(this.root)); // the whole tree as text
      localStorage.setItem("minishell-cwd", this.cwd);            // and where the user was
    } catch (e) { /* private mode: just keep everything in memory */ }
  }

  load() {                                                        // read the tree back on start-up
    try {                                                         // storage can be switched off
      const saved = localStorage.getItem("minishell-fs");         // the saved tree
      if (!saved) return false;                                   // nothing saved yet
      this.root = JSON.parse(saved);                              // rebuild the tree from text
      const dir = localStorage.getItem("minishell-cwd");          // the saved folder
      this.cwd = dir && this.isDir(dir) ? dir : HOME;             // use it if it still exists
      return true;                                                // we restored something
    } catch (e) { return false; }                                 // anything wrong: start fresh
  }

  reset() {                                                       // throw everything away and start again
    try { localStorage.removeItem("minishell-fs");                // forget the saved tree
          localStorage.removeItem("minishell-cwd"); } catch (e) {}// forget the saved folder
    this.root = makeDir();                                        // empty tree
    this.cwd = HOME;                                              // back to the home folder
    this.buildDefaultTree();                                      // build the standard folders again
  }
}

const fs = new FileSystem();                                      // one file system for the whole page

/* =====================================================================
   SECTION 3 : THE SCREEN
   Everything that is printed, plus the line you are typing right now.
   ===================================================================== */

class Screen {                                                    // controls what you see
  constructor() {                                                 // runs once at start-up
    this.box = document.getElementById("screen");                 // the scrolling area
    this.outEl = document.getElementById("out");                  // finished output goes here
    this.lineEl = document.getElementById("line");                // the line being typed goes here
    this.kb = document.getElementById("kb");                      // the hidden text box for the keyboard
    this.html = "";                                               // all finished output, as HTML text
    this.atLineStart = true;                                      // are we at the beginning of a line?
    this.input = "";                                              // the characters typed so far
    this.cursor = 0;                                              // where the cursor sits in that text
    this.prompt = "";                                             // the prompt shown before the input
    this.inputVisible = false;                                    // is the shell waiting for a line?
    this.echo = true;                                             // should typing be shown? (off for passwords)
    this.onLine = null;                                           // function to call when Enter is pressed
    this.onKey = null;                                            // function to call for control keys
    this.history = [];                                            // every command typed before
    this.historyPos = 0;                                          // where we are when pressing Up/Down
    this.draft = "";                                              // what was typed before pressing Up
    this.completeFn = null;                                       // function that handles the Tab key
    this.blinkTimer = null;                                       // timer that blinks the cursor
    this.typeAhead = "";                                          // keys pressed while a program was running
  }

  /* ---------- printing ---------- */

  // Add already-prepared HTML to the screen (used by the colour helpers below).
  writeHtml(html) {                                               // a piece of HTML
    this.html += html;                                            // remember it
    this.outEl.innerHTML = this.html;                             // show everything
    this.scrollDown();                                            // keep the newest text in view
  }

  // Print plain text exactly as it is (the most common case).
  write(text) {                                                   // the text to print
    if (text === "" || text === undefined) return;                // nothing to do
    this.atLineStart = text.endsWith("\n");                       // remember if we ended a line
    this.writeHtml(esc(text));                                    // make it safe, then show it
  }

  // Print text in a colour. `cls` is one of the c-* classes in the style section.
  writeColor(text, cls) {                                         // text and a colour class
    this.atLineStart = text.endsWith("\n");                       // remember if we ended a line
    this.writeHtml('<span class="' + cls + '">' + esc(text) + "</span>"); // wrap it in a colour span
  }

  // Print an error message (red), the way Linux prints to "standard error".
  writeError(text) {                                              // the error text
    this.writeColor(text, "c-red");                               // errors are red
  }

  // Make sure the next thing printed starts on a fresh line.
  newlineIfNeeded() {                                             // used before messages like "^C"
    if (!this.atLineStart) this.write("\n");                      // only add one if we are mid-line
  }

  clear() {                                                       // the `clear` command
    this.html = "";                                               // forget all output
    this.outEl.innerHTML = "";                                    // wipe the screen
    this.atLineStart = true;                                      // we are at the start of a line
  }

  scrollDown() {                                                  // jump to the newest output
    this.box.scrollTop = this.box.scrollHeight;                   // scroll to the very bottom
  }

  /* ---------- the line you are typing ---------- */

  // Show a prompt and start collecting a line. Returns a promise with the finished line.
  readLine(prompt, options) {                                     // prompt text, extra settings
    options = options || {};                                      // no settings is fine
    this.prompt = prompt;                                         // remember the prompt
    this.input = "";                                              // start with an empty line
    this.cursor = 0;                                              // cursor at the beginning
    this.echo = options.echo !== false;                           // normally show what is typed
    this.inputVisible = true;                                     // the shell is waiting
    this.historyPos = this.history.length;                        // Up starts at the newest command
    this.completeFn = options.complete || null;                   // Tab behaviour for this prompt
    this.renderLine();                                            // draw the prompt
    this.startBlink();                                            // make the cursor blink
    const waiting = new Promise(resolve => { this.onLine = resolve; }); // finished when Enter is pressed
    this.drainTypeAhead();                                        // use anything typed while we were busy
    return waiting;                                               // hand the promise to the caller
  }

  // A real terminal remembers keys pressed while a program is running and gives
  // them to the next prompt. This puts those characters back into the line.
  drainTypeAhead() {                                              // no arguments
    if (this.typeAhead === "") return;                            // nothing was typed early
    const newline = this.typeAhead.indexOf("\n");                 // was Enter pressed as well?
    if (newline === -1) {                                         // no: just show the characters
      this.input += this.typeAhead;                               // add them to the line
      this.cursor = this.input.length;                            // cursor goes to the end
      this.typeAhead = "";                                        // nothing is left over
      this.renderLine();                                          // draw it
      return;                                                     // done
    }
    this.input += this.typeAhead.slice(0, newline);                // the finished line
    this.typeAhead = this.typeAhead.slice(newline + 1);            // keep anything after it
    this.cursor = this.input.length;                               // cursor at the end
    this.submitLine();                                             // and run it straight away
  }

  // Finish the line being typed and hand it to whoever asked for it.
  submitLine() {                                                  // called by Enter and by type-ahead
    const line = this.input;                                      // remember what was typed
    this.endLine(true);                                           // freeze it on the screen
    if (line.trim() !== "" &&                                     // ignore blank lines
        this.history[this.history.length - 1] !== line)           // and exact repeats
      this.history.push(line);                                    // save it for the Up arrow
    const finish = this.onLine;                                   // the waiting function
    this.onLine = null;                                           // clear it first
    if (finish) finish(line);                                     // hand the line over
  }

  // Stop waiting for a line (used when a program takes over the keyboard).
  endLine(keepText) {                                             // keepText: print what was typed?
    if (!this.inputVisible) return;                               // nothing to end
    if (keepText) {                                               // freeze the line on the screen
      // The prompt is already HTML, but the typed text is not: it may contain
      // characters such as "<" that the browser would read as a tag.
      this.writeHtml(this.prompt + esc(this.echo ? this.input : "") + "\n");
      this.atLineStart = true;                                    // we are at the start of a line again
    }
    this.inputVisible = false;                                    // not waiting any more
    this.lineEl.innerHTML = "";                                   // remove the editable line
    this.stopBlink();                                             // stop the cursor blinking
  }

  // Draw the prompt, the typed text, and the block cursor.
  renderLine() {                                                  // called after every key press
    if (!this.inputVisible) { this.lineEl.innerHTML = ""; return; } // nothing to draw
    const shown = this.echo ? this.input : "";                    // hide the text for passwords
    const before = shown.slice(0, this.cursor);                   // text left of the cursor
    const under = shown.slice(this.cursor, this.cursor + 1) || " "; // the character under the cursor
    const after = shown.slice(this.cursor + 1);                   // text right of the cursor
    this.lineEl.innerHTML =                                       // build the line as HTML
      this.prompt +                                               // the prompt is already HTML
      esc(before) +                                               // the safe version of the typed text
      '<span class="cursor">' + esc(under) + "</span>" +          // the block cursor
      esc(after);                                                 // the rest of the text
    this.scrollDown();                                            // keep it in view
  }

  startBlink() {                                                  // make the cursor flash
    this.stopBlink();                                             // never run two timers at once
    this.box.classList.remove("blink-off");                       // start visible
    this.blinkTimer = setInterval(() => {                         // every 550 milliseconds
      this.box.classList.toggle("blink-off");                     // switch it on and off
    }, 550);
  }

  stopBlink() {                                                   // stop the flashing
    if (this.blinkTimer) clearInterval(this.blinkTimer);          // cancel the timer
    this.blinkTimer = null;                                       // forget it
    this.box.classList.remove("blink-off");                       // leave the cursor visible
  }

  resetBlink() {                                                  // keep the cursor solid while typing
    if (this.blinkTimer) this.startBlink();                       // restart the timer
  }

  /* ---------- handling one key press ---------- */

  handleKey(event) {                                              // called for every key press
    const key = event.key;                                        // the name of the key, e.g. "a", "Enter"
    const ctrl = event.ctrlKey;                                   // was Ctrl held down?

    // Control keys are handled even when no line is being typed (so Ctrl-C stops programs).
    if (ctrl && key.length === 1) {                               // Ctrl plus a letter
      const letter = key.toLowerCase();                           // make it lower case
      if (this.onKey && this.onKey(letter)) {                     // let the shell deal with it first
        event.preventDefault();                                   // the browser must not also act
        return;                                                   // done
      }
    }
    if (!this.inputVisible) {                                     // a program is running
      // Keep the key for the next prompt, the way a real terminal does.
      if (key === "Enter") this.typeAhead += "\n";                // remember the Enter too
      else if (key.length === 1 && !ctrl && !event.metaKey) this.typeAhead += key;
      else return;                                                // ignore arrows, function keys ...
      if (this.typeAhead.length > 4096) this.typeAhead = "";       // never grow without limit
      event.preventDefault();                                     // the browser must not act on it
      return;                                                     // done
    }

    if (ctrl) {                                                   // Ctrl shortcuts that edit the line
      const letter = key.toLowerCase();                           // the letter pressed
      if (letter === "a") { this.cursor = 0; this.renderLine(); event.preventDefault(); return; }
      if (letter === "e") { this.cursor = this.input.length; this.renderLine(); event.preventDefault(); return; }
      if (letter === "u") {                                       // Ctrl-U clears to the start
        this.input = this.input.slice(this.cursor);               // keep only what is after the cursor
        this.cursor = 0;                                          // cursor to the beginning
        this.renderLine(); event.preventDefault(); return;        // redraw and stop
      }
      if (letter === "k") {                                       // Ctrl-K clears to the end
        this.input = this.input.slice(0, this.cursor);            // keep only what is before the cursor
        this.renderLine(); event.preventDefault(); return;        // redraw and stop
      }
      if (letter === "w") {                                       // Ctrl-W deletes the word before
        let i = this.cursor;                                      // start at the cursor
        while (i > 0 && this.input[i - 1] === " ") i--;           // skip any spaces
        while (i > 0 && this.input[i - 1] !== " ") i--;           // then skip the word itself
        this.input = this.input.slice(0, i) + this.input.slice(this.cursor); // cut that part out
        this.cursor = i;                                          // move the cursor back
        this.renderLine(); event.preventDefault(); return;        // redraw and stop
      }
    }

    switch (key) {                                                // the ordinary editing keys
      case "Enter":                                               // finish this line
        this.submitLine();                                        // hand it over and start a new one
        event.preventDefault(); return;                           // done
      case "Backspace":                                           // delete the character before
        if (this.cursor > 0) {                                    // only if there is one
          this.input = this.input.slice(0, this.cursor - 1) + this.input.slice(this.cursor);
          this.cursor--;                                          // move the cursor back one
        }
        break;
      case "Delete":                                              // delete the character under
        this.input = this.input.slice(0, this.cursor) + this.input.slice(this.cursor + 1);
        break;
      case "ArrowLeft": if (this.cursor > 0) this.cursor--; break;                  // move left
      case "ArrowRight": if (this.cursor < this.input.length) this.cursor++; break; // move right
      case "Home": this.cursor = 0; break;                        // jump to the start
      case "End": this.cursor = this.input.length; break;         // jump to the end
      case "ArrowUp":                                             // older command
        if (this.historyPos > 0) {                                // only if there is one
          if (this.historyPos === this.history.length) this.draft = this.input; // save what we typed
          this.historyPos--;                                      // step back in history
          this.input = this.history[this.historyPos];             // show that command
          this.cursor = this.input.length;                        // cursor at the end
        }
        break;
      case "ArrowDown":                                           // newer command
        if (this.historyPos < this.history.length) {              // only if there is one
          this.historyPos++;                                      // step forward in history
          this.input = this.historyPos === this.history.length    // past the newest?
            ? this.draft                                          // show what we were typing
            : this.history[this.historyPos];                      // otherwise the next command
          this.cursor = this.input.length;                        // cursor at the end
        }
        break;
      case "Tab":                                                 // complete a file or command name
        if (this.completeFn) this.completeFn();                   // ask the shell to do it
        break;
      default:                                                    // an ordinary character
        if (key.length === 1 && !ctrl && !event.metaKey) {        // a single letter, no Ctrl/Cmd
          this.input = this.input.slice(0, this.cursor) + key + this.input.slice(this.cursor);
          this.cursor++;                                          // move the cursor past it
        } else {                                                  // anything else (F1, Shift, ...)
          return;                                                 // let the browser have it
        }
    }
    event.preventDefault();                                       // we handled the key ourselves
    this.resetBlink();                                            // keep the cursor solid while typing
    this.renderLine();                                            // redraw the line
  }

  // Paste: put the text in as if it had been typed.
  handlePaste(text) {                                             // the pasted text
    if (!this.inputVisible) return;                               // ignore if not typing
    const clean = text.replace(/\r/g, "").split("\n")[0];         // only the first line
    this.input = this.input.slice(0, this.cursor) + clean + this.input.slice(this.cursor);
    this.cursor += clean.length;                                  // cursor moves past the pasted text
    this.renderLine();                                            // redraw
  }

  focus() { this.kb.focus({ preventScroll: true }); }             // send the keyboard to our hidden box
}

/* =====================================================================
   SECTION 4 : PROCESSES AND JOBS
   Linux gives every running program a number (a PID) and keeps them in a
   table. The shell groups the programs of one command line into a "job"
   so Ctrl-C and Ctrl-Z can act on all of them at once.
   ===================================================================== */

let nextPid = 1480;                                               // the next process number to hand out

class Process {                                                   // one running program
  constructor(name, command) {                                    // program name and the whole command
    this.pid = nextPid++;                                         // give it the next number
    this.name = name;                                             // e.g. "sleep"
    this.command = command;                                       // e.g. "sleep 30"
    this.state = "R";                                             // R = running, T = stopped, Z = finished
    this.started = Date.now();                                    // when it began
    this.cpuTime = 0;                                             // seconds of processor time used
    this.exitCode = null;                                         // the number it finished with
    this.killedBy = null;                                         // the signal that killed it, if any
    this.memory = randomInt(2200, 9800);                          // pretend memory use, in kilobytes
  }
}

class Job {                                                       // one command line, e.g. "sleep 30 &"
  constructor(id, command, processes, background) {               // job number, text, processes, &?
    this.id = id;                                                 // the [1], [2] number you see
    this.command = command;                                       // the text you typed
    this.processes = processes;                                   // every process in this job
    this.background = background;                                 // was it started with "&"?
    this.state = "running";                                       // running, stopped or done
    this.notified = false;                                        // have we told the user it finished?
    this.exitCode = 0;                                            // the exit number of the last process
    this.resumeWaiters = [];                                      // functions waiting for "fg"/"bg"
  }

  get pgid() { return this.processes[0].pid; }                    // the group number = first process

  // Pause every process in this job (what Ctrl-Z does).
  stop() {                                                        // no arguments
    this.state = "stopped";                                       // the job is now stopped
    for (const p of this.processes) if (p.state === "R") p.state = "T"; // mark each process stopped
    this.notified = false;                                        // tell the user about this change
  }

  // Let the job carry on (what fg and bg do).
  resume() {                                                      // no arguments
    this.state = "running";                                       // the job runs again
    for (const p of this.processes) if (p.state === "T") p.state = "R"; // mark each process running
    const waiters = this.resumeWaiters;                           // everyone waiting to continue
    this.resumeWaiters = [];                                      // clear the list first
    for (const go of waiters) go();                               // wake them all up
  }

  // Mark the job as finished.
  finish(code) {                                                  // the exit number
    this.state = "done";                                          // nothing is running any more
    this.exitCode = code;                                         // remember the number
    for (const p of this.processes) { p.state = "Z"; p.exitCode = code; } // all processes finished
  }
}

class JobTable {                                                  // the shell's list of jobs
  constructor() {                                                 // runs once
    this.jobs = [];                                               // every job we know about
    this.nextId = 1;                                              // the next [number] to use
  }

  add(command, processes, background) {                           // start tracking a new job
    // bash gives each new job the smallest number not already in use, so the
    // numbering starts again at [1] once every earlier job has finished.
    const taken = new Set(this.jobs.filter(j => j.state !== "done").map(j => j.id));
    let id = 1;                                                   // start looking at 1
    while (taken.has(id)) id++;                                   // take the first free number
    const job = new Job(id, command, processes, background);      // build it
    this.jobs.push(job);                                          // add it to the list
    return job;                                                   // give it back to the caller
  }

  find(id) { return this.jobs.find(j => j.id === id) || null; }   // look up a job by its number
  byPid(pid) {                                                    // look up a job by a process number
    return this.jobs.find(j => j.processes.some(p => p.pid === pid)) || null;
  }

  // "%+" : the job the user means when they just type `fg`.
  current() {                                                     // newest job that has not finished
    for (let i = this.jobs.length - 1; i >= 0; i--)               // search from the newest backwards
      if (this.jobs[i].state !== "done") return this.jobs[i];     // the first live one wins
    return null;                                                  // there are no live jobs
  }

  // "%-" : the one before that.
  previous() {                                                    // second newest live job
    let seen = 0;                                                 // how many live jobs we have passed
    for (let i = this.jobs.length - 1; i >= 0; i--)               // search backwards again
      if (this.jobs[i].state !== "done" && ++seen === 2) return this.jobs[i];
    return null;                                                  // there is no second job
  }

  // Forget jobs that finished a while ago, so the list does not grow for ever.
  tidy() {                                                        // called before each prompt
    this.jobs = this.jobs.filter(j => j.state !== "done" || !j.notified);
  }

  live() { return this.jobs.filter(j => j.state !== "done"); }    // all jobs still running or stopped
  forget(job) { this.jobs = this.jobs.filter(j => j !== job); }   // remove a finished job from the list
}

/* =====================================================================
   SECTION 5 : READING THE COMMAND LINE
   Turning the text you typed into something the shell can run.

   Example:  cat f.txt | grep hi > out.txt && echo done
   becomes:  [ pipeline(cat f.txt | grep hi, output to out.txt), "&&",
              pipeline(echo done) ]
   ===================================================================== */

// Thrown when the line cannot be understood (an unclosed quote, a stray pipe, ...).
class ParseError extends Error {}                                 // a normal error with a nicer name

/* ---------- step 1: split the line into words and symbols ---------- */

function tokenize(line, shell) {                                  // line of text, the shell (for $VAR)
  const tokens = [];                                              // the list we are building
  let word = "";                                                  // the word we are collecting
  let started = false;                                            // has this word any content yet?
  let quoted = false;                                             // was any part of it inside quotes?
  const n = line.length;                                          // how many characters there are

  function pushWord() {                                           // finish the current word
    if (started) tokens.push({ type: "word", value: word, quoted: quoted }); // save it
    word = ""; started = false; quoted = false;                   // start a new, empty word
  }

  for (let i = 0; i < n; i++) {                                   // look at one character at a time
    const ch = line[i];                                           // the current character

    if (ch === " " || ch === "\t") { pushWord(); continue; }      // a space ends the word
    if (ch === "#" && !started) break;                            // "#" starts a comment: ignore the rest

    if (ch === "\\") {                                            // a backslash protects the next character
      if (i + 1 < n) { word += line[++i]; started = true; quoted = true; } // take it as it is
      continue;                                                   // move on
    }

    if (ch === "'") {                                             // 'single quotes': nothing is special
      const close = line.indexOf("'", i + 1);                     // find the closing quote
      if (close === -1) throw new ParseError("unexpected EOF while looking for matching `''");
      word += line.slice(i + 1, close);                           // take the text inside as it is
      i = close;                                                  // continue after the closing quote
      started = true; quoted = true;                              // the word exists and was quoted
      continue;                                                   // move on
    }

    if (ch === '"') {                                             // "double quotes": $VAR still works
      let j = i + 1;                                              // start just after the quote
      let closed = false;                                         // have we found the end?
      while (j < n) {                                             // walk forward
        if (line[j] === '"') { closed = true; break; }            // found the closing quote
        if (line[j] === "\\" && j + 1 < n && '"\\$`'.includes(line[j + 1])) { // \" \\ \$ \`
          word += line[j + 1]; j += 2; continue;                  // keep the escaped character
        }
        if (line[j] === "$") {                                    // a variable inside the quotes
          const got = expandVariable(line, j, shell);             // work out its value
          word += got.text;                                       // add the value to the word
          j = got.next;                                           // continue after the variable name
          continue;                                               // move on
        }
        word += line[j++];                                        // an ordinary character
      }
      if (!closed) throw new ParseError('unexpected EOF while looking for matching `"\'');
      i = j;                                                      // continue after the closing quote
      started = true; quoted = true;                              // the word exists and was quoted
      continue;                                                   // move on
    }

    if (ch === "$") {                                             // a variable outside quotes
      const got = expandVariable(line, i, shell);                 // work out its value
      word += got.text;                                           // add it to the word
      if (got.text !== "") started = true;                        // an empty variable adds nothing
      i = got.next - 1;                                           // continue after the variable name
      continue;                                                   // move on
    }

    if (ch === "~" && !started && (i + 1 === n || line[i + 1] === "/" || line[i + 1] === " ")) {
      word += HOME;                                               // "~" at the start means /home/user
      started = true;                                             // the word now has content
      continue;                                                   // move on
    }

    // Two-character symbols first, so ">>" is not read as two ">" signs.
    const two = line.slice(i, i + 2);                             // the next two characters
    if (two === "&&" || two === "||" || two === ">>" || two === "2>") {
      if (two === "2>" && line[i + 2] === ">") {                  // "2>>" appends to the error file
        pushWord(); tokens.push({ type: "op", value: "2>>" }); i += 2; continue;
      }
      if (two === "2>" && line[i + 2] === "&" && line[i + 3] === "1") { // "2>&1" joins the two outputs
        pushWord(); tokens.push({ type: "op", value: "2>&1" }); i += 3; continue;
      }
      pushWord();                                                 // the symbol ends the word
      tokens.push({ type: "op", value: two });                    // save the symbol
      i++;                                                        // skip its second character
      continue;                                                   // move on
    }

    // Single-character symbols.
    if ("|&;<>".includes(ch)) {                                   // pipe, background, separator, redirects
      pushWord();                                                 // the symbol ends the word
      tokens.push({ type: "op", value: ch });                     // save the symbol
      continue;                                                   // move on
    }

    word += ch;                                                   // an ordinary character
    started = true;                                               // the word now has content
  }
  pushWord();                                                     // save whatever is left
  return tokens;                                                  // hand back the list
}

// Work out the value of $NAME, ${NAME}, $?, $$ or $0 starting at position i.
function expandVariable(line, i, shell) {                         // the line, where "$" is, the shell
  const n = line.length;                                          // length of the line
  if (i + 1 >= n) return { text: "$", next: i + 1 };              // a "$" at the very end is just a "$"
  const next = line[i + 1];                                       // the character after the "$"

  if (next === "?") return { text: String(shell.lastStatus), next: i + 2 }; // $? = last exit number
  if (next === "$") return { text: String(shell.pid), next: i + 2 };        // $$ = the shell's own PID
  if (next === "0") return { text: "minishell", next: i + 2 };              // $0 = the shell's name

  if (next === "{") {                                             // the ${NAME} form
    const close = line.indexOf("}", i + 2);                        // find the closing brace
    if (close === -1) throw new ParseError("bad substitution");    // no closing brace: an error
    const name = line.slice(i + 2, close);                         // the name between the braces
    return { text: shell.env[name] || "", next: close + 1 };       // its value, or nothing
  }

  if (/[A-Za-z_]/.test(next)) {                                   // the plain $NAME form
    let j = i + 1;                                                // start after the "$"
    while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;            // take letters, digits and underscores
    const name = line.slice(i + 1, j);                            // that is the variable name
    return { text: shell.env[name] || "", next: j };              // its value, or nothing
  }

  return { text: "$", next: i + 1 };                              // "$" before anything else is literal
}

/* ---------- step 2: wildcards, such as *.c and file?.txt ---------- */

// Turn a pattern like "*.c" into a test we can run on each file name.
function globToRegExp(pattern) {                                  // the pattern the user typed
  let out = "^";                                                  // the test must match the whole name
  for (let i = 0; i < pattern.length; i++) {                      // one character at a time
    const ch = pattern[i];                                        // the current character
    if (ch === "*") out += "[^/]*";                               // "*" means any run of characters
    else if (ch === "?") out += "[^/]";                           // "?" means exactly one character
    else if (ch === "[") {                                        // "[a-z]" means one of these characters
      const close = pattern.indexOf("]", i + 1);                  // find the closing bracket
      if (close === -1) { out += "\\["; continue; }               // no closing bracket: a plain "["
      let set = pattern.slice(i + 1, close);                      // the characters inside
      if (set.startsWith("!")) set = "^" + set.slice(1);          // "[!abc]" means "not a, b or c"
      out += "[" + set + "]";                                     // add it to the test
      i = close;                                                  // continue after the "]"
    }
    else out += ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");        // anything else is a plain character
  }
  return new RegExp(out + "$");                                   // finish the test
}

// Replace a word containing * ? [ ] with the list of file names that match.
function expandGlob(word, fsys) {                                 // the word, and the file system
  if (!/[*?[]/.test(word)) return [word];                         // no wildcard: nothing to do
  const cut = word.lastIndexOf("/");                              // is there a folder part?
  const dirPart = cut === -1 ? "." : (cut === 0 ? "/" : word.slice(0, cut)); // the folder to look in
  const namePart = cut === -1 ? word : word.slice(cut + 1);       // the pattern for the file name
  if (/[*?[]/.test(dirPart)) return [word];                       // wildcards in folders: not supported
  const names = fsys.list(dirPart, namePart.startsWith("."));     // every name in that folder
  if (!names) return [word];                                      // the folder does not exist
  const test = globToRegExp(namePart);                            // build the matching test
  const hits = names.filter(name => test.test(name));             // keep the names that match
  if (hits.length === 0) return [word];                           // no match: leave the word alone
  const prefix = cut === -1 ? "" : word.slice(0, cut + 1);        // put the folder back in front
  return hits.map(name => prefix + name);                         // the finished list of file names
}

/* ---------- step 3: group the words into commands ---------- */

// One command: its words plus where its input and output should go.
function emptyCommand() {                                         // build a blank command
  return {
    argv: [],                                                     // the words: ["ls", "-l"]
    stdinFile: null,                                              // "< file" reads from here
    stdoutFile: null,                                             // "> file" or ">> file" writes here
    stdoutAppend: false,                                          // true for ">>", false for ">"
    stderrFile: null,                                             // "2> file" writes errors here
    stderrAppend: false,                                          // true for "2>>"
    stderrToStdout: false,                                        // true for "2>&1"
  };
}

// Read one pipeline: cmd1 | cmd2 | cmd3
function parsePipeline(tokens, pos) {                             // the token list and where we are
  const commands = [];                                            // the commands in this pipeline
  let cmd = emptyCommand();                                       // the one we are filling in

  while (pos < tokens.length) {                                   // walk through the tokens
    const token = tokens[pos];                                    // the current token

    if (token.type === "word") {                                  // an ordinary word
      for (const w of expandGlob(token.quoted ? token.value : token.value, fs)) {
        cmd.argv.push(token.quoted ? token.value : w);            // quoted words keep their wildcards
        if (token.quoted) break;                                  // "*.c" in quotes is one plain word
      }
      pos++;                                                      // move to the next token
      continue;                                                   // keep going
    }

    const op = token.value;                                       // the symbol we found

    if (op === "|") {                                             // a pipe starts a new command
      if (cmd.argv.length === 0) throw new ParseError("syntax error near unexpected token `|'");
      commands.push(cmd);                                         // save the finished command
      cmd = emptyCommand();                                       // start the next one
      pos++;                                                      // move past the pipe
      continue;                                                   // keep going
    }

    if (op === "<" || op === ">" || op === ">>" || op === "2>" || op === "2>>") {
      const target = tokens[pos + 1];                             // the file name must come next
      if (!target || target.type !== "word")                      // nothing, or another symbol
        throw new ParseError("syntax error near unexpected token `newline'");
      if (op === "<") cmd.stdinFile = target.value;               // read input from this file
      else if (op === ">" || op === ">>") {                       // send output to this file
        cmd.stdoutFile = target.value;                            // remember the file name
        cmd.stdoutAppend = op === ">>";                           // ">>" adds, ">" replaces
      } else {                                                    // 2> or 2>>
        cmd.stderrFile = target.value;                            // send errors to this file
        cmd.stderrAppend = op === "2>>";                          // "2>>" adds to the file
      }
      pos += 2;                                                   // skip the symbol and the file name
      continue;                                                   // keep going
    }

    if (op === "2>&1") { cmd.stderrToStdout = true; pos++; continue; } // errors go where output goes

    break;                                                        // ; && || & end the pipeline
  }

  if (cmd.argv.length > 0) commands.push(cmd);                    // save the last command
  else if (commands.length > 0) throw new ParseError("syntax error: no command after `|'");
  return { commands: commands, pos: pos };                        // the pipeline and where we stopped
}

// Read the whole line: pipelines joined by ; && || and ending with an optional &
function parseLine(line, shell) {                                 // the text, and the shell
  const tokens = tokenize(line, shell);                           // step 1: words and symbols
  const list = [];                                                // the finished list of pipelines
  let pos = 0;                                                    // where we are in the token list

  while (pos < tokens.length) {                                   // until every token is used
    const parsed = parsePipeline(tokens, pos);                    // read one pipeline
    pos = parsed.pos;                                             // continue after it
    if (parsed.commands.length === 0)                             // nothing before the symbol
      throw new ParseError("syntax error near unexpected token `" +
        (tokens[pos] ? tokens[pos].value : "newline") + "'");

    const entry = {                                               // one item in the list
      commands: parsed.commands,                                  // the commands of this pipeline
      background: false,                                          // does it end with "&"?
      next: null,                                                 // the symbol that follows: && || ;
      text: "",                                                   // the original text, for `jobs`
    };

    const token = tokens[pos];                                    // the symbol after the pipeline
    if (token && token.type === "op") {                           // there is one
      if (token.value === "&") { entry.background = true; pos++; }      // run in the background
      else if (token.value === ";") { entry.next = ";"; pos++; }        // then run the next one
      else if (token.value === "&&") { entry.next = "&&"; pos++; }      // run next only if this worked
      else if (token.value === "||") { entry.next = "||"; pos++; }      // run next only if this failed
      else throw new ParseError("syntax error near unexpected token `" + token.value + "'");
    }

    // Build a tidy version of the text for the `jobs` list.
    entry.text = parsed.commands.map(c => c.argv.join(" ")).join(" | ");
    list.push(entry);                                             // add this pipeline to the list
  }
  return list;                                                    // the whole line, ready to run
}

/* =====================================================================
   SECTION 6 : THE RUNNING ENVIRONMENT OF ONE COMMAND
   Every command gets one of these. It is how the command prints text,
   reads input, and notices Ctrl-C and Ctrl-Z.
   ===================================================================== */

class SignalError extends Error {                                 // thrown when a program is killed
  constructor(signal) {                                           // "SIGINT" or "SIGTERM"
    super(signal);                                                // store the name
    this.signal = signal;                                         // and keep it handy
  }
}

class Context {                                                   // what a command can do
  constructor(shell, process, job) {                              // the shell, its process, its job
