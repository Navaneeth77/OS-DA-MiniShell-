    switch (type) {                                               // which kind of value is it?
      case "d": case "i":                                         // a whole number
        text = String(Math.trunc(toNumber(raw)));                 // drop any decimals
        break;
      case "u":                                                   // a whole number with no sign
        text = String(Math.abs(Math.trunc(toNumber(raw))));       // always positive
        break;
      case "f": case "F":                                         // a number with decimals
        text = toNumber(raw).toFixed(precision === null ? 6 : precision); // C shows 6 by default
        break;
      case "e": case "E": {                                       // scientific notation
        text = toNumber(raw).toExponential(precision === null ? 6 : precision);
        text = text.replace(/e([+-])(\d)$/, "e$10$2");            // C always uses two exponent digits
        if (type === "E") text = text.toUpperCase();              // capital E wanted
        break;
      }
      case "g": case "G": {                                       // the shorter of the two forms
        const value = toNumber(raw);                              // the number
        text = String(parseFloat(value.toPrecision(precision === null ? 6 : precision)));
        break;
      }
      case "s":                                                   // a piece of text
        text = raw instanceof CArray ? raw.toString()             // a char array
             : raw && raw.get ? String(raw.get())                 // a place: read it
             : raw === undefined || raw === null ? "(null)"       // nothing was passed
             : String(raw);                                       // anything else
        if (precision !== null) text = text.slice(0, precision);  // "%.3s" cuts it short
        break;
      case "c":                                                   // a single character
        text = typeof raw === "string" ? raw[0] : String.fromCharCode(toNumber(raw));
        break;
      case "x": text = (Math.trunc(toNumber(raw)) >>> 0).toString(16); break;          // hexadecimal
      case "X": text = (Math.trunc(toNumber(raw)) >>> 0).toString(16).toUpperCase(); break;
      case "o": text = (Math.trunc(toNumber(raw)) >>> 0).toString(8); break;           // base eight
      case "p": text = "0x" + (0x7ffd0000 + argIndex * 8).toString(16); break;         // an address
      case "n": continue;                                         // "%n" is not supported here
      default: text = spec; argIndex--; break;                    // unknown: print it as it is
    }

    if (width > text.length) {                                    // does it need padding?
      if (leftAlign) text = text + " ".repeat(width - text.length); // "-" pads on the right
      else if (zeroPad && "dioxXufFeEgG".includes(type)) {        // zeros only make sense for numbers
        const negative = text.startsWith("-");                    // keep any minus sign in front
        const digits = negative ? text.slice(1) : text;           // the digits themselves
        text = (negative ? "-" : "") + "0".repeat(width - text.length) + digits;
      } else text = " ".repeat(width - text.length) + text;       // otherwise pad with spaces
    }
    out += text;                                                  // add it to the result
  }
  return out;                                                     // the finished text
}

// Read values from one line of input, following a scanf format.
function parseScanf(format, input, places) {                      // format, the typed line, where to store
  let pos = 0;                                                    // where we are in the input
  let filled = 0;                                                 // how many values we stored
  let placeIndex = 0;                                             // which place comes next

  for (let i = 0; i < format.length; i++) {                       // walk through the format
    const ch = format[i];                                         // the current character

    if (/\s/.test(ch)) {                                          // a space in the format
      while (pos < input.length && /\s/.test(input[pos])) pos++;  // skips any spaces in the input
      continue;                                                   // carry on
    }
    if (ch !== "%") {                                             // an ordinary character
      if (input[pos] === ch) pos++;                               // it must match exactly
      continue;                                                   // carry on
    }
    if (format[i + 1] === "%") { if (input[pos] === "%") pos++; i++; continue; } // "%%"

    let j = i + 1;                                                // look at what follows the "%"
    let width = "";                                               // an optional maximum width
    while (/[0-9]/.test(format[j])) width += format[j++];         // read it
    while ("hlL".includes(format[j])) j++;                        // skip "l" in "%lf"
    const type = format[j];                                       // the final letter
    i = j;                                                        // continue after it
    const place = places[placeIndex++];                           // where this value goes

    if (type !== "c")                                             // every type except %c
      while (pos < input.length && /\s/.test(input[pos])) pos++;  // skips spaces first

    if (type === "d" || type === "i" || type === "u") {           // a whole number
      const match = /^[+-]?\d+/.exec(input.slice(pos));           // read the digits
      if (!match) return filled;                                  // nothing there: stop
      pos += match[0].length;                                     // move past them
      if (place && place.set) place.set(parseInt(match[0], 10));  // store the number
      filled++;                                                   // count it
    } else if (type === "f" || type === "e" || type === "g") {    // a number with decimals
      const match = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(input.slice(pos));
      if (!match) return filled;                                  // nothing there: stop
      pos += match[0].length;                                     // move past it
      if (place && place.set) place.set(parseFloat(match[0]));    // store the number
      filled++;                                                   // count it
    } else if (type === "s") {                                    // a word, up to the next space
      const match = /^\S+/.exec(input.slice(pos));                // read the word
      if (!match) return filled;                                  // nothing there: stop
      let text = match[0];                                        // the word itself
      if (width) text = text.slice(0, parseInt(width, 10));       // "%10s" limits the length
      pos += text.length;                                         // move past it
      if (place instanceof CArray) place.setString(text);         // store it in a char array
      else if (place && place.set) place.set(text);               // or in a plain variable
      filled++;                                                   // count it
    } else if (type === "c") {                                    // exactly one character
      if (pos >= input.length) return filled;                     // nothing left: stop
      const letter = input[pos++];                                // take it
      if (place && place.set) place.set(letter.charCodeAt(0));    // store its number
      filled++;                                                   // count it
    } else {                                                      // anything else we ignore
      placeIndex--;                                               // that place was not used
    }
  }
  return filled;                                                  // how many values we stored
}

// The library functions a C program can call.
CProgram.prototype.callByName = async function (node, scope) {    // the call node and the variables
  const name = node.name;                                         // the function name

  /* ----- printf and its relatives ----- */
  if (name === "printf") {                                        // printf("...", a, b)
    const format = await this.evaluate(node.args[0], scope);      // the format text
    const values = [];                                            // the values to print
    for (let i = 1; i < node.args.length; i++)                    // work each one out
      values.push(await this.evaluate(node.args[i], scope));      // and keep it
    const text = formatPrintf(String(format instanceof CArray ? format.toString() : format), values);
    this.print(text);                                             // add it to the output
    if (text.includes("\n")) await this.flush();                  // show complete lines at once
    return text.length;                                           // printf returns the length
  }
  if (name === "puts") {                                          // puts("text")
    const value = await this.evaluate(node.args[0], scope);       // the text
    this.print((value instanceof CArray ? value.toString() : String(value)) + "\n");
    await this.flush();                                           // puts always ends the line
    return 0;                                                     // success
  }
  if (name === "putchar") {                                       // putchar('A')
    const value = await this.evaluate(node.args[0], scope);       // the character's number
    this.print(String.fromCharCode(toNumber(value)));             // print that one letter
    return toNumber(value);                                       // putchar returns it again
  }

  /* ----- scanf and friends: reading what the user types ----- */
  if (name === "scanf") {                                         // scanf("%d", &n)
    await this.flush();                                           // show the prompt before waiting
    const format = String(await this.evaluate(node.args[0], scope)); // the format text
    const places = [];                                            // where to put the values
    for (let i = 1; i < node.args.length; i++) {                  // for each remaining argument
      const arg = node.args[i];                                   // the argument tree
      if (arg.kind === "addressof") places.push(await this.resolvePlace(arg.target, scope));
      else {                                                      // a char array needs no "&"
        const value = await this.evaluate(arg, scope);            // work it out
        places.push(value instanceof CArray ? value : null);      // arrays can be written into
      }
    }
    const line = await this.ctx.readLine();                       // wait for the user to type a line
    if (line === null) return -1;                                 // Ctrl-D means "end of input"
    return parseScanf(format, line, places);                      // store the values, return how many
  }
  if (name === "gets" || name === "fgets") {                      // read a whole line
    await this.flush();                                           // show anything waiting first
    const target = await this.evaluate(node.args[0], scope);      // the char array to fill
    const line = await this.ctx.readLine();                       // read the line
    if (line === null) return 0;                                  // no more input
    if (target instanceof CArray) target.setString(line);         // copy it in
    return 1;                                                     // success
  }
  if (name === "getchar") {                                       // read one character
    await this.flush();                                           // show anything waiting first
    if (this.pendingInput === undefined || this.pendingInput === "") { // nothing buffered
      const line = await this.ctx.readLine();                     // read a whole line
      if (line === null) return -1;                               // end of input
      this.pendingInput = line + "\n";                            // keep it, including the new line
    }
    const letter = this.pendingInput[0];                          // the first character
    this.pendingInput = this.pendingInput.slice(1);               // keep the rest for next time
    return letter.charCodeAt(0);                                  // its number
  }

  /* ----- string functions ----- */
  const asText = async (argNode) => {                             // read any argument as text
    const value = await this.evaluate(argNode, scope);            // work it out
    return value instanceof CArray ? value.toString() : String(value); // arrays become text
  };
  if (name === "strlen") return (await asText(node.args[0])).length;  // how many letters
  if (name === "strcmp") {                                        // compare two pieces of text
    const a = await asText(node.args[0]), b = await asText(node.args[1]);
    return a < b ? -1 : a > b ? 1 : 0;                            // -1, 0 or 1, like C
  }
  if (name === "strcpy") {                                        // copy text into an array
    const target = await this.evaluate(node.args[0], scope);      // where it goes
    const text = await asText(node.args[1]);                      // what to copy
    if (target instanceof CArray) target.setString(text);         // do the copy
    return target;                                                // strcpy returns the target
  }
  if (name === "strcat") {                                        // join text onto the end
    const target = await this.evaluate(node.args[0], scope);      // the array to add to
    const text = await asText(node.args[1]);                      // what to add
    if (target instanceof CArray) target.setString(target.toString() + text);
    return target;                                                // strcat returns the target
  }

  /* ----- maths ----- */
  const num = async (argNode) => toNumber(await this.evaluate(argNode, scope)); // read a number
  if (name === "abs" || name === "fabs") return Math.abs(await num(node.args[0]));
  if (name === "sqrt") return Math.sqrt(await num(node.args[0]));
  if (name === "pow") return Math.pow(await num(node.args[0]), await num(node.args[1]));
  if (name === "floor") return Math.floor(await num(node.args[0]));
  if (name === "ceil") return Math.ceil(await num(node.args[0]));
  if (name === "round") return Math.round(await num(node.args[0]));
  if (name === "sin") return Math.sin(await num(node.args[0]));
  if (name === "cos") return Math.cos(await num(node.args[0]));
  if (name === "tan") return Math.tan(await num(node.args[0]));
  if (name === "log") return Math.log(await num(node.args[0]));
  if (name === "log10") return Math.log10(await num(node.args[0]));
  if (name === "exp") return Math.exp(await num(node.args[0]));
  if (name === "rand") return Math.floor(Math.random() * 32768);  // C's rand goes up to 32767
  if (name === "srand") return 0;                                 // we always use real randomness

  /* ----- the operating system ----- */
  if (name === "sleep") {                                         // sleep(3) from unistd.h
    await this.flush();                                           // show output before waiting
    const seconds = await num(node.args[0]);                      // how long
    await this.ctx.sleep(seconds * 1000);                         // wait, watching for Ctrl-C
    return 0;                                                     // success
  }
  if (name === "usleep") {                                        // microseconds instead of seconds
    await this.flush();                                           // show output before waiting
    await this.ctx.sleep((await num(node.args[0])) / 1000);       // convert and wait
    return 0;                                                     // success
  }
  if (name === "getpid") return this.ctx.process.pid;             // the process number of ./a.out
  if (name === "exit") {                                          // stop the program at once
    await this.flush();                                           // show anything waiting
    throw new ReturnSignal(await num(node.args[0]));              // behave like "return" from main
  }
  if (name === "system" || name === "fork" || name === "execvp" || name === "malloc" ||
      name === "free" || name === "calloc") {
    throw new RuntimeErrorC(name + "() is not available in MiniShell++");  // honest about the limits
  }

  /* ----- a function from the program itself ----- */
  const fn = this.functions.get(name);                            // look for it among the user's functions
  if (!fn) throw new RuntimeErrorC("undefined reference to `" + name + "'"); // not there

  const args = [];                                                // work out the arguments
  for (const argNode of node.args) {                              // one at a time
    const value = await this.evaluate(argNode, scope);            // evaluate it
    args.push(value && value.get ? value.get() : value);          // pass places by value
  }
  return await this.callFunction(fn, args);                       // call it and return its answer
};

/* =====================================================================
   SECTION 13 : THE gcc COMMAND
   It compiles a .c file and writes a program you can run with ./name.
   ===================================================================== */

const ELF_MARKER = "\u007fELF\u0002\u0001\u0001MiniShell";        // the first bytes of a Linux program

defineCommand("gcc", "compile a C program", async ctx => {
  const args = ctx.args.slice(1);                                 // everything after "gcc"
  const sources = [];                                             // the .c files to compile
  let output = "a.out";                                           // the default name, as in Linux
  let warnAll = false;                                            // was -Wall given?

  for (let i = 0; i < args.length; i++) {                         // read the arguments
    if (args[i] === "-o" && args[i + 1]) output = args[++i];      // "-o name" chooses the name
    else if (args[i] === "-Wall" || args[i] === "-W") warnAll = true;  // turn warnings on
    else if (args[i].startsWith("-")) continue;                   // ignore other options, like -lm
    else sources.push(args[i]);                                   // anything else is a file name
  }

  if (sources.length === 0) {                                     // no file was given
    ctx.error("gcc: fatal error: no input files\ncompilation terminated.\n");
    return 1;                                                     // failure
  }

  let combined = "";                                              // all the source files together
  for (const path of sources) {                                   // read each one
    const text = ctx.fs.readFile(path);                           // get its contents
    if (text === null) {                                          // it is not there
      ctx.error("gcc: error: " + path + ": No such file or directory\n");
      ctx.error("gcc: fatal error: no input files\ncompilation terminated.\n");
      return 1;                                                   // failure
    }
    combined += text + "\n";                                      // add it to the pile
  }
  const mainFile = sources[0];                                    // used in error messages

  let tree;                                                       // the parsed program
  try {                                                           // compiling can fail
    tree = new Parser(tokenizeC(combined)).parseProgram();        // lexer, then parser
  } catch (e) {                                                   // the program has a mistake
    if (e instanceof CompileError) {                              // one we understand
      // Print the message in gcc's layout: file, line, column, then the line itself.
      ctx.writeColor(mainFile + ":" + e.line + ":" + e.col + ": ", "c-white bold");
      ctx.writeColor("error: ", "c-red bold");                    // the word "error" is red
      ctx.write(e.message + "\n");                                // then what went wrong
      const sourceLine = combined.split("\n")[e.line - 1];        // the line it happened on
      if (sourceLine !== undefined) {                             // show it, as gcc does
        ctx.write(padLeft(e.line, 5) + " | " + sourceLine + "\n"); // the line, with its number
        ctx.write("      | " + " ".repeat(Math.max(0, e.col - 1)));// spaces up to the column
        ctx.writeColor("^\n", "c-red bold");                      // a caret pointing at the problem
      }
      ctx.error("compilation terminated.\n");                     // the last line gcc prints
      return 1;                                                   // failure
    }
    throw e;                                                      // an unexpected problem
  }

  // A few friendly warnings, printed only with -Wall, like the real gcc.
  if (warnAll) {                                                  // the user asked for warnings
    const main = tree.functions.find(f => f.name === "main");     // find main()
    if (main && main.returnType === "int") {                      // it should return a number
      const returns = JSON.stringify(main.body).includes('"kind":"return"'); // does it?
      if (!returns) {                                             // no return statement at all
        ctx.writeColor(mainFile + ": ", "c-white bold");          // the file name
        ctx.writeColor("warning: ", "c-yellow bold");             // the word "warning"
        ctx.write("control reaches end of non-void function [-Wreturn-type]\n");
      }
    }
  }

  if (!tree.functions.some(f => f.name === "main" && f.body)) {   // every program needs main()
    ctx.error("/usr/bin/ld: cannot find entry symbol main; defaulting to 0000000000401000\n");
    ctx.error("collect2: error: ld returned 1 exit status\n");
    return 1;                                                     // failure
  }

  // A real compiler takes a moment, so pause briefly when someone is watching.
  // When the output is captured (by a pipe, a file or the self-test) we skip it.
  if (ctx.sink instanceof ScreenSink) await ctx.sleep(randomInt(150, 300));
  // Store the program: a header that looks like a Linux binary, then the source we re-read when it runs.
  ctx.fs.writeFile(output, ELF_MARKER + "\n" + combined, 0o755);  // 0o755 means "may be run"
  return 0;                                                       // success: gcc prints nothing
});
defineCommand("cc", "compile a C program (the same as gcc)", COMMANDS["gcc"].run); // the usual other name

/* ---------------------------------------------------------------------
   Running a compiled program: ./a.out
   --------------------------------------------------------------------- */
async function runCompiledProgram(ctx, path) {                    // the context and the file to run
  const content = ctx.fs.readFile(path);                          // read the "binary"
  const source = content.slice(content.indexOf("\n") + 1);        // everything after the header
  let program;                                                    // the compiled program
  try {                                                           // it was compiled before, so this works
    program = new CProgram(new Parser(tokenizeC(source)).parseProgram(), source, path);
  } catch (e) {                                                   // unless the file was damaged
    ctx.error("bash: " + path + ": cannot execute binary file: Exec format error\n");
    return 126;                                                   // the number Linux uses
  }
  try {                                                           // now run it
    return await program.run(ctx, ctx.args.slice(1));             // pass the command-line words
  } catch (e) {                                                   // the program hit a problem
    if (e instanceof SignalError) throw e;                        // Ctrl-C is handled by the shell
    if (e instanceof RuntimeErrorC) {                             // a mistake inside the program
      ctx.error(path + ": " + e.message + "\n");                  // explain it
      return 1;                                                   // failure
    }
    if (e instanceof RangeError) {                                // too much recursion
      ctx.error("Segmentation fault (core dumped)\n");            // what Linux says for a stack overflow
      return 139;                                                 // 128 + signal 11
    }
    throw e;                                                      // anything else is a bug in the shell
  }
}

/* =====================================================================
   SECTION 14 : PIPES
   A pipe joins two commands: "ls | wc -l". The left command writes into
   it, the right command reads from it. Both run at the same time, so
   "yes | head -3" stops as soon as head has what it needs, exactly as it
   does on Linux.
   ===================================================================== */

class Pipe {                                                      // one connection between two commands
  constructor() {                                                 // runs when the pipe is made
    this.buffer = "";                                             // text written but not yet read
    this.writerClosed = false;                                    // has the left command finished?
    this.readerClosed = false;                                    // has the right command stopped reading?
    this.waiting = [];                                            // readers asleep, waiting for text
  }

  write(text) {                                                   // the left command writes here
    if (this.readerClosed) throw new SignalError("SIGPIPE");       // nobody is listening any more
    this.buffer += text;                                           // add the text
    this.wake();                                                   // wake anyone waiting for it
  }

  closeWriter() { this.writerClosed = true; this.wake(); }         // the left command has finished
  closeReader() { this.readerClosed = true; this.wake(); }         // the right command has stopped
  wake() { const list = this.waiting; this.waiting = []; for (const go of list) go(); } // wake sleepers

  // Read one line. Returns null when the writer has finished and nothing is left.
  async readLine() {                                               // no arguments
    for (;;) {                                                     // keep trying
      const newline = this.buffer.indexOf("\n");                   // is a whole line ready?
      if (newline !== -1) {                                        // yes
        const line = this.buffer.slice(0, newline);                // take it
        this.buffer = this.buffer.slice(newline + 1);              // keep the rest
        return line;                                               // hand it back
      }
      if (this.writerClosed) {                                     // no more text is coming
        if (this.buffer === "") return null;                       // and nothing is left: end of file
        const last = this.buffer;                                  // a final line with no newline
        this.buffer = "";                                          // the pipe is now empty
        return last;                                               // hand it back
      }
      await new Promise(go => this.waiting.push(go));              // sleep until more text arrives
    }
  }
}

/* =====================================================================
   SECTION 15 : WHERE OUTPUT GOES
   A command's output goes to the screen, into a file, or into a pipe.
   Each of these looks the same to the command, so commands never need to
   know which one they are using.
   ===================================================================== */

class ScreenSink {                                                 // output goes to the terminal
  constructor(screen, isError) { this.screen = screen; this.isError = isError; }
  write(text) {                                                    // plain text
    if (this.isError) this.screen.writeError(text);                // errors are shown in red
    else this.screen.write(text);                                  // ordinary output is white
  }
  writeHtml(html, plain) { this.screen.writeHtml(html); }           // coloured output
  close() {}                                                       // nothing to tidy up
}

class FileSink {                                                   // output goes into a file
  constructor(fsys, path, append) {                                // the file system, path, add or replace
    this.fs = fsys; this.path = path; this.append = append;        // remember them
    this.text = "";                                                // collect the output here
    this.failed = !fsys.parentOf(path).dir;                        // is the folder missing?
  }
  write(text) { this.text += text; }                               // just collect it
  writeHtml(html, plain) { this.text += plain; }                    // files get the plain version
  close() {                                                        // write everything out at the end
    if (this.failed) return;                                        // the folder was missing
    if (this.append) this.fs.appendFile(this.path, this.text);      // ">>" adds to the end
    else this.fs.writeFile(this.path, this.text);                   // ">" replaces the file
  }
}

class PipeSink {                                                   // output goes into a pipe
  constructor(pipe) { this.pipe = pipe; }                          // the pipe to write into
  write(text) { this.pipe.write(text); }                           // pass the text along
  writeHtml(html, plain) { this.pipe.write(plain); }                // pipes carry plain text only
  close() { this.pipe.closeWriter(); }                              // tell the reader we are done
}

/* =====================================================================
   SECTION 16 : THE GEDIT WINDOW
   `gedit hello.c` opens a real editing window. The command waits until
   the window is closed, which is how gedit behaves on Linux. Because the
   editor is an ordinary process, Ctrl-Z pauses it and the window stops
   responding until you type fg or bg.
   ===================================================================== */

const C_KEYWORD_LIST = ["if","else","for","while","do","switch","case","default","break",
  "continue","return","sizeof","struct","typedef","enum","const","static"];           // shown in red
const C_TYPE_LIST = ["int","char","float","double","void","long","short","unsigned","signed",
  "FILE","size_t"];                                                                   // shown in green

// Add colours to C source for the editor window.
function highlightC(source) {                                      // the program text
  const pattern = /(\/\*[\s\S]*?(?:\*\/|$))|(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"?)|('(?:[^'\\\n]|\\.)*'?)|(^[ \t]*#[^\n]*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gm;
  let out = "";                                                    // the HTML we are building
  let last = 0;                                                    // how far we have copied
  let match;                                                       // each thing the pattern finds
  while ((match = pattern.exec(source)) !== null) {                 // walk through the text
    out += esc(source.slice(last, match.index));                   // the plain text before it
    const text = match[0];                                         // what was found
    if (match[1] || match[2]) out += '<span class="k-com">' + esc(text) + "</span>";       // comments
    else if (match[3] || match[4]) out += '<span class="k-str">' + esc(text) + "</span>";  // strings
    else if (match[5]) out += '<span class="k-pre">' + esc(text) + "</span>";              // #include
    else if (match[6]) out += '<span class="k-num">' + esc(text) + "</span>";              // numbers
    else if (C_KEYWORD_LIST.includes(text)) out += '<span class="k-key">' + text + "</span>";
    else if (C_TYPE_LIST.includes(text)) out += '<span class="k-type">' + text + "</span>";
    else out += esc(text);                                         // an ordinary name
    last = match.index + text.length;                              // continue after it
  }
  return out + esc(source.slice(last)) + "\n";                     // the rest of the text
}

let geditZIndex = 50;                                              // which window is in front
let geditOffset = 0;                                               // so windows do not land on top of each other

class GeditWindow {                                                // one editor window
  constructor(shell, path, process, job) {                         // the shell, the file, the process
    this.shell = shell;                                            // so we can reach the file system
    this.path = shell.fs.resolve(path);                            // the full path of the file
    this.name = this.path.split("/").pop() || "Untitled";          // just the file name
    this.folder = this.path.slice(0, this.path.length - this.name.length - 1) || "/";
    this.process = process;                                        // the process this window belongs to
    this.job = job;                                                // the job, so we can see Ctrl-Z
    this.modified = false;                                         // have there been unsaved changes?
    this.closed = false;                                           // has the window been closed?
    this.build();                                                  // make the window appear
  }

  build() {                                                        // create all the parts of the window
    const existing = this.shell.fs.readFile(this.path);            // the file's current contents
    const text = existing === null ? "" : existing;                // a new file starts empty

    const win = document.createElement("section");                 // the window itself
    win.className = "gedit";                                       // use the gedit style
    win.style.left = Math.max(12, (window.innerWidth - 720) / 2 + geditOffset) + "px";
    win.style.top = Math.max(12, 56 + geditOffset) + "px";         // place it a little lower each time
    geditOffset = (geditOffset + 28) % 140;                        // move the next one along
    win.style.zIndex = ++geditZIndex;                              // put it in front
    win.innerHTML =                                                // the inside of the window
      '<div class="g-bar">' +
        '<div><button class="g-btn g-open">Open ▾</button></div>' +
        '<div class="g-titles"><div class="g-name"></div><div class="g-dir"></div></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">' +
          '<button class="g-btn main g-save">Save</button>' +
          '<span class="g-win g-maximize">&#9633;</span>' +
          '<span class="g-win g-close">&times;</span>' +
        "</div>" +
      "</div>" +
      '<div class="g-body"><div class="g-nums"></div><div class="g-wrap">' +
        '<pre class="g-hl"></pre><textarea class="g-text" spellcheck="false"></textarea>' +
      "</div></div>" +
      '<div class="g-foot"><span class="g-lang"></span><span>Tab Width: 4</span>' +
        '<span class="g-pos">Ln 1, Col 1</span><span>INS</span></div>';
    document.body.appendChild(win);                                // put it on the page
    this.el = win;                                                 // remember it

    this.textarea = win.querySelector(".g-text");                  // where the user types
    this.highlight = win.querySelector(".g-hl");                   // the coloured copy behind it
    this.numbers = win.querySelector(".g-nums");                   // the line numbers
    this.textarea.value = text;                                    // show the file's contents

    const extension = (this.name.split(".").pop() || "").toLowerCase();  // ".c", ".txt" ...
    this.isC = ["c", "h", "cpp", "cc"].includes(extension);        // only colour C programs
    win.querySelector(".g-lang").textContent = this.isC ? "C" : "Plain Text";

    this.refresh();                                                // draw the colours and numbers
    this.updateTitle();                                            // show the file name

    // ----- what the buttons and keys do -----
    this.textarea.addEventListener("input", () => {                // the text was changed
      if (!this.modified) { this.modified = true; this.updateTitle(); } // show the star in the title
      this.refresh();                                              // redraw colours and numbers
    });
    this.textarea.addEventListener("keyup", () => this.updatePosition());   // update Ln, Col
    this.textarea.addEventListener("click", () => this.updatePosition());   // the same on a click
    this.textarea.addEventListener("keydown", e => {               // keyboard shortcuts
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); this.save(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "w") { e.preventDefault(); this.tryClose(); }
      else if (e.key === "Tab") {                                  // Tab inserts a tab, not a jump
        e.preventDefault();                                        // stop the browser moving the focus
        const start = this.textarea.selectionStart;                // where the cursor is
        this.textarea.setRangeText("    ", start, this.textarea.selectionEnd, "end"); // four spaces
        this.textarea.dispatchEvent(new Event("input"));           // treat it as typing
      }
    });
    win.querySelector(".g-save").addEventListener("click", () => this.save());          // Save button
    win.querySelector(".g-close").addEventListener("click", () => this.tryClose());     // X button
    win.querySelector(".g-open").addEventListener("click", () => {                      // Open button
      this.flash("Use the terminal: gedit " + this.name);          // we only open files from the shell
    });
    win.querySelector(".g-maximize").addEventListener("click", () => {                  // the square
      win.classList.toggle("max");                                 // make it full screen, or not
      this.refresh();                                              // the text area changed size
    });
    win.addEventListener("mousedown", () => this.focusWindow());   // clicking brings it to the front

    // Let the user drag the window by its title bar.
    const bar = win.querySelector(".g-bar");                       // the title bar
    bar.addEventListener("mousedown", e => {                       // the drag begins
      if (e.target.closest("button, .g-win") || win.classList.contains("max")) return;
      const startX = e.clientX, startY = e.clientY;                // where the mouse started
      const left = win.offsetLeft, top = win.offsetTop;            // where the window started
      const move = ev => {                                         // while the mouse moves
        win.style.left = Math.min(window.innerWidth - 90, Math.max(-win.offsetWidth + 90,
                                   left + ev.clientX - startX)) + "px";
        win.style.top = Math.min(window.innerHeight - 44, Math.max(0, top + ev.clientY - startY)) + "px";
      };
      const stop = () => {                                         // when the mouse is let go
        document.removeEventListener("mousemove", move);           // stop following it
        document.removeEventListener("mouseup", stop);             // and stop listening
      };
      document.addEventListener("mousemove", move);                // follow the mouse
      document.addEventListener("mouseup", stop);                  // until the button is released
      e.preventDefault();                                          // do not select text while dragging
    });

    this.focusWindow();                                            // bring the new window to the front
    setTimeout(() => this.textarea.focus(), 30);                   // and put the cursor in it
    this.watch();                                                  // start watching for Ctrl-Z
  }

  focusWindow() {                                                  // make this the active window
    for (const other of document.querySelectorAll(".gedit")) other.classList.add("inactive");
    this.el.classList.remove("inactive");                          // this one is not greyed out
    this.el.style.zIndex = ++geditZIndex;                          // and sits in front
  }

  updateTitle() {                                                  // show the name, with a star if unsaved
    this.el.querySelector(".g-name").textContent = (this.modified ? "*" : "") + this.name;
    this.el.querySelector(".g-dir").textContent = this.folder;     // and the folder underneath
  }

  updatePosition() {                                               // update "Ln 3, Col 12"
    const before = this.textarea.value.slice(0, this.textarea.selectionStart); // text before the cursor
    const line = before.split("\n").length;                        // how many lines that is
    const col = before.length - before.lastIndexOf("\n");          // and how far along the last one
    this.el.querySelector(".g-pos").textContent = "Ln " + line + ", Col " + col;
  }

  refresh() {                                                      // redraw colours, numbers and size
    const text = this.textarea.value;                              // the current text
    this.highlight.innerHTML = this.isC ? highlightC(text) : esc(text) + "\n"; // the coloured copy
    const lineCount = text.split("\n").length;                     // how many lines there are
    let numbers = "";                                              // build the number column
    for (let i = 1; i <= lineCount; i++) numbers += i + "\n";      // one number per line
    this.numbers.textContent = numbers;                            // show them
    this.textarea.style.height = "auto";                           // let it shrink first
    this.textarea.style.height = Math.max(this.textarea.scrollHeight,
                                          this.el.querySelector(".g-body").clientHeight) + "px";
    this.updatePosition();                                         // the cursor may have moved
  }

  flash(message) {                                                 // show a short note in the title area
    const dir = this.el.querySelector(".g-dir");                   // the small grey line
    const original = dir.textContent;                              // remember what it said
    dir.textContent = message;                                     // show the note
    setTimeout(() => { dir.textContent = original; }, 1800);       // and put the old text back
  }

  save() {                                                         // write the file to the file system
    if (this.frozen) return;                                       // a paused editor cannot save
    this.shell.fs.writeFile(this.path, this.textarea.value);       // store the text
    this.shell.fs.save();                                          // and keep it after a reload
    this.modified = false;                                         // no unsaved changes now
    this.updateTitle();                                            // remove the star
    this.flash("Saved " + this.path);                              // tell the user
  }

  tryClose() {                                                     // the X button, or Ctrl-W
    if (this.frozen) return;                                       // a paused editor ignores clicks
    if (!this.modified) { this.finish(); return; }                 // nothing unsaved: just close
    this.showDialog(                                               // otherwise ask what to do
      "Save changes to document “" + this.name + "” before closing?",
      "If you don’t save, your changes will be permanently lost.",
      [["Close without Saving", () => { this.hideDialog(); this.finish(); }],
       ["Cancel", () => this.hideDialog()],
       ["Save", () => { this.save(); this.hideDialog(); this.finish(); }, true]]);
  }

  showDialog(title, message, buttons) {                            // a small pop-up inside the window
    this.hideDialog();                                             // never show two at once
    const over = document.createElement("div");                    // the dimmed layer
    over.className = "g-over";                                     // style it
    const box = document.createElement("div");                     // the box itself
    box.className = "g-dialog";                                    // style it
    box.innerHTML = "<strong>" + esc(title) + "</strong><p>" + message + "</p>"; // the words
    const row = document.createElement("div");                     // the row of buttons
    row.className = "g-row";                                       // style it
    for (const [label, action, isMain] of buttons) {               // for every button we were given
      const button = document.createElement("button");             // make it
      button.className = "g-btn" + (isMain ? " main" : "");        // the main one is blue
      button.textContent = label;                                  // its label
      button.addEventListener("click", action);                    // what it does
      row.appendChild(button);                                     // add it to the row
    }
    box.appendChild(row);                                          // put the row in the box
    over.appendChild(box);                                         // put the box on the dimmed layer
    this.el.appendChild(over);                                     // and that into the window
    this.dialog = over;                                            // remember it
  }

  hideDialog() {                                                   // remove the pop-up
    if (this.dialog) { this.dialog.remove(); this.dialog = null; } // if there is one
  }

  // Watch the process: when Ctrl-Z pauses the job, the window stops responding.
  watch() {                                                        // runs four times a second
    this.timer = setInterval(() => {                               // check again and again
      if (this.closed) return;                                     // nothing to do once closed
      const stopped = this.job && this.job.state === "stopped";    // has Ctrl-Z been pressed?
      if (stopped === this.frozen) return;                         // nothing changed
      this.frozen = stopped;                                       // remember the new state
      if (stopped) {                                               // the editor was just paused
        this.textarea.readOnly = true;                             // typing does nothing
        this.showDialog("“" + this.name + " - gedit” is not responding.",
          "The editor was paused with <code>Ctrl-Z</code> (SIGTSTP). Type <code>fg</code> " +
          "or <code>bg</code> in the terminal to let it continue.", []);
        this.dialog.classList.add("frozen");                       // grey the whole window out
      } else {                                                     // the editor was allowed to continue
        this.textarea.readOnly = false;                            // typing works again
        this.hideDialog();                                         // remove the "not responding" box
        this.textarea.focus();                                     // and put the cursor back
      }
    }, 250);
  }

  finish() {                                                       // close the window for good
    if (this.closed) return;                                       // only once
    this.closed = true;                                            // remember it
    clearInterval(this.timer);                                     // stop watching the process
    this.el.remove();                                              // take the window off the page
    if (this.onClose) this.onClose();                              // tell the waiting command
  }

  // Wait until the window is closed. The command sits here until then.
  waitUntilClosed() {                                              // returns a promise
    return new Promise(resolve => { this.onClose = resolve; });    // resolved by finish()
  }
}

/* ---------------------------------------------------------------------
   The gedit command itself
   --------------------------------------------------------------------- */
defineCommand("gedit", "open a file in the text editor", async ctx => {
  const { rest } = splitArgs(ctx.args);                            // the file name
  if (rest.length === 0) {                                         // gedit with no file
    ctx.error("gedit: please give a file name, for example: gedit hello.c\n");
    return 1;                                                      // failure
  }
  const path = rest[0];                                            // the file to edit
  const parent = ctx.fs.parentOf(path);                            // the folder it should be in
  if (!parent.dir) {                                               // that folder does not exist
    ctx.error("gedit: cannot open '" + path + "': No such file or directory\n");
    return 1;                                                      // failure
  }

  const editor = new GeditWindow(ctx.shell, path, ctx.process, ctx.job); // open the window
  ctx.shell.editors.push(editor);                                  // remember it

  const closed = editor.waitUntilClosed();                         // a promise that finishes on close
  try {                                                            // wait, but stay ready for signals
    for (;;) {                                                     // check over and over
      await ctx.checkSignals();                                    // Ctrl-C ends the editor
      const done = await Promise.race([closed.then(() => true), wait(120).then(() => false)]);
      if (done) break;                                             // the window was closed
    }
  } catch (e) {                                                    // a signal arrived
    editor.finish();                                               // close the window too
    ctx.shell.editors = ctx.shell.editors.filter(e2 => e2 !== editor); // forget it
    throw e;                                                       // let the shell report it
  }
  ctx.shell.editors = ctx.shell.editors.filter(e2 => e2 !== editor); // forget the closed window
  ctx.fs.save();                                                   // keep any saved changes
  return 0;                                                        // success
});
defineCommand("nano", "open a file in the text editor (the same as gedit)", COMMANDS["gedit"].run);

/* =====================================================================
   SECTION 17 : THE SHELL ITSELF
   This is the part that reads your command line, starts the programs,
   joins them with pipes, and looks after Ctrl-C, Ctrl-Z and the jobs.
   ===================================================================== */

// Commands that must run inside the shell, not as separate programs.
const SHELL_BUILTINS = ["cd", "exit", "logout", "export", "unset", "jobs", "fg", "bg",
                        "history", "alias", "source", "."];

class Shell {                                                      // one shell, for the whole page
  constructor(screen, fsys) {                                      // the screen and the file system
    this.screen = screen;                                          // where output goes
    this.fs = fsys;                                                // the file tree
    this.jobs = new JobTable();                                    // the list of jobs
    this.pid = randomInt(1400, 1900);                              // this shell's own process number
    nextPid = this.pid + 1;                                        // children are started after the shell
    this.startTime = Date.now();                                   // when the session began
    this.lastStatus = 0;                                           // the exit number of the last command
    this.running = true;                                           // false after `exit`
    this.foregroundJob = null;                                     // the job the terminal belongs to
    this.keyboardWaiter = null;                                    // a program waiting for a typed line
    this.editors = [];                                             // every open gedit window
    this.previousDir = HOME;                                       // where `cd -` goes back to
    this.env = {                                                   // the environment variables
      USER: USER, LOGNAME: USER, HOME: HOME, HOSTNAME: HOST,
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
      PWD: fsys.cwd, SHELL: "/bin/bash", TERM: "xterm-256color", LANG: "en_IN.UTF-8",
      EDITOR: "gedit", OSTYPE: "linux-gnu",
    };
  }

  /* ---------- the prompt ---------- */

  // Build the coloured prompt: user@ubuntu:~/Documents$
  prompt() {                                                       // returns ready-made HTML
    let path = this.fs.cwd;                                        // where we are
    if (path === HOME) path = "~";                                 // the home folder is shown as ~
    else if (path.startsWith(HOME + "/")) path = "~" + path.slice(HOME.length); // ~/Documents
    document.getElementById("title").textContent = USER + "@" + HOST + ": " + path;
    document.title = USER + "@" + HOST + ": " + path;              // the browser tab says the same
    return '<span class="c-green bold">' + USER + "@" + HOST + "</span>" + // user@ubuntu in green
           '<span class="c-white">:</span>' +                      // the colon
           '<span class="c-blue bold">' + esc(path) + "</span>" +  // the folder in blue
           '<span class="c-white">$ </span>';                      // and the dollar sign
  }

  /* ---------- starting up ---------- */

  async start() {                                                  // runs once when the page opens
    const restored = this.fs.load();                               // bring back any saved files
    this.env.PWD = this.fs.cwd;                                    // keep PWD in step
    this.screen.writeColor("MiniShell++ 1.0", "c-green bold");     // the welcome line
    this.screen.write("  (" + DISTRO + ", " + KERNEL + ")\n");     // what we pretend to be
    this.screen.write("A Linux shell running completely inside your browser. " +
                      "Nothing is installed.\n");                  // a one-line explanation
    this.screen.write("Type ");                                    // point at the first things to try
    this.screen.writeColor("help", "c-yellow bold");               // the help command
    this.screen.write(" for the command list, ");                  // ...
    this.screen.writeColor("demo", "c-yellow bold");               // the guided tour
    this.screen.write(" for a guided tour, or ");                  // ...
    this.screen.writeColor("man ls", "c-yellow bold");             // a manual page
    this.screen.write(" to read a manual page.\n");                // finish the sentence
    if (restored) this.screen.writeColor("Your files from last time were restored.\n", "c-grey");
    this.screen.write("\n");                                       // a blank line before the prompt
    await this.loop();                                             // then start reading commands
  }

  // Read a command, run it, and repeat for as long as the shell is running.
  async loop() {                                                   // the main loop
    while (this.running) {                                         // until `exit`
      this.reportFinishedJobs();                                   // "[1]+ Done sleep 5"
      this.jobs.tidy();                                            // forget jobs already reported
      const line = await this.screen.readLine(this.prompt(), {     // show the prompt and wait
        complete: () => this.completeWord(),                       // what the Tab key does
      });
      if (line === null) continue;                                 // nothing was typed
      await this.runLine(line);                                    // run whatever was typed
      this.fs.save();                                              // keep any file changes
    }
  }

  // Print a line for every background job that finished since last time.
  reportFinishedJobs() {                                           // called before each prompt
    for (const job of this.jobs.jobs.slice()) {                    // look at every job
      if (job.state !== "done" || job.notified) continue;          // only newly finished ones
      job.notified = true;                                         // do not report it twice
      if (!job.background) { this.jobs.forget(job); continue; }    // foreground jobs are already reported
      const label = job.exitCode === 0 ? "Done" : "Exit " + job.exitCode;
      this.screen.write("[" + job.id + "]+  " + padRight(label, 24) + job.command + "\n");
      this.jobs.forget(job);                                       // and forget it
    }
  }

  /* ---------- running one line ---------- */

  async runLine(text) {                                            // the text the user typed
    const expanded = this.expandHistory(text);                     // turn !! and !5 into real commands
    if (expanded === null) return;                                 // the history number did not exist
    if (expanded !== text) {                                       // something was replaced
      this.screen.write(expanded + "\n");                          // bash shows the real command first
    }
    if (expanded.trim() === "") return;                            // an empty line does nothing

    let list;                                                      // the parsed pipelines
    try {                                                          // the line may be badly written
      list = parseLine(expanded, this);                            // read it
    } catch (e) {                                                  // it was
      if (e instanceof ParseError) {                               // a mistake we understand
        this.screen.writeError("bash: " + e.message + "\n");       // report it like bash
        this.lastStatus = 2;                                       // bash uses 2 for syntax errors
        return;                                                    // nothing was run
      }
      throw e;                                                     // anything else is a bug
    }

    for (let i = 0; i < list.length; i++) {                        // run the pipelines in order
      const entry = list[i];                                       // the current one
      const status = await this.runPipeline(entry);                // run it and keep its exit number
      this.lastStatus = status;                                    // remember it for $?
      const joiner = entry.next;                                   // the symbol that followed it
      if (joiner === "&&" && status !== 0) {                       // "a && b": b runs only if a worked
        while (i + 1 < list.length && list[i].next === "&&") i++;  // skip the rest of the chain
      } else if (joiner === "||" && status === 0) {                // "a || b": b runs only if a failed
        while (i + 1 < list.length && list[i].next === "||") i++;  // skip the rest of the chain
      }
    }
  }

  // Replace !! with the last command and !5 with command number 5.
  expandHistory(text) {                                            // the text the user typed
    if (!text.includes("!")) return text;                          // nothing to do
    const history = this.screen.history;                           // the list of earlier commands
    let out = "";                                                  // the finished text
    let inSingleQuotes = false;                                    // ! means nothing inside ' '
    for (let i = 0; i < text.length; i++) {                        // one character at a time
      const ch = text[i];                                          // the current character
      if (ch === "'") inSingleQuotes = !inSingleQuotes;            // keep track of quoting
      if (ch === "\\" && i + 1 < text.length) { out += ch + text[++i]; continue; } // \! is a plain !
      if (ch !== "!" || inSingleQuotes || i + 1 >= text.length) { out += ch; continue; }

      if (text[i + 1] === "!") {                                   // "!!" means the last command
        const previous = history[history.length - 2];              // the one before this line
        if (previous === undefined) {                              // there is none
          this.screen.writeError("bash: !!: event not found\n");
          this.lastStatus = 1;                                     // bash returns 1
          return null;                                             // nothing to run
        }
        out += previous; i++; continue;                            // use it and move on
      }
      const digits = /^\d+/.exec(text.slice(i + 1));               // "!5" means command number 5
      if (digits) {                                                // there is a number
        const wanted = history[parseInt(digits[0], 10) - 1];       // history is numbered from 1
        if (wanted === undefined) {                                // no such command
          this.screen.writeError("bash: !" + digits[0] + ": event not found\n");
          this.lastStatus = 1;                                     // bash returns 1
          return null;                                             // nothing to run
        }
        out += wanted; i += digits[0].length; continue;            // use it and move on
      }
      out += ch;                                                   // a "!" that means nothing special
    }
    return out;                                                    // the finished command line
  }

  /* ---------- running one pipeline ---------- */

  async runPipeline(entry) {                                       // one "a | b | c", maybe with &
    const commands = entry.commands;                               // the commands inside it

    // A single built-in in the foreground runs inside the shell itself.
    if (commands.length === 1 && !entry.background &&
        SHELL_BUILTINS.includes(commands[0].argv[0])) {
      return await this.runBuiltin(commands[0]);                   // cd, export, jobs, fg ...
    }

    // Check every command exists before starting anything.
    for (const command of commands) {                              // look at each one
      const name = command.argv[0];                                // the program's name
      if (COMMANDS[name] || SHELL_BUILTINS.includes(name)) continue;   // we know it
      if (name.includes("/")) {                                    // something like ./a.out
        const node = this.fs.get(name);                            // look the file up
        if (!node) { this.screen.writeError("bash: " + name + ": No such file or directory\n"); return 127; }
        if (node.type === "dir") { this.screen.writeError("bash: " + name + ": Is a directory\n"); return 126; }
        if (!(node.mode & 0o111)) { this.screen.writeError("bash: " + name + ": Permission denied\n"); return 126; }
        continue;                                                  // it is a program we can run
      }
      this.screen.writeError("bash: " + name + ": command not found\n"); // we have never heard of it
      return 127;                                                  // the number Linux uses
    }

    // Make one process for each command, and put them all in one job.
    const processes = commands.map(c => new Process(c.argv[0].replace(/^.*\//, ""), entry.text));
    const job = this.jobs.add(entry.text, processes, entry.background);
    job.completion = null;                                         // filled in below

    // Build the pipes between neighbouring commands.
    const pipes = [];                                              // one fewer pipe than commands
    for (let i = 0; i < commands.length - 1; i++) pipes.push(new Pipe());

    // Start every command. They all run at the same time, like real processes.
    const stages = commands.map((command, index) =>
      this.runCommand(command, job, processes[index], pipes[index - 1] || null, pipes[index] || null));

    const finished = Promise.all(stages).then(results => {         // when they have all finished
      const last = results[results.length - 1];                    // the exit number of the last one
      job.finish(typeof last === "number" ? last : 0);             // mark the job as done
      return job.exitCode;                                         // and hand the number back
    });
    job.completion = finished;                                     // remember it, so fg can wait again

    if (entry.background) {                                        // started with "&"
      this.screen.write("[" + job.id + "] " + processes[processes.length - 1].pid + "\n");
      return 0;                                                    // the shell carries straight on
    }
    return await this.waitForJob(job);                             // otherwise wait for it to finish
  }

  // Wait for a foreground job: it either finishes, or Ctrl-Z stops it.
  async waitForJob(job) {                                          // the job to wait for
    this.foregroundJob = job;                                      // the terminal belongs to it now
    const stopped = new Promise(resolve => { job.onStop = resolve; }); // resolved by Ctrl-Z
    const result = await Promise.race([                            // whichever happens first
      job.completion.then(code => ({ done: true, code: code })),   // it finished
      stopped.then(() => ({ done: false })),                       // it was paused
    ]);
    this.foregroundJob = null;                                     // the shell has the terminal again

    if (!result.done) {                                            // Ctrl-Z was pressed
      this.screen.newlineIfNeeded();                               // start on a fresh line
      this.screen.write("[" + job.id + "]+  Stopped                 " + job.command + "\n");
      job.notified = true;                                         // do not report it again
      return 148;                                                  // 128 + 20 (SIGTSTP), as in bash
    }
    if (job.state === "done") this.jobs.forget(job);               // tidy the finished job away
    return result.code;                                            // its exit number
  }

  /* ---------- running one command inside a pipeline ---------- */

  async runCommand(command, job, process, inPipe, outPipe) {       // one stage of the pipeline
    const ctx = new Context(this, process, job);                   // how this command prints and reads
    ctx.args = command.argv;                                       // its words

    // Where does its input come from?
    if (command.stdinFile) {                                       // "< file"
      const text = this.fs.readFile(command.stdinFile);            // read the file
      if (text === null) {                                         // it is not there
        this.screen.writeError("bash: " + command.stdinFile + ": No such file or directory\n");
        process.state = "Z";                                       // the command never starts
        return 1;                                                  // failure
      }
      ctx.source = { kind: "text", text: text, pos: 0 };           // read from that text
    } else if (inPipe) {                                           // the command before us
      ctx.source = { kind: "pipe", pipe: inPipe };                 // read from the pipe
    } else {                                                       // nothing else: the keyboard
      ctx.source = { kind: "keyboard" };                           // ask the user to type
    }

    // Where does its output go?
    if (command.stdoutFile) {                                      // "> file" or ">> file"
      const sink = new FileSink(this.fs, command.stdoutFile, command.stdoutAppend);
      if (sink.failed) {                                           // the folder does not exist
        this.screen.writeError("bash: " + command.stdoutFile + ": No such file or directory\n");
        process.state = "Z";                                       // nothing runs
        return 1;                                                  // failure
      }
      ctx.sink = sink;                                             // send output to the file
    } else if (outPipe) {                                          // there is another command after us
      ctx.sink = new PipeSink(outPipe);                            // send output down the pipe
    } else {                                                       // the last command in the line
      ctx.sink = new ScreenSink(this.screen, false);               // print to the screen
    }

    // Where do its error messages go?
    if (command.stderrFile) {                                      // "2> file"
      ctx.errSink = new FileSink(this.fs, command.stderrFile, command.stderrAppend);
    } else if (command.stderrToStdout) {                           // "2>&1"
      ctx.errSink = ctx.sink;                                      // errors follow the normal output
    } else {                                                       // the usual case
      ctx.errSink = new ScreenSink(this.screen, true);             // errors go to the screen, in red
    }

    let status = 0;                                                // the exit number we will return
    try {                                                          // run the command
      const name = command.argv[0];                                // its name
      if (name.includes("/")) {                                    // "./a.out" and friends
        status = await runCompiledProgram(ctx, name);              // run the compiled C program
      } else if (COMMANDS[name]) {                                 // one of our built-in programs
        status = await COMMANDS[name].run(ctx);                    // run it
      } else if (SHELL_BUILTINS.includes(name)) {                  // a built-in inside a pipeline
        status = await this.runBuiltin(command, ctx);              // run it with this context
      } else {                                                     // should not happen: we checked earlier
        ctx.error("bash: " + name + ": command not found\n");
        status = 127;                                              // the number Linux uses
      }
    } catch (e) {                                                  // the command stopped early
      if (e instanceof SignalError) {                              // Ctrl-C, or a kill command
        status = e.signal === "SIGPIPE" ? 0                        // SIGPIPE is normal in a pipeline
               : 128 + (SIGNALS[e.signal.replace("SIG", "")] || 15); // otherwise 128 + the number
        if (e.signal === "SIGINT") this.screen.newlineIfNeeded();  // Ctrl-C starts a new line
      } else if (e instanceof RuntimeErrorC) {                     // a mistake inside a C program
        ctx.error(command.argv[0] + ": " + e.message + "\n");      // explain it
        status = 1;                                                // failure
      } else {                                                     // a bug in the shell itself
        ctx.error("bash: internal error: " + (e && e.message ? e.message : e) + "\n");
        status = 1;                                                // failure
      }
    } finally {                                                    // always tidy up
      ctx.sink.close();                                            // flush files, close pipes
      if (ctx.errSink !== ctx.sink) ctx.errSink.close();           // the same for the error file
      if (inPipe) inPipe.closeReader();                            // tell the command before us to stop
      process.state = "Z";                                         // this process has finished
      process.exitCode = status;                                   // remember its exit number
    }
    return status;                                                 // hand the number back
  }

  /* ---------- the commands built into the shell ---------- */

  async runBuiltin(command, existingCtx) {                         // cd, export, jobs, fg, bg ...
    const args = command.argv;                                     // the words
    const name = args[0];                                          // the command name
    // A context so built-ins can print like any other command.
    const ctx = existingCtx || (() => {                            // reuse one if we were given it
      const c = new Context(this, new Process(name, args.join(" ")), null); // a throwaway process
      c.args = args;                                               // its words
      c.sink = command.stdoutFile                                  // honour "> file" for built-ins too
        ? new FileSink(this.fs, command.stdoutFile, command.stdoutAppend)
        : new ScreenSink(this.screen, false);                      // otherwise the screen
      c.errSink = new ScreenSink(this.screen, true);               // errors go to the screen
      c.source = { kind: "keyboard" };                             // built-ins rarely read input
      return c;                                                    // ready to use
    })();

    let status = 0;                                                // the exit number
    try {                                                          // run the right one
      switch (name) {
        case "cd": status = this.builtinCd(ctx, args); break;      // change folder
        case "exit": case "logout": status = this.builtinExit(ctx, args); break; // leave the shell
        case "export": status = this.builtinExport(ctx, args); break;  // set a variable
        case "unset": status = this.builtinUnset(ctx, args); break;    // remove a variable
        case "jobs": status = this.builtinJobs(ctx, args); break;      // list the jobs
        case "fg": status = await this.builtinFg(ctx, args); break;    // bring a job forward
        case "bg": status = this.builtinBg(ctx, args); break;          // continue one in the background
        case "history": status = this.builtinHistory(ctx, args); break;// the command list
        case "alias": ctx.write("alias ll='ls -alF'\nalias la='ls -A'\n"); break; // a fixed answer
        case "source": case ".": ctx.error("bash: " + name + ": not supported here\n"); status = 1; break;
        default: ctx.error("bash: " + name + ": not a built-in\n"); status = 127;
      }
    } finally {                                                    // always tidy up
      if (!existingCtx) ctx.sink.close();                          // write any redirected file
    }
    return status;                                                 // hand the number back
  }

  builtinCd(ctx, args) {                                           // cd [folder]
    let target = args[1];                                          // where to go
    if (target === undefined) target = HOME;                       // "cd" alone means home
    else if (target === "-") {                                     // "cd -" goes back
      target = this.previousDir;                                   // the folder we were in before
      ctx.write(this.fs.resolve(target) + "\n");                   // bash prints the new folder
    }
    const full = this.fs.resolve(target);                          // tidy the path
    const node = this.fs.get(full);                                // look it up
    if (!node) {                                                   // it does not exist
      ctx.error("bash: cd: " + args[1] + ": No such file or directory\n");
      return 1;                                                    // failure
    }
    if (node.type !== "dir") {                                     // it is a file
      ctx.error("bash: cd: " + args[1] + ": Not a directory\n");
      return 1;                                                    // failure
    }
    this.previousDir = this.fs.cwd;                                // remember where we were
    this.fs.cwd = full;                                            // move there
    this.env.PWD = full;                                           // keep PWD in step
    this.env.OLDPWD = this.previousDir;                            // and OLDPWD too
    this.fs.save();                                                // remember it after a reload
    return 0;                                                      // success
  }

  builtinExit(ctx, args) {                                         // exit [number]
    const stopped = this.jobs.live().filter(j => j.state === "stopped"); // any paused jobs?
    if (stopped.length && !this.warnedAboutJobs) {                 // warn once, like bash
      ctx.error("There are stopped jobs.\n");                      // the exact bash message
      this.warnedAboutJobs = true;                                 // only warn once
      return 1;                                                    // and do not exit yet
    }
    const code = args[1] !== undefined ? parseInt(args[1], 10) & 0xff : this.lastStatus;
    this.screen.write("logout\n");                                 // bash prints this
    this.screen.writeColor("\n[Session ended. Reload the page to start a new one.]\n", "c-grey");
    this.running = false;                                          // stop the main loop
    this.screen.endLine(false);                                    // remove the prompt
    for (const editor of this.editors.slice()) editor.finish();    // close any gedit windows
    return code;                                                   // the exit number
  }

  builtinExport(ctx, args) {                                       // export NAME=value
