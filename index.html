    if (args.length === 1) {                                       // "export" on its own lists them
      for (const key of Object.keys(this.env).sort())              // in alphabetical order
        ctx.write('declare -x ' + key + '="' + this.env[key] + '"\n');
      return 0;                                                    // success
    }
    for (const assignment of args.slice(1)) {                      // for every NAME=value given
      const equals = assignment.indexOf("=");                      // find the "="
      if (equals === -1) continue;                                 // "export NAME" alone: nothing to do
      const key = assignment.slice(0, equals);                     // the name
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) {                 // check it is a valid name
        ctx.error("bash: export: `" + assignment + "': not a valid identifier\n");
        return 1;                                                  // failure
      }
      this.env[key] = assignment.slice(equals + 1);                // store the value
    }
    return 0;                                                      // success
  }

  builtinUnset(ctx, args) {                                        // unset NAME
    for (const key of args.slice(1)) delete this.env[key];         // remove each one
    return 0;                                                      // success
  }

  builtinJobs(ctx, args) {                                         // jobs [-l]
    const long = args.includes("-l");                              // -l also shows process numbers
    const current = this.jobs.current();                           // the job marked with "+"
    const previous = this.jobs.previous();                         // the job marked with "-"
    for (const job of this.jobs.jobs) {                            // every job we know about
      if (job.state === "done" && job.notified) continue;          // skip ones already reported
      const mark = job === current ? "+" : job === previous ? "-" : " "; // the + or - marker
      const label = job.state === "running" ? "Running"            // what it is doing
                  : job.state === "stopped" ? "Stopped"
                  : job.exitCode === 0 ? "Done" : "Exit " + job.exitCode;
      ctx.write("[" + job.id + "]" + mark + "  " +                 // "[1]+  "
        (long ? job.pgid + " " : "") +                             // the process group, with -l
        padRight(label, 24) + job.command +                        // what it is doing, then the command
        (job.state === "running" && job.background ? " &" : "") + "\n");
      if (job.state === "done") job.notified = true;               // it has now been reported
    }
    return 0;                                                      // success
  }

  // Find the job a user means by "%1", "%+", "1" or nothing at all.
  pickJob(ctx, args, commandName) {                                // returns a job, or null
    const spec = args[1];                                          // what the user wrote
    let job;                                                       // the job we choose
    if (spec === undefined || spec === "%%" || spec === "%+") job = this.jobs.current();
    else if (spec === "%-") job = this.jobs.previous();            // the one before that
    else job = this.jobs.find(parseInt(spec.replace("%", ""), 10)); // "%2" or "2"
    if (!job || job.state === "done") {                            // nothing suitable
      ctx.error("bash: " + commandName + ": " +
                (spec === undefined ? "current" : spec) + ": no such job\n");
      return null;                                                 // the caller gives up
    }
    return job;                                                    // the job to act on
  }

  async builtinFg(ctx, args) {                                     // fg [%job]
    const job = this.pickJob(ctx, args, "fg");                     // which job?
    if (!job) return 1;                                            // there was none
    ctx.write(job.command + "\n");                                 // bash echoes the command
    job.background = false;                                        // it is in front now
    if (job.state === "stopped") job.resume();                     // let it carry on
    return await this.waitForJob(job);                             // and wait for it
  }

  builtinBg(ctx, args) {                                           // bg [%job]
    const job = this.pickJob(ctx, args, "bg");                     // which job?
    if (!job) return 1;                                            // there was none
    if (job.state === "running") {                                 // it is not paused
      ctx.error("bash: bg: job " + job.id + " already in background\n");
      return 0;                                                    // bash still returns 0
    }
    job.background = true;                                         // it keeps running behind us
    job.resume();                                                  // let it carry on
    ctx.write("[" + job.id + "]+ " + job.command + " &\n");        // bash prints this
    return 0;                                                      // success
  }

  builtinHistory(ctx, args) {                                      // history [-c] [N]
    const history = this.screen.history;                           // the list of commands
    if (args[1] === "-c") { history.length = 0; return 0; }        // -c forgets everything
    let start = 0;                                                 // which one to start at
    if (args[1] !== undefined) {                                   // a number was given
      const count = parseInt(args[1], 10);                         // how many to show
      if (isNaN(count)) {                                          // it was not a number
        ctx.error("bash: history: " + args[1] + ": numeric argument required\n");
        return 1;                                                  // failure
      }
      start = Math.max(0, history.length - count);                 // show only the last few
    }
    for (let i = start; i < history.length; i++)                   // print them
      ctx.write(padLeft(i + 1, 5) + "  " + history[i] + "\n");     // number, then the command
    return 0;                                                      // success
  }

  /* ---------- reading a line from the keyboard for a program ---------- */

  async readFromKeyboard(ctx) {                                    // used by cat, scanf and others
    if (this.keyboardWaiter) return null;                          // only one program at a time
    return await new Promise(resolve => {                          // wait for the user to type
      this.keyboardWaiter = { resolve: resolve, ctx: ctx };        // remember who is waiting
      this.screen.readLine("", {}).then(line => {                  // show a bare cursor and wait
        if (!this.keyboardWaiter) return;                          // it was cancelled by Ctrl-C
        this.keyboardWaiter = null;                                // nobody is waiting now
        resolve(line);                                             // hand the line to the program
      });
    });
  }

  // Stop a program that is waiting for input (used by Ctrl-C and Ctrl-D).
  cancelKeyboardWait(value) {                                      // what to give the program
    if (!this.keyboardWaiter) return false;                        // nobody is waiting
    const waiter = this.keyboardWaiter;                            // the program that was waiting
    this.keyboardWaiter = null;                                    // clear it first
    this.screen.endLine(false);                                    // remove the input line
    this.screen.onLine = null;                                     // nothing is waiting for Enter
    waiter.resolve(value);                                         // hand over null, or the text
    return true;                                                   // we did cancel something
  }

  /* ---------- signals ---------- */

  // Send a signal to every process in a job, the way kill(-pgid, sig) does on Linux.
  sendSignal(job, signal) {                                        // the job and the signal name
    if (signal === "SIGCONT") {                                    // let a paused job carry on
      if (job.state === "stopped") { job.background = true; job.resume(); }
      return;                                                      // nothing else to do
    }
    if (signal === "SIGSTOP" || signal === "SIGTSTP") {            // pause the job
      if (job.state === "running") {                               // only if it is running
        job.stop();                                                // mark every process stopped
        if (job.onStop) { const go = job.onStop; job.onStop = null; go(); } // wake the shell
      }
      return;                                                      // nothing else to do
    }
    for (const process of job.processes)                           // every process in the job
      if (process.state !== "Z") process.killedBy = signal;        // mark it for the next check
    if (job.state === "stopped") job.resume();                     // a paused job must wake up to die
    if (this.keyboardWaiter && this.keyboardWaiter.ctx.job === job) // it was waiting for typing
      this.cancelKeyboardWait(null);                               // stop that wait
  }

  // Handle Ctrl-C, Ctrl-Z, Ctrl-D and Ctrl-L. Returns true if we used the key.
  handleControlKey(letter) {                                       // "c", "z", "d" or "l"
    if (letter === "l") {                                          // Ctrl-L clears the screen
      this.screen.clear();                                         // wipe it
      this.screen.renderLine();                                    // draw the prompt again
      return true;                                                 // we used the key
    }

    if (letter === "c") {                                          // Ctrl-C interrupts
      this.screen.write("^C\n");                                   // the terminal shows ^C
      if (this.foregroundJob) {                                    // a program is running
        this.sendSignal(this.foregroundJob, "SIGINT");             // tell it to stop
      } else if (this.keyboardWaiter) {                            // a program is reading input
        this.cancelKeyboardWait(null);                             // stop the read
      } else {                                                     // we are at the prompt
        this.screen.endLine(false);                                // throw away what was typed
        this.screen.readLine(this.prompt(), { complete: () => this.completeWord() })
          .then(line => { if (line !== null) this.runLine(line); });  // and show a fresh prompt
        return true;                                               // we used the key
      }
      return true;                                                 // we used the key
    }

    if (letter === "z") {                                          // Ctrl-Z pauses
      if (!this.foregroundJob) return true;                        // nothing to pause
      this.screen.write("^Z\n");                                   // the terminal shows ^Z
      if (this.keyboardWaiter && this.keyboardWaiter.ctx.job === this.foregroundJob)
        this.cancelKeyboardWait("");                               // a program waiting for input pauses too
      this.sendSignal(this.foregroundJob, "SIGTSTP");              // pause the whole job
      return true;                                                 // we used the key
    }

    if (letter === "d") {                                          // Ctrl-D means "end of input"
      if (this.keyboardWaiter) {                                   // a program is reading
        if (this.screen.input === "") {                            // only on an empty line
          this.screen.write("\n");                                 // move to a new line
          this.cancelKeyboardWait(null);                           // tell the program the input ended
        }
        return true;                                               // we used the key
      }
      if (this.screen.inputVisible && this.screen.input === "") {  // at an empty prompt
        this.screen.write("\n");                                   // move to a new line
        this.runLine("exit");                                      // Ctrl-D at the prompt means exit
        return true;                                               // we used the key
      }
      return true;                                                 // ignore it otherwise
    }

    return false;                                                  // some other Ctrl key: not ours
  }

  /* ---------- the Tab key ---------- */

  completeWord() {                                                 // finish the word being typed
    const screen = this.screen;                                    // the screen holds the typed text
    const before = screen.input.slice(0, screen.cursor);           // everything left of the cursor
    const match = /(\S*)$/.exec(before);                           // the word we are in
    const partial = match[1];                                      // what has been typed of it
    const isFirstWord = before.trim() === partial;                 // is it the command name?

    let candidates;                                                // the possible completions
    if (isFirstWord && !partial.includes("/")) {                    // completing a command name
      candidates = Object.keys(COMMANDS).concat(SHELL_BUILTINS)    // every command we know
        .filter(name => name.startsWith(partial)).sort();          // that starts with what was typed
    } else {                                                       // completing a file name
      const cut = partial.lastIndexOf("/");                        // is a folder named?
      const folder = cut === -1 ? "." : (cut === 0 ? "/" : partial.slice(0, cut));
      const prefix = cut === -1 ? partial : partial.slice(cut + 1);// the part to match
      const names = this.fs.list(folder, prefix.startsWith("."));  // everything in that folder
      if (!names) return;                                          // the folder does not exist
      candidates = names.filter(name => name.startsWith(prefix)).sort() // the matching names
        .map(name => {                                             // add a "/" after folders
          const node = this.fs.get(folder + "/" + name);           // look it up
          return (cut === -1 ? "" : partial.slice(0, cut + 1)) + name + (node.type === "dir" ? "/" : "");
        });
    }

    if (candidates.length === 0) return;                           // nothing matches: do nothing

    if (candidates.length === 1) {                                 // exactly one: use it
      const completion = candidates[0] + (candidates[0].endsWith("/") ? "" : " "); // a space after
      screen.input = screen.input.slice(0, screen.cursor - partial.length) +
                     completion + screen.input.slice(screen.cursor);
      screen.cursor += completion.length - partial.length;         // move the cursor along
      screen.renderLine();                                         // redraw the line
      return;                                                      // done
    }

    // Several matches: fill in as much as they all share.
    let shared = candidates[0];                                    // start with the first one
    for (const candidate of candidates)                            // compare with each of the others
      while (!candidate.startsWith(shared)) shared = shared.slice(0, -1); // shorten until it fits
    if (shared.length > partial.length) {                          // we can add something
      screen.input = screen.input.slice(0, screen.cursor - partial.length) +
                     shared + screen.input.slice(screen.cursor);
      screen.cursor += shared.length - partial.length;             // move the cursor along
      screen.renderLine();                                         // redraw the line
      return;                                                      // done
    }

    // Nothing more is shared: show the choices, as bash does.
    screen.endLine(true);                                          // freeze the current line
    let line = "";                                                 // build rows of names
    candidates.forEach((name, i) => {                              // for each possible completion
      line += padRight(name, 20);                                  // in a 20-wide column
      if ((i + 1) % 4 === 0) { screen.write(line + "\n"); line = ""; } // four per line
    });
    if (line.trim()) screen.write(line + "\n");                    // anything left over
    const keep = screen.input;                                     // what the user had typed
    const position = screen.cursor;                                // and where the cursor was
    screen.readLine(this.prompt(), { complete: () => this.completeWord() })
      .then(text => { if (text !== null) this.runLine(text); });   // show a fresh prompt
    screen.input = keep;                                           // put the typed text back
    screen.cursor = position;                                      // and the cursor
    screen.renderLine();                                           // redraw it
  }
}

/* =====================================================================
   SECTION 18 : THE BUILT-IN TEST SUITE
   `selftest` runs every command and checks the answers. It is how we
   show the shell really works, on any computer, without installing
   anything. Each test is a command line and the text its output must
   contain.
   ===================================================================== */

// Run a command line and collect everything it prints, instead of showing it.
async function runCaptured(shell, line) {                          // the shell and the command
  const realScreen = shell.screen;                                 // remember the real screen
  let collected = "";                                              // the output we collect
  shell.screen = {                                                 // a stand-in that just collects text
    write: text => { collected += text; },                         // ordinary output
    writeError: text => { collected += text; },                    // error messages
    writeColor: (text, cls) => { collected += text; },             // coloured output
    writeHtml: html => { collected += html.replace(/<[^>]*>/g, ""); }, // strip the colour tags
    newlineIfNeeded: () => {},                                     // nothing to do here
    clear: () => {},                                               // "clear" does nothing in a test
    endLine: () => {},                                             // no line is being typed
    renderLine: () => {},                                          // nothing to draw
    readLine: async () => null,                                    // tests never type anything
    history: realScreen.history,                                   // share the real history
    box: realScreen.box,                                           // in case something looks at it
    input: "", cursor: 0, inputVisible: false,                     // the fields a command may read
  };
  try {                                                            // run the command
    await shell.runLine(line);                                     // exactly as if it were typed
  } finally {                                                      // whatever happens
    shell.screen = realScreen;                                     // put the real screen back
  }
  return collected;                                                // hand back what was printed
}

defineCommand("selftest", "check that every part of the shell works", async ctx => {
  const shell = ctx.shell;                                         // the shell we are testing
  const startDir = shell.fs.cwd;                                   // so we can return here afterwards

  // Each test is: a name, a command line, and the text the output must contain.
  const tests = [
    // ---- moving around and looking at files ----
    ["pwd prints the folder",        "cd /tmp/selftest && pwd",        "/tmp/selftest"],
    ["mkdir creates a folder",       "mkdir sub && ls",                "sub"],
    ["mkdir -p creates a chain",     "mkdir -p a/b/c && ls a/b",       "c"],
    ["cd .. goes up one level",      "cd sub && cd .. && pwd",         "/tmp/selftest"],
    ["touch creates a file",         "touch empty.txt && ls empty.txt","empty.txt"],
    ["echo writes into a file",      "echo hello > one.txt && cat one.txt", "hello"],
    [">> adds to a file",            "echo world >> one.txt && cat one.txt", "hello\nworld"],
    ["> replaces a file",            "echo fresh > one.txt && cat one.txt", "fresh"],
    ["cp copies a file",             "cp one.txt two.txt && cat two.txt", "fresh"],
    ["mv renames a file",            "mv two.txt three.txt && ls three.txt", "three.txt"],
    ["rm deletes a file",            "rm three.txt && ls",             "one.txt"],
    ["ls -l shows permissions",      "ls -l one.txt",                  "-rw-r--r--"],
    ["ls -a shows hidden files",     "touch .secret && ls -a",         ".secret"],
    ["rm -r deletes a folder",       "rm -r a && ls",                  "sub"],
    ["tree draws the folders",       "tree",                           "director"],
    ["find looks for a name",        "find . -name 'one.txt'",         "one.txt"],
    ["chmod changes permissions",    "chmod 755 one.txt && ls -l one.txt", "-rwxr-xr-x"],

    // ---- text ----
    ["cat -n numbers the lines",     "printf-check; echo a > n.txt; echo b >> n.txt; cat -n n.txt", "1\ta"],
    ["wc -l counts lines",           "wc -l < n.txt",                  "2"],
    ["head takes the first line",    "head -n 1 n.txt",                "a"],
    ["tail takes the last line",     "tail -n 1 n.txt",                "b"],
    ["grep finds a line",            "grep b n.txt",                   "b"],
    ["grep -c counts matches",       "grep -c a n.txt",                "1"],
    ["grep -v turns it around",      "grep -v a n.txt",                "b"],
    ["sort puts lines in order",     "echo b > s.txt; echo a >> s.txt; sort s.txt", "a\nb"],
    ["uniq removes repeats",         "echo x > u.txt; echo x >> u.txt; uniq u.txt", "x"],
    ["echo understands variables",   "echo $HOME",                     "/home/user"],
    ["single quotes stay literal",   "echo '$HOME'",                   "$HOME"],

    // ---- joining commands together ----
    ["a pipe passes text along",     "cat n.txt | wc -l",              "2"],
    ["three commands in a pipeline", "cat n.txt | sort -r | head -n 1","b"],
    ["a pipe closes early",          "yes ok | head -n 2",             "ok\nok"],
    ["&& runs the second command",   "true && echo yes-ran",           "yes-ran"],
    ["&& stops after a failure",     "false && echo should-not-print", ""],
    ["|| runs after a failure",      "false || echo recovered",        "recovered"],
    ["; runs both commands",         "echo first; echo second",        "first\nsecond"],
    ["wildcards find files",         "ls *.txt",                       "one.txt"],
    ["2> catches error messages",    "ls /nope 2> e.txt; cat e.txt",   "No such file or directory"],
    ["< reads from a file",          "sort < s.txt",                   "a\nb"],

    // ---- the system ----
    ["whoami prints the user",       "whoami",                         "user"],
    ["uname -a describes the system","uname -a",                       "Linux ubuntu"],
    ["ps lists the processes",       "ps",                             "PID TTY"],
    ["ps aux has the long columns",  "ps aux",                         "%CPU"],
    ["pid shows the shell's numbers","pid",                            "PID   (this shell)"],
    ["which finds a command",        "which ls",                       "/bin/ls"],
    ["env lists the variables",      "env | grep HOME",                "HOME=/home/user"],
    ["man prints a manual page",     "man ls",                         "list directory contents"],
    ["help lists the commands",      "help",                           "Files and folders"],
    ["kill -l lists the signals",    "kill -l",                        "SIGKILL"],

    // ---- mistakes are reported properly ----
    ["unknown commands are caught",  "no-such-command",                "command not found"],
    ["exit status 127 is set",       "no-such-command; echo $?",       "127"],
    ["missing files are reported",   "cat missing.txt",                "No such file or directory"],
    ["a stray pipe is a syntax error","| ls",                          "syntax error"],
    ["unclosed quotes are caught",   'echo "abc',                      "unexpected EOF"],

    // ---- the C compiler ----
    ["gcc compiles a program",       "cd /tmp/selftest && gcc t1.c -o t1 && ls t1", "t1"],
    ["a compiled program runs",      "./t1",                           "Hello from C"],
    ["for loops work",               "./t2",                           "1 4 9 16 25"],
    ["functions and recursion work", "./t3",                           "120"],
    ["arrays and strings work",      "./t4",                           "sum=15 name=OS"],
    ["float division keeps decimals","./t5",                           "3.50 and 3"],
    ["if, while and switch work",    "./t6",                           "odd-5-three"],
    ["printf formats correctly",     "./t7",                           "|   7|7    |00007|ff|A|"],
    ["gcc reports a missing ;",      "gcc bad.c",                      "error: expected ';'"],
    ["gcc reports a missing main",   "gcc nomain.c",                   "main"],
  ];

  // The C programs the tests above compile and run.
  const programs = {
    "t1.c": '#include <stdio.h>\nint main(){ printf("Hello from C\\n"); return 0; }',
    "t2.c": '#include <stdio.h>\nint main(){ int i; for(i=1;i<=5;i++) printf("%d ", i*i); printf("\\n"); return 0; }',
    "t3.c": '#include <stdio.h>\nint f(int n){ if(n<=1) return 1; return n*f(n-1); }\n' +
            'int main(){ printf("%d\\n", f(5)); return 0; }',
    "t4.c": '#include <stdio.h>\n#include <string.h>\nint main(){ int a[5]={1,2,3,4,5}, i, s=0;\n' +
            ' char name[10]="OS";\n for(i=0;i<5;i++) s+=a[i];\n printf("sum=%d name=%s\\n", s, name); return 0; }',
    "t5.c": '#include <stdio.h>\nint main(){ int a=7,b=2; printf("%.2f and %d\\n", (float)a/b, a/b); return 0; }',
    "t6.c": '#include <stdio.h>\nint main(){ int n=5, i=0;\n if(n%2==0) printf("even"); else printf("odd");\n' +
            ' while(i<1){ printf("-%d", n); i++; }\n switch(n%4){ case 1: printf("-three"); break; default: printf("-other"); }\n' +
            ' printf("\\n"); return 0; }',
    "t7.c": '#include <stdio.h>\nint main(){ printf("|%4d|%-5d|%05d|%x|%c|\\n", 7, 7, 7, 255, 65); return 0; }',
    "bad.c": '#include <stdio.h>\nint main(){ int a = 1\n printf("%d", a); return 0; }',
    "nomain.c": '#include <stdio.h>\nint helper(){ return 1; }',
  };

  // Set up a clean folder to work in.
  shell.fs.remove("/tmp/selftest");                                // throw away any earlier run
  shell.fs.mkdirp("/tmp/selftest");                                // and start fresh
  for (const [name, source] of Object.entries(programs))           // write the test programs
    shell.fs.writeFile("/tmp/selftest/" + name, source);           // into that folder
  shell.fs.cwd = "/tmp/selftest";                                  // work there

  // Compile the programs the running tests need.
  for (const name of ["t1", "t2", "t3", "t4", "t5", "t6", "t7"])   // every program that must run
    await runCaptured(shell, "gcc " + name + ".c -o " + name);     // compile it quietly

  ctx.writeColor("MiniShell++ self-test\n", "c-green bold");       // the heading
  ctx.write("Running " + tests.length + " checks. Nothing is installed; " +
            "everything runs in this page.\n\n");                  // a short explanation

  let passed = 0, failed = 0;                                      // the running totals
  const failures = [];                                             // the details of any failures

  for (const [name, command, expected] of tests) {                 // run every test
    await ctx.checkSignals();                                      // Ctrl-C stops the test run
    let output = "";                                               // what the command printed
    try {                                                          // run it
      output = await runCaptured(shell, command);                  // collect the output
    } catch (e) {                                                  // the command itself broke
      output = "ERROR: " + (e && e.message ? e.message : e);       // treat that as the output
    }
    const clean = output.replace(/\r/g, "");                       // tidy it up a little
    const ok = expected === "" ? !clean.includes("should-not-print") // the "nothing printed" test
                               : clean.includes(expected);         // everything else
    if (ok) {                                                      // the test passed
      passed++;                                                    // count it
      ctx.writeColor("  PASS  ", "c-green bold");                  // print PASS in green
      ctx.write(name + "\n");                                      // and the test's name
    } else {                                                       // the test failed
      failed++;                                                    // count it
      failures.push([name, command, expected, clean]);             // remember the details
      ctx.writeColor("  FAIL  ", "c-red bold");                    // print FAIL in red
      ctx.write(name + "\n");                                      // and the test's name
    }
  }

  if (failures.length) {                                           // show what went wrong
    ctx.write("\n");                                               // a blank line
    ctx.writeColor("Failures\n", "c-red bold");                    // a heading
    for (const [name, command, expected, output] of failures) {    // for each failed test
      ctx.write("  " + name + "\n");                               // its name
      ctx.write("    command : " + command + "\n");                // what was run
      ctx.write("    wanted  : " + JSON.stringify(expected) + "\n"); // what we expected
      ctx.write("    got     : " + JSON.stringify(output.slice(0, 120)) + "\n"); // what we got
    }
  }

  ctx.write("\n");                                                 // a blank line before the summary
  ctx.writeColor("Passed: " + passed, "c-green bold");             // how many passed
  ctx.write("   ");                                                // a gap
  if (failed) ctx.writeColor("Failed: " + failed + "\n", "c-red bold"); // how many failed
  else ctx.write("Failed: 0\n");                                   // or none at all

  shell.fs.cwd = startDir;                                         // go back where we started
  return failed === 0 ? 0 : 1;                                     // 0 only when everything passed
});

/* =====================================================================
   SECTION 19 : STARTING EVERYTHING
   ===================================================================== */

const screen = new Screen();                                       // create the screen
const shell = new Shell(screen, fs);                               // and the shell that uses it

// Send every key press to the screen, which passes control keys to the shell.
screen.onKey = letter => shell.handleControlKey(letter);           // Ctrl-C, Ctrl-Z, Ctrl-D, Ctrl-L
screen.kb.addEventListener("keydown", event => screen.handleKey(event)); // ordinary typing
screen.kb.addEventListener("paste", event => {                     // pasting text
  event.preventDefault();                                          // do not let the browser handle it
  screen.handlePaste(event.clipboardData.getData("text"));         // insert it ourselves
});
screen.kb.addEventListener("input", () => { screen.kb.value = ""; }); // keep the hidden box empty
screen.kb.addEventListener("focus", () => screen.box.classList.remove("unfocused")); // cursor solid
screen.kb.addEventListener("blur", () => screen.box.classList.add("unfocused"));     // cursor hollow

// Clicking the terminal puts the keyboard back where it belongs.
screen.box.addEventListener("mousedown", event => {                // a click on the screen
  if (window.getSelection().toString()) return;                    // unless the user is selecting text
  setTimeout(() => screen.focus(), 0);                             // give the keyboard back
});
document.addEventListener("click", event => {                      // a click anywhere else
  if (event.target.closest(".gedit")) return;                      // a gedit window keeps the keyboard
  if (window.getSelection().toString()) return;                    // selecting text is fine
  screen.focus();                                                  // otherwise focus the terminal
});

// Save the file system when the page is closed, so nothing is lost.
window.addEventListener("beforeunload", () => fs.save());          // runs just before leaving

screen.focus();                                                    // ready for typing
shell.start();                                                     // and off we go
</script>
