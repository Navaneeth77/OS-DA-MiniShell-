// Turn one manual page into the layout `man` uses, with bold headings.
function renderManPage(ctx, command, page) {                      // the context, name and page
  const upper = command.toUpperCase();                            // the command name in capitals
  const header = padRight(upper + "(1)", 28) + padRight("User Commands", 24) + upper + "(1)";
  ctx.writeHtml(esc(header) + "\n\n", header + "\n\n");           // the line at the top

  function heading(text) {                                        // print a bold heading
    ctx.writeHtml('<span class="bold">' + esc(text) + "</span>\n", text + "\n");
  }
  function body(text) {                                           // print indented text
    for (const line of text.split("\n"))                          // every line of it
      ctx.write("       " + line + "\n");                         // man indents by seven spaces
  }

  heading("NAME");                                                // the NAME section
  body(page.name);                                                // "ls - list directory contents"
  ctx.write("\n");                                                // a blank line

  heading("SYNOPSIS");                                            // how to call the command
  ctx.writeHtml("       <span class='bold'>" + esc(command) + "</span> " +
    esc(page.synopsis.replace(command, "").trim()) + "\n\n",
    "       " + page.synopsis + "\n\n");                          // the plain version for files

  heading("DESCRIPTION");                                         // what it does
  body(page.description);                                         // the explanation
  ctx.write("\n");                                                // a blank line

  if (page.options.length) {                                      // only if there are options
    heading("OPTIONS");                                           // the OPTIONS section
    for (const [flag, meaning] of page.options) {                 // every option
      ctx.writeHtml("       <span class='bold'>" + esc(flag) + "</span>\n",
                    "       " + flag + "\n");                     // the option itself, in bold
      ctx.write("              " + meaning + "\n");               // what it means, indented more
    }
    ctx.write("\n");                                              // a blank line
  }

  if (page.examples.length) {                                     // only if there are examples
    heading("EXAMPLES");                                          // the EXAMPLES section
    for (const [example, meaning] of page.examples)               // every example
      ctx.write("       " + padRight(example, 26) + meaning + "\n"); // command, then what it does
    ctx.write("\n");                                              // a blank line
  }

  heading("SEE ALSO");                                            // where to look next
  ctx.write("       help(1) - list every command this shell knows\n\n");
  const footer = padRight("MiniShell++ 1.0", 28) + padRight("October 2026", 24) + upper + "(1)";
  ctx.writeHtml(esc(footer) + "\n", footer + "\n");               // the line at the bottom
}

defineCommand("man", "read the manual for a command", async ctx => {
  const { rest } = splitArgs(ctx.args);                           // the command asked about
  if (rest.length === 0) {                                        // no command given
    ctx.error("What manual page do you want?\nFor example, try 'man man'.\n");
    return 1;                                                     // failure
  }
  const wanted = rest[rest.length - 1];                           // the last word is the command
  const page = MAN_PAGES[wanted];                                 // look for its page
  if (!page) {                                                    // we do not have one
    if (COMMANDS[wanted] || SHELL_BUILTINS.includes(wanted)) {    // but the command does exist
      ctx.write(wanted + ": " + (COMMANDS[wanted] ? COMMANDS[wanted].help : "a shell built-in") +
                "\n\nThere is no full manual page for this command yet.\n" +
                "Type 'help' to see every command.\n");
      return 0;                                                   // not an error
    }
    ctx.error("No manual entry for " + wanted + "\n");            // no such command at all
    return 16;                                                    // the number man uses
  }
  renderManPage(ctx, wanted, page);                               // print the page
  return 0;                                                       // success
});

/* =====================================================================
   SECTION 10 : THE C COMPILER
   `gcc` has to work without any compiler on the computer, so this file
   contains a small C compiler written from scratch. It works in the three
   stages a real compiler uses:

     1. the lexer   : turns the text into tokens  (int, main, ( , ) ...)
     2. the parser  : turns the tokens into a tree that shows the structure
     3. the runner  : walks that tree and actually carries out the program

   It understands the part of C used in college exercises: variables, if,
   for, while, do-while, switch, functions, recursion, arrays, strings,
   printf and scanf.
   ===================================================================== */

/* ---------------------------------------------------------------------
   STAGE 1 : THE LEXER
   --------------------------------------------------------------------- */

const C_KEYWORDS = new Set([                                      // words C treats specially
  "auto","break","case","char","const","continue","default","do","double","else","enum",
  "extern","float","for","goto","if","inline","int","long","register","return","short",
  "signed","sizeof","static","struct","switch","typedef","union","unsigned","void","while",
]);

const C_TYPES = new Set(["int","char","float","double","void","long","short","unsigned","signed"]);

// A problem found while compiling. It remembers the line and column, like gcc.
class CompileError extends Error {                                // thrown by the lexer and parser
  constructor(message, line, col) {                               // what went wrong and where
    super(message);                                               // the message itself
    this.line = line;                                             // the line number, counting from 1
    this.col = col;                                               // the column number, counting from 1
  }
}

function tokenizeC(source) {                                      // turn C text into a list of tokens
  const tokens = [];                                              // the list we are building
  let i = 0, line = 1, col = 1;                                   // position, line and column
  const n = source.length;                                        // how long the program is

  function push(type, value, startLine, startCol) {               // remember one token
    tokens.push({ type: type, value: value, line: startLine, col: startCol });
  }
  function step(count) {                                          // move forward, counting lines
    for (let k = 0; k < count; k++) {                             // one character at a time
      if (source[i] === "\n") { line++; col = 1; }                // a new line resets the column
      else col++;                                                 // otherwise just move along
      i++;                                                        // advance through the text
    }
  }

  while (i < n) {                                                 // until the whole file is read
    const ch = source[i];                                         // the current character

    if (ch === " " || ch === "\t" || ch === "\r" || ch === "\n") { step(1); continue; } // skip spaces

    if (ch === "/" && source[i + 1] === "/") {                    // a // comment
      while (i < n && source[i] !== "\n") step(1);                // skip to the end of the line
      continue;                                                   // carry on
    }
    if (ch === "/" && source[i + 1] === "*") {                    // a /* comment */
      const startLine = line, startCol = col;                     // remember where it started
      step(2);                                                    // skip the /*
      while (i < n && !(source[i] === "*" && source[i + 1] === "/")) step(1); // find the */
      if (i >= n) throw new CompileError("unterminated comment", startLine, startCol);
      step(2);                                                    // skip the */
      continue;                                                   // carry on
    }

    if (ch === "#") {                                             // a line starting with #
      const startLine = line, startCol = col;                     // remember where it started
      let text = "";                                              // collect the whole line
      while (i < n && source[i] !== "\n") { text += source[i]; step(1); }
      push("preproc", text.trim(), startLine, startCol);          // keep it as one token
      continue;                                                   // carry on
    }

    if (ch === '"') {                                             // a "string"
      const startLine = line, startCol = col;                     // remember where it started
      step(1);                                                    // skip the opening quote
      let text = "";                                              // the characters inside
      while (i < n && source[i] !== '"') {                        // until the closing quote
        if (source[i] === "\\" && i + 1 < n) {                    // an escape such as \n
          const escape = source[i + 1];                           // the letter after the backslash
          text += escape === "n" ? "\n" : escape === "t" ? "\t"   // new line, tab
                : escape === "0" ? "\0" : escape === "\\" ? "\\"  // null, backslash
                : escape === '"' ? '"' : escape === "r" ? "\r"    // quote, carriage return
                : escape === "a" ? "\x07" : escape;               // bell, or the letter itself
          step(2);                                                // skip both characters
          continue;                                               // carry on
        }
        if (source[i] === "\n") throw new CompileError("missing terminating \" character", startLine, startCol);
        text += source[i]; step(1);                               // an ordinary character
      }
      if (i >= n) throw new CompileError("missing terminating \" character", startLine, startCol);
      step(1);                                                    // skip the closing quote
      push("string", text, startLine, startCol);                  // save the finished string
      continue;                                                   // carry on
    }

    if (ch === "'") {                                             // a 'c' character constant
      const startLine = line, startCol = col;                     // remember where it started
      step(1);                                                    // skip the opening quote
      let value;                                                  // the character's number
      if (source[i] === "\\") {                                   // an escape such as '\n'
        const escape = source[i + 1];                             // the letter after the backslash
        value = escape === "n" ? 10 : escape === "t" ? 9 : escape === "0" ? 0
              : escape === "\\" ? 92 : escape === "'" ? 39 : escape.charCodeAt(0);
        step(2);                                                  // skip both characters
      } else {                                                    // an ordinary character
        value = source.charCodeAt(i);                             // its number in the character set
        step(1);                                                  // skip it
      }
      if (source[i] !== "'") throw new CompileError("missing terminating ' character", startLine, startCol);
      step(1);                                                    // skip the closing quote
      push("char", value, startLine, startCol);                   // save it as a number
      continue;                                                   // carry on
    }

    if (/[0-9]/.test(ch)) {                                       // a number
      const startLine = line, startCol = col;                     // remember where it started
      let text = "";                                              // collect the digits
      while (i < n && /[0-9a-fA-FxX.eE+\-]/.test(source[i])) {    // digits, hex letters, dots
        if (/[+\-]/.test(source[i]) && !/[eE]/.test(text[text.length - 1])) break; // 3+4 is not one number
        text += source[i]; step(1);                               // keep the character
      }
      while (i < n && /[uUlLfF]/.test(source[i])) step(1);        // skip suffixes such as 10L
      const value = text.toLowerCase().startsWith("0x")           // hexadecimal?
        ? parseInt(text, 16) : parseFloat(text);                  // read it the right way
      if (isNaN(value)) throw new CompileError("invalid number '" + text + "'", startLine, startCol);
      push("number", value, startLine, startCol);                 // save the number
      tokens[tokens.length - 1].isFloat = /[.eE]/.test(text);     // remember if it has a decimal point
      continue;                                                   // carry on
    }

    if (/[A-Za-z_]/.test(ch)) {                                   // a name or a keyword
      const startLine = line, startCol = col;                     // remember where it started
      let text = "";                                              // collect the letters
      while (i < n && /[A-Za-z0-9_]/.test(source[i])) { text += source[i]; step(1); }
      push(C_KEYWORDS.has(text) ? "keyword" : "name", text, startLine, startCol);
      continue;                                                   // carry on
    }

    // Symbols, longest first so ">>=" is not read as ">>" and "=".
    const three = source.substr(i, 3);                            // the next three characters
    const two = source.substr(i, 2);                              // the next two characters
    const startLine = line, startCol = col;                       // remember where we are
    if (["<<=", ">>=", "..."].includes(three)) { push("op", three, startLine, startCol); step(3); continue; }
    if (["++","--","->","<=",">=","==","!=","&&","||","+=","-=","*=","/=","%=","<<",">>","&=","|=","^="]
        .includes(two)) { push("op", two, startLine, startCol); step(2); continue; }
    if ("+-*/%=<>!&|^~?:;,.()[]{}".includes(ch)) { push("op", ch, startLine, startCol); step(1); continue; }

    throw new CompileError("stray '" + ch + "' in program", line, col); // anything else is a mistake
  }
  push("eof", null, line, col);                                   // mark the end of the file
  return tokens;                                                  // hand back the token list
}

/* ---------------------------------------------------------------------
   STAGE 2 : THE PARSER
   It reads the tokens and builds a tree. Each node is a plain object with
   a `kind` saying what it is, for example:
     { kind:"if", test:..., then:..., else:... }
   --------------------------------------------------------------------- */

class Parser {                                                    // turns tokens into a tree
  constructor(tokens) {                                           // the list from the lexer
    this.tokens = tokens;                                         // keep it
    this.pos = 0;                                                 // where we are in the list
  }

  peek(offset) { return this.tokens[this.pos + (offset || 0)]; }  // look at a token without using it
  next() { return this.tokens[this.pos++]; }                      // take the next token
  atEnd() { return this.peek().type === "eof"; }                  // have we finished?

  // Is the current token this exact symbol or keyword?
  is(value) {                                                     // e.g. is("(")
    const t = this.peek();                                        // the current token
    return (t.type === "op" || t.type === "keyword") && t.value === value;
  }
  // If the current token is `value`, use it up and say so.
  accept(value) {                                                 // e.g. accept(";")
    if (this.is(value)) { this.pos++; return true; }              // used it
    return false;                                                 // it was something else
  }
  // Demand a particular token; complain in gcc's style if it is missing.
  expect(value) {                                                 // e.g. expect(";")
    if (this.accept(value)) return;                               // all good
    const t = this.peek();                                        // what we found instead
    const found = t.type === "eof" ? "end of input" : "'" + t.value + "'";
    throw new CompileError("expected '" + value + "' before " + found, t.line, t.col);
  }
  // Is the current token a type word such as int or char?
  isType() {                                                      // no arguments
    const t = this.peek();                                        // the current token
    return t.type === "keyword" && C_TYPES.has(t.value);          // only type keywords count
  }
  // Read a type, which may be several words such as "unsigned long int".
  readType() {                                                    // returns "int", "char", ...
    let type = "";                                                // build the name up
    while (this.isType()) type += (type ? " " : "") + this.next().value;
    return type;                                                  // e.g. "unsigned int"
  }

  /* ----- the whole file ----- */
  parseProgram() {                                                // the top level of a C file
    const functions = [];                                         // every function we find
    const globals = [];                                           // variables outside any function
    while (!this.atEnd()) {                                       // until the file is finished
      if (this.peek().type === "preproc") { this.next(); continue; } // ignore #include and #define
      if (this.accept(";")) continue;                             // a stray semicolon is harmless
      if (!this.isType()) {                                       // everything here must start with a type
        const t = this.peek();                                    // what we found
        throw new CompileError("expected a type name before '" + t.value + "'", t.line, t.col);
      }
      const type = this.readType();                               // int, char, void ...
      let stars = 0;                                              // count any * for pointers
      while (this.accept("*")) stars++;                           // char *name
      const nameToken = this.peek();                              // the name that follows
      if (nameToken.type !== "name")                              // it must be a name
        throw new CompileError("expected a name before '" + nameToken.value + "'",
                               nameToken.line, nameToken.col);
      const name = this.next().value;                             // take the name

      if (this.is("(")) {                                         // a "(" means this is a function
        functions.push(this.parseFunction(type, name, nameToken));
      } else {                                                    // otherwise it is a global variable
        globals.push(...this.parseVarDeclaration(type, name, stars, nameToken));
      }
    }
    return { kind: "program", functions: functions, globals: globals };
  }

  /* ----- one function ----- */
  parseFunction(returnType, name, token) {                        // type, name and where it started
    this.expect("(");                                             // the opening bracket
    const params = [];                                            // the list of parameters
    if (!this.is(")")) {                                          // unless there are none
      do {                                                        // read them one at a time
        if (this.is("void") && this.peek(1).value === ")") { this.next(); break; } // "(void)"
        const paramType = this.readType();                        // its type
        let stars = 0;                                            // pointer stars
        while (this.accept("*")) stars++;                         // char *text
        const paramName = this.peek().type === "name" ? this.next().value : "_unnamed";
        let isArray = false;                                      // is it written as an array?
        if (this.accept("[")) { isArray = true; while (!this.accept("]")) this.next(); }
        params.push({ type: paramType, name: paramName, pointer: stars > 0 || isArray });
      } while (this.accept(","));                                 // commas separate parameters
    }
    this.expect(")");                                             // the closing bracket
    if (this.accept(";"))                                         // just a declaration, no body
      return { kind: "function", name: name, returnType: returnType, params: params,
               body: null, line: token.line };
    const body = this.parseBlock();                               // the { ... } with the code
    return { kind: "function", name: name, returnType: returnType, params: params,
             body: body, line: token.line };
  }

  /* ----- one or more variables on a single line ----- */
  parseVarDeclaration(type, firstName, stars, token) {            // "int a = 1, b[10];"
    const declarations = [];                                      // one entry per variable
    let name = firstName;                                         // start with the first name
    for (;;) {                                                    // keep going while there are commas
      const dims = [];                                            // array sizes, if any
      while (this.accept("[")) {                                  // "[10]" or "[3][4]"
        if (this.is("]")) dims.push(null);                        // "[]" means "work it out"
        else dims.push(this.parseExpression());                   // otherwise read the size
        this.expect("]");                                         // the closing bracket
      }
      let init = null;                                            // the "= value" part
      if (this.accept("=")) {                                     // there is one
        if (this.is("{")) init = this.parseInitializerList();     // "= {1, 2, 3}"
        else init = this.parseAssignment();                       // "= 5" or "= a + b"
      }
      declarations.push({ kind: "declare", type: type, name: name, pointer: stars > 0,
                          dims: dims, init: init, line: token.line });
      if (!this.accept(",")) break;                               // no comma: the line is finished
      stars = 0;                                                  // each name has its own stars
      while (this.accept("*")) stars++;                           // "int *a, *b;"
      const nameToken = this.peek();                              // the next name
      if (nameToken.type !== "name")
        throw new CompileError("expected a name before '" + nameToken.value + "'",
                               nameToken.line, nameToken.col);
      name = this.next().value;                                   // take it and loop again
    }
    this.expect(";");                                             // every declaration ends with ;
    return declarations;                                          // hand back the list
  }

  parseInitializerList() {                                        // "{1, 2, 3}" or "{{1,2},{3,4}}"
    this.expect("{");                                             // the opening brace
    const items = [];                                             // the values inside
    if (!this.is("}")) {                                          // unless it is empty
      do {                                                        // read the values
        if (this.is("}")) break;                                  // a trailing comma is allowed
        items.push(this.is("{") ? this.parseInitializerList() : this.parseAssignment());
      } while (this.accept(","));                                 // commas separate them
    }
    this.expect("}");                                             // the closing brace
    return { kind: "initlist", items: items };                    // hand back the list
  }

  /* ----- a block of statements in { } ----- */
  parseBlock() {                                                  // "{ ...statements... }"
    this.expect("{");                                             // the opening brace
    const statements = [];                                        // everything inside
    while (!this.is("}") && !this.atEnd()) statements.push(this.parseStatement()); // read them all
    this.expect("}");                                             // the closing brace
    return { kind: "block", body: statements };                   // hand back the block
  }

  /* ----- one statement ----- */
  parseStatement() {                                              // works out which kind it is
    const token = this.peek();                                    // the first token of the statement

    if (this.is("{")) return this.parseBlock();                   // a nested block
    if (this.accept(";")) return { kind: "empty" };               // an empty statement

    if (this.isType()) {                                          // a variable declaration
      const type = this.readType();                               // its type
      let stars = 0;                                              // pointer stars
      while (this.accept("*")) stars++;                           // "int *p;"
      const nameToken = this.peek();                              // the name
      if (nameToken.type !== "name")
        throw new CompileError("expected a name before '" + nameToken.value + "'",
                               nameToken.line, nameToken.col);
      const name = this.next().value;                             // take it
      const declarations = this.parseVarDeclaration(type, name, stars, nameToken);
      return { kind: "declarations", list: declarations, line: token.line };
    }

    if (this.accept("if")) {                                      // if (test) ... else ...
      this.expect("(");                                           // the opening bracket
      const test = this.parseExpression();                        // the condition
      this.expect(")");                                           // the closing bracket
      const thenPart = this.parseStatement();                     // what to do when it is true
      let elsePart = null;                                        // what to do when it is false
      if (this.accept("else")) elsePart = this.parseStatement();  // only if "else" is there
      return { kind: "if", test: test, then: thenPart, else: elsePart, line: token.line };
    }

    if (this.accept("while")) {                                   // while (test) ...
      this.expect("(");                                           // the opening bracket
      const test = this.parseExpression();                        // the condition
      this.expect(")");                                           // the closing bracket
      return { kind: "while", test: test, body: this.parseStatement(), line: token.line };
    }

    if (this.accept("do")) {                                      // do ... while (test);
      const body = this.parseStatement();                         // the body comes first
      if (!this.accept("while")) {                                // "while" must follow
        const t = this.peek();                                    // what we found instead
        throw new CompileError("expected 'while' before '" + t.value + "'", t.line, t.col);
      }
      this.expect("(");                                           // the opening bracket
      const test = this.parseExpression();                        // the condition
      this.expect(")");                                           // the closing bracket
      this.expect(";");                                           // and a semicolon
      return { kind: "dowhile", test: test, body: body, line: token.line };
    }

    if (this.accept("for")) {                                     // for (start; test; step) ...
      this.expect("(");                                           // the opening bracket
      let init = null;                                            // the first part
      if (!this.is(";")) {                                        // unless it is empty
        if (this.isType()) {                                      // "for (int i = 0; ...)"
          const type = this.readType();                           // the type
          const nameToken = this.peek();                          // the name
          const name = this.next().value;                         // take it
          init = { kind: "declarations", list: this.parseVarDeclaration(type, name, 0, nameToken) };
        } else {                                                  // "for (i = 0; ...)"
          init = { kind: "expr", expr: this.parseExpression() };  // an ordinary expression
          this.expect(";");                                       // which still needs a semicolon
        }
      } else this.expect(";");                                    // an empty first part
      const test = this.is(";") ? null : this.parseExpression();  // the condition
      this.expect(";");                                           // the second semicolon
      const step = this.is(")") ? null : this.parseExpression();  // what to do after each round
      this.expect(")");                                           // the closing bracket
      return { kind: "for", init: init, test: test, step: step,
               body: this.parseStatement(), line: token.line };
    }

    if (this.accept("switch")) {                                  // switch (value) { case ... }
      this.expect("(");                                           // the opening bracket
      const value = this.parseExpression();                       // the value to compare
      this.expect(")");                                           // the closing bracket
      this.expect("{");                                           // the opening brace
      const cases = [];                                           // every case in the switch
      while (!this.is("}") && !this.atEnd()) {                    // until the closing brace
        if (this.accept("case")) {                                // "case 1:"
          const match = this.parseExpression();                   // the value to match
          this.expect(":");                                       // the colon
          cases.push({ test: match, body: [] });                  // start collecting statements
        } else if (this.accept("default")) {                      // "default:"
          this.expect(":");                                       // the colon
          cases.push({ test: null, body: [] });                   // null means "anything else"
        } else {                                                  // an ordinary statement
          if (cases.length === 0) {                               // before any case label
            const t = this.peek();                                // where we are
            throw new CompileError("statement before the first 'case'", t.line, t.col);
          }
          cases[cases.length - 1].body.push(this.parseStatement()); // add it to the current case
        }
      }
      this.expect("}");                                           // the closing brace
      return { kind: "switch", value: value, cases: cases, line: token.line };
    }

    if (this.accept("return")) {                                  // return, or return value;
      const value = this.is(";") ? null : this.parseExpression(); // the value, if there is one
      this.expect(";");                                           // the semicolon
      return { kind: "return", value: value, line: token.line };
    }
    if (this.accept("break")) { this.expect(";"); return { kind: "break", line: token.line }; }
    if (this.accept("continue")) { this.expect(";"); return { kind: "continue", line: token.line }; }

    const expr = this.parseExpression();                          // anything else is an expression
    this.expect(";");                                             // which ends with a semicolon
    return { kind: "expr", expr: expr, line: token.line };
  }

  /* ----- expressions, from the loosest to the tightest ----- */

  parseExpression() {                                             // handles the comma operator
    let left = this.parseAssignment();                            // read the first part
    while (this.accept(","))                                      // "a = 1, b = 2"
      left = { kind: "comma", left: left, right: this.parseAssignment() };
    return left;                                                  // the finished expression
  }

  parseAssignment() {                                             // "a = b", "a += b"
    const left = this.parseTernary();                             // read the left side
    const operators = ["=", "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "<<=", ">>="];
    const token = this.peek();                                    // the next token
    if (token.type === "op" && operators.includes(token.value)) { // is it an assignment?
      this.next();                                                // use up the symbol
      const right = this.parseAssignment();                       // the right side, read the same way
      return { kind: "assign", op: token.value, target: left, value: right, line: token.line };
    }
    return left;                                                  // no assignment here
  }

  parseTernary() {                                                // "test ? a : b"
    const test = this.parseBinary(0);                             // read the condition
    if (!this.accept("?")) return test;                           // no question mark: nothing to do
    const whenTrue = this.parseAssignment();                      // the value when it is true
    this.expect(":");                                             // the colon
    const whenFalse = this.parseAssignment();                     // the value when it is false
    return { kind: "ternary", test: test, then: whenTrue, else: whenFalse };
  }

  // The order of the operators: things lower down bind more tightly.
  static get LEVELS() {                                           // each row is one level
    return [["||"], ["&&"], ["|"], ["^"], ["&"], ["==", "!="],
            ["<", ">", "<=", ">="], ["<<", ">>"], ["+", "-"], ["*", "/", "%"]];
  }

  parseBinary(level) {                                            // read one level of operators
    const levels = Parser.LEVELS;                                 // the table above
    if (level >= levels.length) return this.parseUnary();         // past the end: read a single value
    let left = this.parseBinary(level + 1);                       // read the tighter part first
    for (;;) {                                                    // then look for operators here
      const token = this.peek();                                  // the next token
      if (token.type !== "op" || !levels[level].includes(token.value)) return left; // not ours
      this.next();                                                // use up the operator
      const right = this.parseBinary(level + 1);                  // read the right side
      left = { kind: "binary", op: token.value, left: left, right: right, line: token.line };
    }
  }

  parseUnary() {                                                  // "-a", "!a", "++a", "sizeof(int)"
    const token = this.peek();                                    // the next token
    if (token.type === "op" && ["-", "+", "!", "~", "*", "&", "++", "--"].includes(token.value)) {
      this.next();                                                // use up the symbol
      const operand = this.parseUnary();                          // what it applies to
      if (token.value === "++" || token.value === "--")           // ++a changes a, then uses it
        return { kind: "preincr", op: token.value, target: operand, line: token.line };
      if (token.value === "&") return { kind: "addressof", target: operand, line: token.line };
      if (token.value === "*") return { kind: "deref", target: operand, line: token.line };
      return { kind: "unary", op: token.value, operand: operand, line: token.line };
    }
    if (this.is("sizeof")) {                                      // "sizeof(int)" or "sizeof x"
      this.next();                                                // use up the word
      if (this.accept("(")) {                                     // the bracket form
        if (this.isType()) {                                      // "sizeof(int)"
          const type = this.readType();                           // read the type
          while (this.accept("*")) {}                             // ignore any stars
          this.expect(")");                                       // the closing bracket
          return { kind: "sizeoftype", type: type };              // a fixed number
        }
        const inner = this.parseExpression();                     // "sizeof(x)"
        this.expect(")");                                         // the closing bracket
        return { kind: "sizeofexpr", expr: inner };               // work it out later
      }
      return { kind: "sizeofexpr", expr: this.parseUnary() };     // "sizeof x"
    }
    return this.parsePostfix();                                   // nothing special here
  }

  parsePostfix() {                                                // "a[i]", "f(x)", "a++"
    let node = this.parsePrimary();                               // start with a single value
    for (;;) {                                                    // then look for what follows it
      if (this.accept("[")) {                                     // an array index
        const index = this.parseExpression();                     // the number inside the brackets
        this.expect("]");                                         // the closing bracket
        node = { kind: "index", target: node, index: index };     // "a[i]"
        continue;                                                 // there may be another: "a[i][j]"
      }
      if (this.is("(") && (node.kind === "name")) {               // a function call
        this.next();                                              // use up the "("
        const args = [];                                          // the values passed in
        if (!this.is(")")) {                                      // unless there are none
          do { args.push(this.parseAssignment()); } while (this.accept(",")); // read them
        }
        this.expect(")");                                         // the closing bracket
        node = { kind: "call", name: node.name, args: args, line: node.line };
        continue;                                                 // carry on
      }
      const token = this.peek();                                  // the next token
      if (token.type === "op" && (token.value === "++" || token.value === "--")) {
        this.next();                                              // use up the symbol
        node = { kind: "postincr", op: token.value, target: node, line: token.line };
        continue;                                                 // carry on
      }
      return node;                                                // nothing more follows
    }
  }

  parsePrimary() {                                                // the smallest pieces
    const token = this.next();                                    // take the token
    if (token.type === "number") return { kind: "number", value: token.value, isFloat: token.isFloat };
    if (token.type === "string") return { kind: "string", value: token.value };
    if (token.type === "char") return { kind: "number", value: token.value, isChar: true };
    if (token.type === "name") return { kind: "name", name: token.value, line: token.line };
    if (token.type === "op" && token.value === "(") {             // a bracketed expression
      if (this.isType()) {                                        // a cast such as "(int)x"
        const type = this.readType();                             // the type inside the brackets
        while (this.accept("*")) {}                               // ignore any stars
        this.expect(")");                                         // the closing bracket
        return { kind: "cast", type: type, expr: this.parseUnary() };
      }
      const inner = this.parseExpression();                       // the expression inside
      this.expect(")");                                           // the closing bracket
      return inner;                                               // brackets only group things
    }
    const what = token.type === "eof" ? "end of input" : "'" + token.value + "'";
    throw new CompileError("expected an expression before " + what, token.line, token.col);
  }
}

/* ---------------------------------------------------------------------
   STAGE 3 : RUNNING THE PROGRAM
   --------------------------------------------------------------------- */

// Used inside the runner to jump out of loops and functions.
class BreakSignal {}                                              // thrown by "break"
class ContinueSignal {}                                           // thrown by "continue"
class ReturnSignal { constructor(value) { this.value = value; } } // thrown by "return"
class RuntimeErrorC extends Error {}                              // a mistake while running

// An array in C: a list of values plus the shape it was declared with.
class CArray {                                                    // "int a[10]" or "char name[20]"
  constructor(elemType, dims) {                                   // the element type and the sizes
    this.elemType = elemType;                                     // "int", "char", "float" ...
    this.dims = dims;                                             // e.g. [10] or [3, 4]
    this.length = dims.reduce((a, b) => a * b, 1);                // how many values in total
    this.data = new Array(this.length).fill(0);                   // C does not clear memory, but 0 is safer
  }
  flatIndex(indexes) {                                            // turn [row, col] into one number
    let flat = 0;                                                 // the running position
    for (let i = 0; i < indexes.length; i++) {                    // for each index given
      flat = flat * this.dims[i] + indexes[i];                    // the usual row-by-row layout
    }
    return flat;                                                  // the position in this.data
  }
  toString() {                                                    // read a char array as text
    let text = "";                                                // build it up
    for (const code of this.data) {                               // walk through the numbers
      if (code === 0) break;                                      // C strings stop at a zero
      text += String.fromCharCode(code);                          // turn the number into a letter
    }
    return text;                                                  // the finished text
  }
  setString(text) {                                               // write text into a char array
    for (let i = 0; i < this.length; i++)                         // fill every slot
      this.data[i] = i < text.length ? text.charCodeAt(i) : 0;    // letters, then zeros
  }
}

// One level of variables (the whole function, or one { } block).
class Scope {                                                     // a place where variables live
  constructor(parent) {                                           // the scope around this one
    this.vars = new Map();                                        // name -> { type, value }
    this.parent = parent || null;                                 // null for the outermost scope
  }
  declare(name, slot) { this.vars.set(name, slot); }              // create a new variable here
  find(name) {                                                    // look a name up, searching outwards
    let scope = this;                                             // start here
    while (scope) {                                               // keep going out
      if (scope.vars.has(name)) return scope.vars.get(name);      // found it
      scope = scope.parent;                                       // try the scope around this one
    }
    return null;                                                  // the name does not exist
  }
}

class CProgram {                                                  // one compiled program, ready to run
  constructor(tree, source, fileName) {                           // the tree, its text and its name
    this.tree = tree;                                             // the parsed program
    this.source = source;                                         // kept so gcc -Wall can quote lines
    this.fileName = fileName;                                     // e.g. "hello.c"
    this.functions = new Map();                                   // every function, by name
    for (const fn of tree.functions)                              // fill that list in
      if (fn.body) this.functions.set(fn.name, fn);               // only ones with a body
  }

  // Run the program. `ctx` is how it prints and reads; `args` are the words on the command line.
  async run(ctx, args) {                                          // returns the exit number
    this.ctx = ctx;                                               // remember how to print
    this.globals = new Scope(null);                               // the outermost set of variables
    this.steps = 0;                                               // how many statements we have run
    this.outputBuffer = "";                                       // printf output waiting to be shown

    for (const declaration of this.tree.globals)                  // set up the global variables
      await this.runDeclaration(declaration, this.globals);       // one at a time

    const main = this.functions.get("main");                      // find main()
    if (!main) throw new RuntimeErrorC("undefined reference to `main'"); // a program needs one

    let result;                                                   // what main() returns
    try {                                                         // run it
      result = await this.callFunction(main, args.map(a => a));   // pass the command-line words
    } catch (e) {                                                 // something went wrong
      if (e instanceof ReturnSignal) result = e.value;            // a bare "return" at the top
      else { await this.flush(); throw e; }                       // anything else: show output, then report
    }
    await this.flush();                                           // print anything still waiting
    return typeof result === "number" ? (result | 0) & 0xff : 0;  // exit numbers are 0..255
  }

  flush() {                                                       // send collected printf text to the screen
    if (this.outputBuffer === "") return Promise.resolve();       // nothing waiting
    this.ctx.write(this.outputBuffer);                            // print it
    this.outputBuffer = "";                                       // and clear the buffer
    return Promise.resolve();                                     // so callers can await it
  }

  print(text) { this.outputBuffer += text; }                      // printf writes here first

  // Called between statements: lets Ctrl-C and Ctrl-Z work inside long loops.
  async tick() {                                                  // no arguments
    this.steps++;                                                 // count this statement
    if (this.steps % 200 !== 0) return;                           // only check now and then
    await this.flush();                                           // show output so far
    await this.ctx.checkSignals();                                // react to Ctrl-C / Ctrl-Z
    await wait(0);                                                // let the browser redraw
  }

  /* ----- calling a function ----- */
  async callFunction(fn, args) {                                  // the function and its arguments
    const scope = new Scope(this.globals);                        // a fresh set of variables
    fn.params.forEach((param, i) => {                             // give each parameter its value
      const value = i < args.length ? args[i] : 0;                // missing arguments become 0
      scope.declare(param.name, { type: param.type, value: value, pointer: param.pointer });
    });
    try {                                                         // run the body
      await this.runStatement(fn.body, scope);                    // the { ... } block
    } catch (e) {                                                 // "return" lands here
      if (e instanceof ReturnSignal) return e.value;              // hand back the value
      throw e;                                                    // anything else keeps going up
    }
    return 0;                                                     // falling off the end returns 0
  }

  /* ----- statements ----- */
  async runStatement(node, scope) {                               // carry out one statement
    await this.tick();                                            // keep the page responsive
    switch (node.kind) {                                          // what kind of statement is it?

      case "block": {                                             // { ... }
        const inner = new Scope(scope);                           // variables declared here are local
        for (const statement of node.body) await this.runStatement(statement, inner);
        return;                                                   // the block is finished
      }

      case "declarations":                                        // "int a = 1, b;"
        for (const declaration of node.list) await this.runDeclaration(declaration, scope);
        return;                                                   // all declared

      case "expr":                                                // "a = b + 1;" or "printf(...);"
        await this.evaluate(node.expr, scope);                    // work it out and throw the value away
        return;                                                   // done

      case "if":                                                  // if (test) ... else ...
        if (truthy(await this.evaluate(node.test, scope)))        // is the condition true?
          await this.runStatement(node.then, scope);              // yes: run this part
        else if (node.else)                                       // no, and there is an else
          await this.runStatement(node.else, scope);              // run that instead
        return;                                                   // done

      case "while":                                               // while (test) ...
        while (truthy(await this.evaluate(node.test, scope))) {   // while the condition holds
          try { await this.runStatement(node.body, scope); }      // run the body
          catch (e) {                                             // break and continue land here
            if (e instanceof BreakSignal) break;                  // "break" leaves the loop
            if (e instanceof ContinueSignal) continue;            // "continue" starts the next round
            throw e;                                              // anything else keeps going up
          }
        }
        return;                                                   // the loop is finished

      case "dowhile":                                             // do ... while (test);
        do {                                                      // the body runs at least once
          try { await this.runStatement(node.body, scope); }      // run the body
          catch (e) {                                             // break and continue land here
            if (e instanceof BreakSignal) break;                  // leave the loop
            if (e instanceof ContinueSignal) continue;            // next round
            throw e;                                              // anything else keeps going up
          }
        } while (truthy(await this.evaluate(node.test, scope)));  // then test the condition
        return;                                                   // the loop is finished

      case "for": {                                               // for (init; test; step) ...
        const loopScope = new Scope(scope);                       // "int i" belongs to the loop
        if (node.init) await this.runStatement(node.init, loopScope); // the first part
        for (;;) {                                                // then loop
          if (node.test && !truthy(await this.evaluate(node.test, loopScope))) break; // check
          try { await this.runStatement(node.body, loopScope); }  // run the body
          catch (e) {                                             // break and continue land here
            if (e instanceof BreakSignal) break;                  // leave the loop
            if (!(e instanceof ContinueSignal)) throw e;          // anything else keeps going up
          }
          if (node.step) await this.evaluate(node.step, loopScope); // "i++" after each round
        }
        return;                                                   // the loop is finished
      }

      case "switch": {                                            // switch (value) { case ... }
        const value = await this.evaluate(node.value, scope);     // the value to compare
        const inner = new Scope(scope);                           // variables inside the switch
        let start = node.cases.findIndex(async c => false);       // placeholder, replaced below
        start = -1;                                               // where to begin running
        for (let i = 0; i < node.cases.length; i++) {             // look for a matching case
          if (node.cases[i].test === null) continue;              // skip "default" for now
          if (await this.evaluate(node.cases[i].test, inner) === value) { start = i; break; }
        }
        if (start === -1)                                         // nothing matched
          start = node.cases.findIndex(c => c.test === null);     // use "default", if there is one
        if (start === -1) return;                                 // nothing to run at all
        try {                                                     // run from there onwards
          for (let i = start; i < node.cases.length; i++)         // C falls through without "break"
            for (const statement of node.cases[i].body)           // every statement in the case
              await this.runStatement(statement, inner);          // run it
        } catch (e) {                                             // "break" lands here
          if (!(e instanceof BreakSignal)) throw e;               // anything else keeps going up
        }
        return;                                                   // the switch is finished
      }

      case "return":                                              // return value;
        throw new ReturnSignal(node.value ? await this.evaluate(node.value, scope) : 0);
      case "break": throw new BreakSignal();                      // leave the nearest loop
      case "continue": throw new ContinueSignal();                // start the next round
      case "empty": return;                                       // ";" on its own does nothing
      default:                                                    // should never happen
        throw new RuntimeErrorC("cannot run statement of kind " + node.kind);
    }
  }

  /* ----- creating a variable ----- */
  async runDeclaration(node, scope) {                             // "int a = 5;" or "int a[10];"
    if (node.dims.length > 0) {                                   // it is an array
      const sizes = [];                                           // the size of each dimension
      for (let i = 0; i < node.dims.length; i++) {                // work each one out
        if (node.dims[i] === null) {                              // "[]" with a list after the "="
          const list = node.init && node.init.kind === "initlist" ? node.init.items.length : 0;
          const text = node.init && node.init.kind === "string" ? node.init.value.length + 1 : 0;
          sizes.push(Math.max(list, text, 1));                    // big enough for what is given
        } else {                                                  // an ordinary size
          sizes.push(await this.evaluate(node.dims[i], scope) | 0); // work out the number
        }
      }
      const array = new CArray(node.type, sizes);                 // make the array
      if (node.init) await this.fillArray(array, node.init, scope, 0); // fill it in if asked
      scope.declare(node.name, { type: node.type, value: array, isArray: true });
      return;                                                     // done
    }
    let value = 0;                                                // plain variables start at 0 here
    if (node.init) value = await this.evaluate(node.init, scope); // unless a value was given
    if (node.type === "char" && typeof value === "string") value = value.charCodeAt(0) || 0;
    if (isIntType(node.type) && typeof value === "number" && !node.pointer) value = Math.trunc(value);
    scope.declare(node.name, { type: node.type, value: value, pointer: node.pointer });
  }

  // Put starting values into an array, from "{1,2,3}" or from "hello".
  async fillArray(array, init, scope, offset) {                   // the array and the values
    if (init.kind === "string") {                                 // char name[] = "hello";
      array.setString(init.value);                                // copy the letters in
      return;                                                     // done
    }
    if (init.kind !== "initlist") {                               // a single value
      array.data[offset] = await this.evaluate(init, scope);      // put it in the first slot
      return;                                                     // done
    }
    let position = offset;                                        // where the next value goes
    for (const item of init.items) {                              // for every value in the list
      if (item.kind === "initlist") {                             // a nested list, for 2D arrays
        const rowLength = array.dims.length > 1 ? array.dims[1] : 1; // how long each row is
        await this.fillArray(array, item, scope, position);       // fill that row
        position += rowLength;                                    // jump to the next row
      } else {                                                    // an ordinary value
        const value = await this.evaluate(item, scope);           // work it out
        array.data[position++] = typeof value === "string" ? value.charCodeAt(0) : value;
      }
    }
  }
}

/* A value that C treats as a float or double.
   C divides two whole numbers differently from two decimal numbers:
   7 / 2 is 3, but 7.0 / 2 is 3.5. The runner therefore has to remember
   which values came from float or double variables, and this little
   wrapper is how it does that. */
class CFloat {                                                    // a number that keeps its decimals
  constructor(value) { this.value = value; }                      // store the plain number inside
  valueOf() { return this.value; }                                // so JavaScript maths still works
}
function isFloatType(type) {                                      // is this a decimal type?
  return /float|double/.test(type);                               // "float" and "double" are
}
function isFloatValue(value) {                                    // does this value keep its decimals?
  if (value instanceof CFloat) return true;                       // it was marked as one
  return typeof value === "number" && !Number.isInteger(value);   // or it simply has decimals
}
function wrapIfFloat(type, value) {                               // mark a value when its type is float
  return isFloatType(type) && typeof value === "number" ? new CFloat(value) : value;
}

// In C, zero is false and everything else is true.
function truthy(value) {                                          // the value to test
  if (typeof value === "string") return value.length > 0;         // a string is true when not empty
  return value !== 0 && value !== false && value !== null && value !== undefined;
}
// Is this one of the whole-number types?
function isIntType(type) {                                        // "int", "char", "long" ...
  return /int|char|short|long|unsigned|signed/.test(type) && !/float|double/.test(type);
}

/* =====================================================================
   SECTION 11 : WORKING OUT THE VALUE OF AN EXPRESSION
   These functions are added to CProgram. They handle a + b, f(x), a[i],
   a = b and everything else that produces a value.
   ===================================================================== */

// Find where a value is stored, so we can change it later (used by "=" and "++").
CProgram.prototype.resolvePlace = async function (node, scope) {  // node = where to store, scope = variables
  if (node.kind === "name") {                                     // a plain variable, such as "count"
    const slot = scope.find(node.name);                           // look the name up
    if (!slot) throw new RuntimeErrorC("'" + node.name + "' undeclared"); // it does not exist
    return {                                                      // how to read and write it
      get: () => slot.value,                                      // read the value
      set: v => {                                                 // store a new value
        const plain = v instanceof CFloat ? v.value : v;           // take the number out of the wrapper
        slot.value = isIntType(slot.type) && typeof plain === "number" && !slot.pointer
          ? Math.trunc(plain) : plain;                             // whole-number types drop the decimals
      },
      slot: slot,                                                 // the variable itself
    };
  }

  if (node.kind === "index") {                                    // an array slot, such as "a[i]"
    const indexes = [];                                           // the numbers inside the brackets
    let target = node;                                            // start at the outermost index
    while (target.kind === "index") {                             // "a[i][j]" has two of them
      indexes.unshift(await this.evaluate(target.index, scope));  // work out the number
      target = target.target;                                     // step inwards
    }
    const base = await this.evaluate(target, scope);              // the array itself
    if (!(base instanceof CArray))                                // it was not an array
      throw new RuntimeErrorC("subscripted value is not an array");
    const flat = base.flatIndex(indexes.map(x => x | 0));         // turn [i][j] into one position
    if (flat < 0 || flat >= base.length)                          // outside the array
      throw new RuntimeErrorC("array index " + flat + " is out of bounds for an array of size " + base.length);
    return {                                                      // how to read and write that slot
      get: () => base.data[flat],                                 // read it
      set: v => { base.data[flat] = typeof v === "string" ? v.charCodeAt(0) : Math.trunc(v); },
      slot: { type: base.elemType },                              // the element type, for printf
    };
  }

  if (node.kind === "deref") {                                    // "*p", following a pointer
    const pointer = await this.evaluate(node.target, scope);      // what the pointer holds
    if (pointer && pointer.get) return pointer;                   // it is already a place
    if (pointer instanceof CArray)                                // a pointer to the start of an array
      return { get: () => pointer.data[0], set: v => { pointer.data[0] = v; }, slot: {} };
    throw new RuntimeErrorC("invalid use of '*'");                // anything else is wrong
  }

  throw new RuntimeErrorC("expression is not assignable");        // you cannot write into 2 + 2
};

// Work out the value of any expression.
CProgram.prototype.evaluate = async function (node, scope) {      // the tree node and the variables
  switch (node.kind) {                                            // what kind of expression is it?

    case "number":                                                // a plain number such as 42 or 3.5
      return node.isFloat ? new CFloat(node.value) : node.value;  // "3.5" keeps its decimals
    case "string": return node.value;                             // a piece of text in quotes

    case "name": {                                                // a variable's value
      const slot = scope.find(node.name);                         // look it up
      if (!slot) throw new RuntimeErrorC("'" + node.name + "' undeclared (first use in this function)");
      return wrapIfFloat(slot.type, slot.value);                  // float variables keep their decimals
    }

    case "assign": {                                              // "a = b" and "a += b"
      const place = await this.resolvePlace(node.target, scope);  // where to store the result
      let value = await this.evaluate(node.value, scope);         // the value on the right
      if (node.op !== "=") {                                      // "+=" and friends
        const current = place.get();                              // what is stored now
        const operator = node.op.slice(0, -1);                    // "+=" becomes "+"
        value = applyBinary(operator, current, value);            // do the sum
      }
      if (value instanceof CArray && place.slot && place.slot.type === "char" && !place.slot.isArray)
        value = value.data[0];                                    // assigning an array to a char
      if (typeof value === "string" && place.slot && place.slot.isArray)
        { place.slot.value.setString(value); return value; }      // "strcpy-like" assignment
      place.set(value);                                           // store it
      return place.get();                                         // an assignment also has a value
    }

    case "binary": {                                              // "a + b", "a < b", "a && b"
      if (node.op === "&&") {                                     // && stops early when the left is false
        const left = await this.evaluate(node.left, scope);       // work out the left side
        if (!truthy(left)) return 0;                              // false: the answer is already 0
        return truthy(await this.evaluate(node.right, scope)) ? 1 : 0; // otherwise test the right
      }
      if (node.op === "||") {                                     // || stops early when the left is true
        const left = await this.evaluate(node.left, scope);       // work out the left side
        if (truthy(left)) return 1;                               // true: the answer is already 1
        return truthy(await this.evaluate(node.right, scope)) ? 1 : 0; // otherwise test the right
      }
      const left = await this.evaluate(node.left, scope);         // the left side
      const right = await this.evaluate(node.right, scope);       // the right side
      return applyBinary(node.op, left, right);                   // do the sum
    }

    case "unary": {                                               // "-a", "!a", "~a"
      const value = await this.evaluate(node.operand, scope);     // the value it applies to
      if (node.op === "-") return -toNumber(value);               // minus turns the sign around
      if (node.op === "+") return toNumber(value);                // plus changes nothing
      if (node.op === "!") return truthy(value) ? 0 : 1;          // not: true becomes 0, false becomes 1
      if (node.op === "~") return ~toNumber(value);               // flip every bit
      throw new RuntimeErrorC("unknown operator " + node.op);     // should never happen
    }

    case "preincr": {                                             // "++i" : change first, then use
      const place = await this.resolvePlace(node.target, scope);  // where the variable lives
      const updated = toNumber(place.get()) + (node.op === "++" ? 1 : -1); // the new value
      place.set(updated);                                         // store it
      return updated;                                             // and hand it back
    }

    case "postincr": {                                            // "i++" : use first, then change
      const place = await this.resolvePlace(node.target, scope);  // where the variable lives
      const before = toNumber(place.get());                       // the value as it is now
      place.set(before + (node.op === "++" ? 1 : -1));            // store the new value
      return before;                                              // but hand back the old one
    }

    case "ternary":                                               // "test ? a : b"
      return truthy(await this.evaluate(node.test, scope))        // check the condition
        ? await this.evaluate(node.then, scope)                   // true: the middle part
        : await this.evaluate(node.else, scope);                  // false: the last part

    case "comma":                                                 // "a, b" : do both, keep the last
      await this.evaluate(node.left, scope);                      // the left side, for its effect
      return await this.evaluate(node.right, scope);              // the right side gives the value

    case "index": {                                               // reading "a[i]"
      const place = await this.resolvePlace(node, scope);         // find the slot
      return place.get();                                         // and read it
    }

    case "addressof": {                                           // "&n", used by scanf
      const place = await this.resolvePlace(node.target, scope);  // find where it lives
      return place;                                               // the place itself is the "address"
    }

    case "deref": {                                               // "*p"
      const place = await this.resolvePlace(node, scope);         // find what it points at
      return place.get();                                         // and read it
    }

    case "cast": {                                                // "(int)x"
      const value = await this.evaluate(node.expr, scope);        // the value being changed
      if (isIntType(node.type)) return Math.trunc(toNumber(value)); // whole-number types drop decimals
      return new CFloat(toNumber(value));                         // "(float) x" keeps the decimals
    }

    case "sizeoftype":                                            // "sizeof(int)"
      return node.type === "char" ? 1 : node.type === "double" ? 8 // the usual sizes on a 64-bit machine
           : node.type === "float" ? 4 : node.type.includes("long") ? 8 : 4;

    case "sizeofexpr": {                                          // "sizeof(x)"
      const value = await this.evaluate(node.expr, scope);        // what x is
      if (value instanceof CArray)                                // an array: size times element size
        return value.length * (value.elemType === "char" ? 1 : value.elemType === "double" ? 8 : 4);
      if (typeof value === "string") return value.length + 1;     // a string, plus its ending zero
      return 4;                                                   // an ordinary int
    }

    case "call":                                                  // "f(x)" or "printf(...)"
      return await this.callByName(node, scope);                  // handled in the next function

    case "initlist":                                              // "{1,2,3}" outside a declaration
      throw new RuntimeErrorC("unexpected initializer list");     // C does not allow that

    default:                                                      // should never happen
      throw new RuntimeErrorC("cannot evaluate expression of kind " + node.kind);
  }
};

// Do one two-sided operation, following C's rules.
function applyBinary(op, left, right) {                           // the symbol and both values
  const a = toNumber(left), b = toNumber(right);                  // turn both into numbers
  // If either side keeps decimals, the answer does too. This is the C rule that
  // makes 7 / 2 equal 3 but 7.0 / 2 equal 3.5.
  const decimal = isFloatValue(left) || isFloatValue(right);      // is this decimal arithmetic?
  const keep = v => decimal ? new CFloat(v) : v;                  // mark the answer when it is
  switch (op) {                                                   // which operation is it?
    case "+": return keep(a + b);                                 // add
    case "-": return keep(a - b);                                 // subtract
    case "*": return keep(a * b);                                 // multiply
    case "/":                                                     // divide
      if (b === 0) throw new RuntimeErrorC("Floating point exception (division by zero)");
      return decimal ? new CFloat(a / b) : Math.trunc(a / b);     // whole numbers divide to whole numbers
    case "%":                                                     // remainder
      if (b === 0) throw new RuntimeErrorC("Floating point exception (division by zero)");
      return a % b;                                               // what is left over
    case "<": return a < b ? 1 : 0;                               // comparisons give 1 or 0
    case ">": return a > b ? 1 : 0;                               // ...
    case "<=": return a <= b ? 1 : 0;
    case ">=": return a >= b ? 1 : 0;
    case "==": return a === b ? 1 : 0;
    case "!=": return a !== b ? 1 : 0;
    case "&": return a & b;                                       // bit by bit "and"
    case "|": return a | b;                                       // bit by bit "or"
    case "^": return a ^ b;                                       // bit by bit "exclusive or"
    case "<<": return a << b;                                     // shift the bits left
    case ">>": return a >> b;                                     // shift the bits right
    default: throw new RuntimeErrorC("unknown operator '" + op + "'");
  }
}

// Turn anything into a number the way C would.
function toNumber(value) {                                        // the value to convert
  if (typeof value === "number") return value;                    // already a number
  if (value instanceof CFloat) return value.value;                // a float: take the number inside
  if (typeof value === "boolean") return value ? 1 : 0;           // true is 1, false is 0
  if (typeof value === "string") return value.length ? value.charCodeAt(0) : 0; // first letter
  if (value instanceof CArray) return value.data[0] || 0;         // the first element
  if (value && value.get) return toNumber(value.get());           // a place: read it first
  return 0;                                                       // anything else counts as zero
}

/* =====================================================================
   SECTION 12 : THE C LIBRARY
   printf, scanf and the handful of other functions programs normally use.
   ===================================================================== */

// Build the text that printf would print.
function formatPrintf(format, args) {                             // the format text and the values
  let out = "";                                                   // the finished text
  let argIndex = 0;                                               // which value comes next
  for (let i = 0; i < format.length; i++) {                       // walk through the format
    if (format[i] !== "%") { out += format[i]; continue; }         // ordinary characters pass through
    if (format[i + 1] === "%") { out += "%"; i++; continue; }      // "%%" means a real percent sign

    let spec = "%";                                               // collect the whole instruction
    let j = i + 1;                                                // start after the "%"
    while (j < format.length && "-+ #0".includes(format[j])) spec += format[j++];   // flags
    while (j < format.length && /[0-9]/.test(format[j])) spec += format[j++];       // width
    if (format[j] === ".") { spec += format[j++]; while (/[0-9]/.test(format[j])) spec += format[j++]; }
    while (j < format.length && "hlLzj".includes(format[j])) spec += format[j++];   // length, e.g. "ld"
    const type = format[j];                                       // the final letter: d, f, s ...
    if (type === undefined) { out += spec; break; }               // a stray "%" at the end
    spec += type;                                                 // the instruction is complete
    i = j;                                                        // continue after it

    const raw = args[argIndex++];                                 // the value to print
    const flags = spec.slice(1, spec.length - 1);                 // everything between % and the letter
    const leftAlign = flags.includes("-");                        // "-" means pad on the right
    const zeroPad = /(^|[^.\d])0/.test(flags);                    // "0" means pad with zeros
    const widthMatch = flags.match(/(?:^|[^.])(\d+)/);            // the width, if given
    const width = widthMatch ? parseInt(widthMatch[1], 10) : 0;   // as a number
    const precisionMatch = flags.match(/\.(\d+)/);                // the ".2" part, if given
    const precision = precisionMatch ? parseInt(precisionMatch[1], 10) : null;

    let text;                                                     // the value as text
